/* Linked headlines first, then unlinked ones, so the clickable material is
   at the top where it is useful. */
function todayRefs(){
 const b=DB.briefing;if(!b)return [];
 const out=[],seen=new Set();
 for(const l of b.links||[]){
  const k=l.title.slice(0,60);if(seen.has(k))continue;seen.add(k);out.push(l);}
 for(const it of b.items||[]){
  const k=it.title.slice(0,60);if(seen.has(k))continue;seen.add(k);out.push(it);}
 return out;
}
/* Links arrive from another system. Only http(s) is ever put in an href. */
function safeUrl(u){
 try{const p=new URL(u);return /^https?:$/.test(p.protocol)?p.href:'';}catch(e){return '';}
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u.slice(0,30);}}
/* Headings carry the shape of the briefing, so they survive into the preview. */
function fmtFeed(t){
 return String(t||'').split('\n').map(l=>{
  const line=l.trim();
  if(!line)return '';
  if(line.startsWith('## ')||line.startsWith('# '))
   return `<h4 class="fh">${esc(line.replace(/^#+\s*/,''))}</h4>`;
  if(line.startsWith('### '))return `<h4 class="fh">${esc(line.slice(4))}</h4>`;
  if(line==='---')return '<hr class="fhr">';
  return `<p>${esc(line)}</p>`;}).join('');
}

/* Daily writing. The prompt comes from what was actually read today and the
   constraint from what was actually saved, so there is never a blank page and
   the words get used rather than only collected. */
function todayPrompt(){
 const b=DB.briefing;
 const links=b?.links||[];
 if(links.length){
  const l=links[new Date().getDate()%links.length];
  return `On today's feed — "${l.title.slice(0,90)}": what follows from it, and what do you doubt?`;}
 if(b?.docs?.length)return `On ${b.docs[0].title}: which claim is strongest, and which is weakest?`;
 const t=[...K.thoughts].slice(-1)[0];
 if(t)return 'Take your last memo further, in English: '+t.body.slice(0,90);
 const d=DB.index.docs.find(x=>x.progress>.02);
 return d?`What is the main claim of "${d.title}", and do you accept it?`
        :'What did you read today, and what changed your mind?';
}

/* What has gone longest without being looked at, rather than what is newest
   or a random draw — so every note eventually comes back around, and the
   ones you keep ignoring come back first. Opening one (or "show me different
   ones") marks it seen and sends it to the back of the queue. */
function pickResurfaced(n){
 const pool=[...K.thoughts,...K.questions.filter(q=>(q.status||'Unanswered')==='Answered')];
 const old=Date.now()-14*864e5;
 return pool
  .filter(o=>new Date(o.createdAt).getTime()<old)
  .sort((a,b)=>String(a.lastSeenAt||a.createdAt).localeCompare(String(b.lastSeenAt||b.createdAt)))
  .slice(0,n);
}

/* ---------- searching inside documents ----------
   Global search used to look at titles and authors only, which meant the
   text of everything you'd read was invisible to it — including a PDF's,
   even though the words are sitting right there in its search text.

   Bodies are big, so they aren't held in memory up front: each document's
   text is parsed and lowercased the first time a search needs it, then kept
   for the rest of the session. A phrase found this way carries the sentence
   around it, and opening the result hands the phrase to the reader so a PDF
   lands on the page the phrase is actually on. */
const bodyIndex={};
function bodyTextOf(id){
 if(bodyIndex[id]!==undefined)return bodyIndex[id];
 let txt=docCache[id]?.content;
 if(txt===undefined){
  try{txt=JSON.parse(localStorage.getItem('pkos:doc:'+id)||'null')?.content;}catch(e){txt=null;}
 }
 bodyIndex[id]=typeof txt==='string'?txt.toLowerCase():null;
 return bodyIndex[id];
}
function snippetAround(lower,id,at,len){
 const raw=docCache[id]?.content||(()=>{try{return JSON.parse(localStorage.getItem('pkos:doc:'+id)||'null')?.content||'';}catch(e){return '';}})();
 const from=Math.max(0,at-48),to=Math.min(raw.length,at+len+64);
 return (from?'…':'')+raw.slice(from,to).replace(/\s+/g,' ').trim()+(to<raw.length?'…':'');
}
function searchBodies(q){
 const out=[];
 for(const d of DB.index.docs){
  const low=bodyTextOf(d.id);if(!low)continue;
  const at=low.indexOf(q);if(at<0)continue;
  out.push({id:d.id,title:d.title,snippet:snippetAround(low,d.id,at,q.length)});
  if(out.length>=12)break;
 }
 return out;
}
/* Whatever isn't cached on this device still lives in Postgres. One ilike
   over a personal library is a small scan and needs no migration; the ids it
   returns are merged in beside the local hits. */
const remoteBody={q:null,ids:[]};
async function searchBodiesRemote(q){
 if(!SB.on||q.length<3||remoteBody.q===q)return;
 remoteBody.q=q;remoteBody.ids=[];
 try{
  const r=await sbRest(`documents?content=ilike.*${encodeURIComponent(q)}*&select=id&limit=12`);
  if(r.ok)remoteBody.ids=(await r.json()).map(x=>x.id);
 }catch(e){/* offline: local hits are still worth showing */}
 if(state.query.toLowerCase()===q)viewSearch();
}
function viewSearch(){
 const q=state.query.toLowerCase(),hit=(...f)=>f.filter(Boolean).join(' ').toLowerCase().includes(q);
 $tb.textContent='Search';
 const inBody=q.length>=2?searchBodies(q):[];
 const seen=new Set(inBody.map(b=>b.id));
 if(q.length>=3){
  searchBodiesRemote(q);
  if(remoteBody.q===q)remoteBody.ids.forEach(id=>{
   if(seen.has(id))return;
   const m=meta(id);if(!m)return;
   inBody.push({id,title:m.title,snippet:'Found in this document — open to see it in place'});
   seen.add(id);
  });
 }
 const g=[
  ['Documents',DB.index.docs.filter(d=>hit(d.title,d.author)),d=>({t:d.title,s:d.author,open:d.id})],
  ['In documents',inBody,b=>({t:b.title,s:b.snippet,open:b.id,find:state.query})],
  ['Words',K.vocabulary.filter(v=>hit(v.word,v.meaning,v.contextualMeaning,(v.tags||[]).join(' '))),v=>({t:v.word,s:v.contextualMeaning,item:'vocabulary:'+v.id})],
  ['Concepts',K.concepts.filter(c=>hit(c.name,c.definition)),c=>({t:c.name,s:c.definition,item:'concepts:'+c.id})],
  ['Thoughts',K.thoughts.filter(x=>hit(x.body)),x=>({t:x.body.slice(0,70),s:'',item:'thoughts:'+x.id})],
  ['Questions',K.questions.filter(x=>hit(x.body)),x=>({t:x.body.slice(0,70),s:x.status,item:'questions:'+x.id})],
  ['Writing',(K.writings||[]).filter(w=>hit(w.body,w.corrected,w.prompt)),w=>({t:(w.prompt||w.body).slice(0,70),s:w.corrected,item:'writings:'+w.id})],
  ['Marks',K.highlights.filter(h=>hit(h.selectedText,h.note,(h.tags||[]).join(' '))),h=>({t:h.selectedText.slice(0,70),s:meta(h.documentId)?.title,item:'highlights:'+h.id})]];
 const total=g.reduce((n,[,l])=>n+l.length,0);
 $view.innerHTML=`<div class="view"><div class="largetitle"><h1>${esc(state.query)}</h1><span class="c">${total}</span></div>
  ${g.filter(([,l])=>l.length).map(([label,list,map])=>`<h3 class="sec">${label}
   <span style="color:var(--label3);font-size:13px;font-weight:450;margin-left:6px">${list.length}</span></h3>
   <div class="list">${list.slice(0,8).map(o=>{const r=map(o);
    return `<button class="item" ${r.open?`data-open="${r.open}"${r.find?` data-find="${esc(r.find)}"`:''}`:`data-item="${r.item}"`}>
    <h4>${esc(r.t)}</h4>${r.s?`<div class="b">${esc(String(r.s))}</div>`:''}</button>`}).join('')}</div>`).join('')
   ||'<div class="empty">No results</div>'}</div>`;
}

  const gone=new Set(K.highlights.filter(h=>h.documentId===id).map(h=>h.id));
  // A tombstone, not just a local removal — otherwise the next pull from
  // another device just adds this document straight back, since a normal
  // merge only ever adds what it doesn't have. Marking it deleted lets

  // words and memos survive their document, but must not keep pointing at it
  ['vocabulary','concepts','thoughts','questions'].forEach(k=>K[k].forEach(o=>{
   if(o.sourceDocumentId===id)o.sourceDocumentId=null;
   if(gone.has(o.sourceHighlightId))o.sourceHighlightId=null;}));

 const cm=T.closest('[data-commit]');
 if(cm){const kind=cm.dataset.commit,body=($('cbody')?.value||'').trim(),name=($('cname')?.value||'').trim();
  const c=state.panel.ctx||{};
  if(kind==='concept'&&!name)return toast('Name required');
  if(kind!=='concept'&&!body)return toast('Nothing to save');
  const base={id:uid(kind),sourceDocumentId:c.documentId||null,sourceSentence:c.sentence||'',
   sourceHighlightId:c.id||null,createdAt:now(),updatedAt:now(),origin:'user'};
  if(kind==='concept')K.concepts.push({...base,name,definition:body,interval:0,nextReviewAt:dayjs(2)});
  if(kind==='thought')K.thoughts.push({...base,body});
  if(kind==='question')K.questions.push({...base,body,status:'Unanswered',answer:''});
  save('pkos:knowledge');state.panel=null;render();return toast('Saved');}
 const ut=T.closest('[data-untag]');
 if(ut){const[k,id,tag]=ut.dataset.untag.split(':');const o=K[k].find(x=>x.id===id);
  o.tags=(o.tags||[]).filter(x=>x!==tag);save('pkos:knowledge');return paintPanel();}
 const dl=T.closest('[data-del]');
 if(dl){const[k,id]=dl.dataset.del.split(':');K[k]=K[k].filter(x=>x.id!==id);
  save('pkos:knowledge');state.panel=null;
  if(state.view==='reader'){readerShownBefore=readerShown;await viewReader(true);}
  toast('Deleted');return render();}
 if(T.closest('[data-close]')){state.panel=null;return paintPanel();}
 if(T.closest('#addbtn')){
  const url=$('nsrclink')?.value.trim();
  await addDoc($('ntitle').value,$('nauthor').value,$('paste').value,$('ndomain').value,null,null,url);
  if(state.panel?.type==='adddoc'){state.panel=null;paintPanel();}
  return;}
 if(!T.closest('.callout')&&!T.closest('.actionbar'))killCo();
 }catch(err){console.error(err);toast('Error: '+(err.message||err));}
});
async function act2(mode,ctx){
 const key=hash(mode+'|'+ctx.text+'|'+ctx.sentence);
 state.panel={type:'result',mode,ctx,loading:true};paintPanel();
 try{const{data}=await llm(mode,ctx.text,ctx.sentence,ctx.lang,key);
  state.panel={type:'result',mode,ctx,data};}
 catch(e){state.panel={type:'result',mode,ctx,error:e.message};}
 paintPanel();
}
document.addEventListener('keydown',e=>{
 if(e.target.id==='clozein'&&e.key==='Enter'){
  const v=state.testQueue[0];
  state.clozeOk=e.target.value.trim().toLowerCase()===String(v.word).trim().toLowerCase();
  return render();}
 const ti=e.target.closest?.('[data-tagfor]');
 if(ti&&e.key==='Enter'){
  const[k,id]=ti.dataset.tagfor.split(':');const o=K[k].find(x=>x.id===id);
  const v=ti.value.trim().toLowerCase();
  if(v&&!(o.tags||[]).includes(v)){o.tags=[...(o.tags||[]),v];save('pkos:knowledge');paintPanel();}
  return;}
 if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('q').focus();}
 if(e.key==='Escape'){killCo();if(state.panel){state.panel=null;paintPanel();}}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='readnum'){
  DB.prefs.read=Math.max(13,Math.min(34,+e.target.value||19));applyPrefs();store.set('pkos:prefs',DB.prefs);return;}
 if(e.target.id==='newnum'){
  DB.prefs.newPerDay=Math.max(1,Math.min(60,+e.target.value||10));store.set('pkos:prefs',DB.prefs);return;}
 if(e.target.id==='importfile'){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{const res=await importAll(r.result);
    render();toast(`Imported ${res.docs} documents, ${res.items} items`);}
   catch(err){toast('Import failed: '+err.message);}};
  r.readAsText(f);return;}
 if(e.target.id!=='file')return;
 const f=e.target.files[0];e.target.value='';
 handleFilePick(f);
});
/* One entry point for "a file arrived" — used by both the file picker and
   drag-and-drop, so PDF/txt handling only exists in one place. */
function downloadBlob(blob,filename){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=filename;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function handleFilePick(f){
 if(!f)return;
 const isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
 const isEpub=/\.epub$/i.test(f.name)||f.type==='application/epub+zip';
 if(isEpub){
  if(!SB.on)return toast('Sign in first — a book needs Supabase Storage to live in, so every device can open the same one');
  downloadBlob(f,f.name);
  const docId=uid('doc');
  showProgress('Reading…');
  try{
   const{text,chapters,title,author}=await extractEpubText(f,(n,total)=>showProgress(`Reading chapter ${n} of ${total}…`));
   showProgress('Uploading original…');
   const filePath=`${SB.user.id}/${docId}/original.epub`;
   await sbUploadAsset(filePath,f);
   hideProgress();
   await addDoc(title||f.name.replace(/\.epub$/i,''),author||'Upload',text||f.name,DOMAINS[1],null,docId,null,
    {kind:'epub',filePath,chapters,fileSize:f.size});
   toast(`Added — ${chapters} chapter${chapters===1?'':'s'}`);
  }catch(err){hideProgress();toast('Could not read that book: '+err.message);}
  return;}
 if(isPdf){
  // The original PDF itself is what gets read (see the "PDF: native page
  // rendering" section) — it has to live somewhere every device can fetch
  // it from, which means Storage, which means signed in.
  if(!SB.on)return toast('Sign in first — a PDF needs Supabase Storage to live in, so every device can open the same one');
  downloadBlob(f,f.name);   // keep a copy of the original before touching it at all
  const title=f.name.replace(/\.pdf$/i,''),docId=uid('doc');
  showProgress('Reading…');
  try{
   const{text,pageCount}=await extractPdfSearchText(f,(n,total)=>showProgress(`Reading page ${n} of ${total}…`));
   showProgress('Uploading original…');
   const pdfPath=`${SB.user.id}/${docId}/original.pdf`;
   await sbUploadAsset(pdfPath,f);
   hideProgress();
   await addDoc(title,'Upload',text||title,DOMAINS[0],null,docId,null,{kind:'pdf',pdfPath,pageCount,fileSize:f.size});
   toast(`Added — ${pageCount} page${pageCount===1?'':'s'}, original saved to your downloads`);
  }catch(err){hideProgress();toast('Could not read that PDF: '+err.message);}
  return;}
 // There's no image parser here either — reading one as text doesn't
 // "extract the text and drop the pictures," it just decodes binary bytes
 // as if they were UTF-8, which comes out as garbage. Refuse it outright
 // rather than let that fail silently.
 if(!/\.(txt|md|markdown)$/i.test(f.name)&&f.type!=='text/plain')
  return toast('Only .txt, .md, .pdf and .epub files are supported right now');
 const r=new FileReader();
 r.onload=()=>addDoc(f.name.replace(/\.(txt|md|markdown)$/i,''),'Upload',r.result,DOMAINS[0]);
 r.readAsText(f);
}
document.addEventListener('dragover',e=>{
 const c=document.getElementById('libview');if(!c)return;
 e.preventDefault();c.classList.add('dragover');
});
document.addEventListener('dragleave',e=>{
 const c=document.getElementById('libview');if(c&&!c.contains(e.relatedTarget))c.classList.remove('dragover');
});
document.addEventListener('drop',e=>{
 const c=document.getElementById('libview');if(!c)return;
 e.preventDefault();c.classList.remove('dragover');
 handleFilePick(e.dataTransfer.files[0]);
});
let qt=null;
document.getElementById('q').addEventListener('input',e=>{
 clearTimeout(qt);const v=e.target.value.trim();
 qt=setTimeout(()=>{state.query=v;$main.scrollTop=0;render();},220);
});
/* Find-in-document is a different search from the app-wide one above: it
   never leaves the document, it just says which pages a phrase is on. The
   box only exists while a PDF is open, so this is delegated rather than
   bound to the element. */
let pft=null;
document.addEventListener('input',e=>{
 if(e.target.id==='lpq'){
  if(state.panel?.type==='linkpick'){state.panel.q=e.target.value;
   const at=e.target.selectionStart;paintPanel();
   const box=$('lpq');if(box){box.focus();box.setSelectionRange(at,at);}}
  return;}
 if(e.target.id!=='pdffind')return;
 clearTimeout(pft);const v=e.target.value;
 pft=setTimeout(()=>{pdfFind(v);if(window.innerWidth<=1120&&v.trim().length>=2)$panel.classList.add('open');},320);
});
function toast(msg){
 document.querySelectorAll('.toast').forEach(t=>t.remove());
 const el=document.createElement('div');el.className='toast';el.textContent=msg;
 document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
}
/* Unlike toast(), this doesn't auto-dismiss — a page-by-page PDF import can
   run well past toast's 1.8s window, and a progress line that vanishes
   partway through reads as "did this freeze?" rather than "still working." */
function showProgress(msg){
 let el=document.getElementById('pdfprogress');
 if(!el){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  el=document.createElement('div');el.id='pdfprogress';el.className='toast';
  document.body.appendChild(el);}
 el.textContent=msg;
}
function hideProgress(){document.getElementById('pdfprogress')?.remove();}
</script>
