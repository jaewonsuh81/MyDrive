<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>MyDrive</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyDrive">
<meta name="description" content="Read, look up, keep.">
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"AppleMyungjo","Nanum Myeongjo",Georgia,serif;
  --blue:#007AFF; --blue-press:#0066D6;
  --label:#1D1D1F; --label2:#6E6E73; --label3:#8E8E93; --label4:#B0B0B5;
  --window:#F5F5F7; --content:#FFFFFF; --elevated:#FFFFFF;
  --reading:#FFFFFF; --reading-ink:#1D1D1F;
  --fill1:rgba(116,116,128,.16); --fill2:rgba(116,116,128,.10); --fill3:rgba(116,116,128,.06);
  --sep:rgba(60,60,67,.14); --sep-strong:rgba(60,60,67,.24);
  --glass:rgba(246,246,248,.72);
  --shadow-s:0 1px 2px rgba(0,0,0,.05);
  --shadow-m:0 4px 16px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --shadow-l:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --r1:8px; --r2:12px; --r3:16px; --r4:22px;
  --ease:cubic-bezier(.32,.72,0,1);
  --hl-yellow:#FFE884; --hl-green:#B8F0C0; --hl-blue:#B9DEFF; --hl-pink:#FFC9DE; --hl-purple:#DECCFF;
}
[data-theme="dark"]{
  --label:#F5F5F7; --label2:#98989D; --label3:#8E8E93; --label4:#5A5A5F;
  --window:#161618; --content:#1C1C1E; --elevated:#242426;
  --reading:#1C1C1E; --reading-ink:#D8D8DD;
  --blue:#0A84FF; --blue-press:#3D9BFF;
  --fill1:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24); --fill3:rgba(120,120,128,.14);
  --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.18);
  --glass:rgba(30,30,32,.72);
  --shadow-m:0 4px 16px rgba(0,0,0,.4); --shadow-l:0 16px 48px rgba(0,0,0,.55);
  --hl-yellow:#6B5A16; --hl-green:#22563A; --hl-blue:#1C4269; --hl-pink:#5F2440; --hl-purple:#3E2E63;
}
@media (prefers-color-scheme:dark){
  [data-theme="auto"]{
    --label:#F5F5F7; --label2:#98989D; --label3:#8E8E93; --label4:#5A5A5F;
    --window:#161618; --content:#1C1C1E; --elevated:#242426;
    --reading:#1C1C1E; --reading-ink:#D8D8DD;
    --blue:#0A84FF; --blue-press:#3D9BFF;
    --fill1:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24); --fill3:rgba(120,120,128,.14);
    --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.18);
    --glass:rgba(30,30,32,.72);
    --shadow-m:0 4px 16px rgba(0,0,0,.4); --shadow-l:0 16px 48px rgba(0,0,0,.55);
    --hl-yellow:#6B5A16; --hl-green:#22563A; --hl-blue:#1C4269; --hl-pink:#5F2440; --hl-purple:#3E2E63;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--window);color:var(--label);font-family:var(--ui);font-size:14px;
  line-height:1.47;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 35%,transparent);border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--fill1);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:230px minmax(0,1fr) 372px;height:100dvh;overflow:hidden}
.sidebar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-right:1px solid var(--sep);display:flex;flex-direction:column;padding:14px 12px 12px;overflow:auto}
.mark{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:16px}
.mark .glyph{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,var(--blue),color-mix(in srgb,var(--blue) 55%,#5E5CE6));
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:640;letter-spacing:-.02em;box-shadow:var(--shadow-s)}
.mark b{font-size:15px;font-weight:600;letter-spacing:-.018em}
.sectitle{font-size:11px;font-weight:590;color:var(--label3);padding:0 8px;margin:12px 0 5px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r1);
  transition:background .12s ease;font-size:13.5px;font-weight:450}
.navbtn svg{width:17px;height:17px;flex:none;color:var(--label2);transition:color .12s}
.navbtn .n{margin-left:auto;font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums}
.navbtn:hover{background:var(--fill3)}
.navbtn[aria-current="true"]{background:var(--fill2);font-weight:510}
.navbtn[aria-current="true"] svg{color:var(--blue)}
.navbtn[aria-current="true"] .n{color:var(--label2)}
.usage{margin-top:auto;background:var(--fill3);border-radius:var(--r2);padding:10px 12px;font-size:12px;color:var(--label2)}
.usage .u{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.usage b{font-weight:590;color:var(--label);font-variant-numeric:tabular-nums;font-size:13px}
.themetog{display:flex;gap:2px;margin-top:9px;background:var(--fill2);border-radius:8px;padding:2px}
.themetog button{flex:1;padding:4px 0;border-radius:6px;font-size:11px;color:var(--label2);transition:.16s var(--ease)}
.themetog button[aria-current="true"]{background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s);font-weight:510}

.main{background:var(--content);overflow:auto;position:relative;scroll-behavior:smooth}
.toolbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;
  background:color-mix(in srgb,var(--content) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent;transition:border-color .2s ease}
.toolbar.scrolled{border-bottom-color:var(--sep)}
.tbtitle{font-size:14px;font-weight:590;letter-spacing:-.01em;opacity:0;transform:translateY(3px);
  transition:opacity .22s var(--ease),transform .22s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.toolbar.scrolled .tbtitle{opacity:1;transform:none}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:6px;background:var(--fill3);border:1px solid transparent;border-radius:var(--r1);
  padding:5px 9px;width:200px;transition:.18s var(--ease)}
.field:focus-within{background:var(--elevated);border-color:var(--sep-strong);width:264px;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.field svg{width:14px;height:14px;color:var(--label3);flex:none}
.field input{border:none;background:none;outline:none;width:100%;font-size:13px}
.field input::placeholder{color:var(--label3)}
.iconbtn{width:30px;height:30px;border-radius:var(--r1);display:grid;place-items:center;color:var(--label2);transition:.12s}
.iconbtn:hover{background:var(--fill3);color:var(--label)}
.iconbtn svg{width:17px;height:17px}

.view{padding:8px 24px 140px;max-width:820px}
.largetitle{display:flex;align-items:baseline;gap:10px;padding:16px 0 20px}
.largetitle h1{font-size:32px;font-weight:640;letter-spacing:-.024em;line-height:1.1;margin:0}
.largetitle .c{font-size:16px;color:var(--label3);font-variant-numeric:tabular-nums}
.largetitle .spacer{flex:1}

.btn{border-radius:var(--r1);padding:6px 14px;font-size:13.5px;font-weight:510;background:var(--blue);color:#fff;transition:.12s ease;white-space:nowrap}
.btn:hover{background:var(--blue-press)} .btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill2);color:var(--label)} .btn.sec:hover{background:var(--fill1)}
.btn.plain{background:none;color:var(--blue);padding:6px 8px} .btn.plain:hover{background:var(--fill3)}
.btn.danger{background:none;color:#FF3B30;padding:5px 9px;font-size:12.5px}
.btn.danger:hover{background:color-mix(in srgb,#FF3B30 10%,transparent)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.tin{background:var(--elevated);border:1px solid var(--sep-strong);border-radius:var(--r1);padding:7px 10px;font-size:13.5px;min-width:0;transition:.15s ease}
.tin:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.seg{display:inline-flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin:0 0 18px;flex-wrap:wrap}
.seg button{padding:5px 13px;border-radius:7px;font-size:13px;color:var(--label2);transition:.18s var(--ease)}
.seg button[aria-current="true"]{background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s);font-weight:510}
.seg .n{font-variant-numeric:tabular-nums;opacity:.55;margin-left:4px;font-size:12px}

.list{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 15px;text-align:left;transition:background .1s;position:relative}
.row+.row::before,.item+.item::before{content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--sep)}
@media (min-resolution:2dppx){.row+.row::before,.item+.item::before{height:.5px}}
.row:hover,.item:hover{background:var(--fill3)}
.row .cover{width:38px;height:50px;border-radius:4px;flex:none;background:linear-gradient(150deg,var(--fill2),var(--fill1));
  display:grid;place-items:center;font-family:var(--serif);font-size:17px;color:var(--label2);box-shadow:var(--shadow-s)}
.row .txt{min-width:0;flex:1}
.row h3{font-size:14.5px;font-weight:530;letter-spacing:-.01em;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pct{font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums;flex:none}
.row .bar{width:44px;height:3px;border-radius:99px;background:var(--fill1);overflow:hidden;flex:none}
.row .bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.chev{color:var(--label4);flex:none} .chev svg{width:13px;height:13px}
.empty{border:1px dashed var(--sep-strong);border-radius:var(--r2);padding:26px;color:var(--label3);font-size:13.5px;text-align:center}
.addcard{margin-top:22px;background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:16px}
.addcard textarea{width:100%;min-height:88px;resize:vertical;background:var(--content);border:1px solid var(--sep-strong);
  border-radius:var(--r1);padding:10px;font-size:13.5px;line-height:1.55}
.addcard textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.flexrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

.reader{max-width:none;padding:0 0 46vh}
.rhead{max-width:33em;margin:20px auto 32px;padding:0 24px}
.rhead h1{font-family:var(--serif);font-size:31px;font-weight:600;line-height:1.16;letter-spacing:-.015em;margin:12px 0 9px}
.rhead .meta{font-size:13px;color:var(--label2)}
.doctext{font-family:var(--serif);font-size:var(--read,19px);line-height:1.68;letter-spacing:-.003em;max-width:33em;margin:0 auto;padding:0 24px;color:var(--reading-ink)}
.doctext p{margin:0 0 1.35em;white-space:pre-wrap}
.doctext ::selection{background:color-mix(in srgb,var(--blue) 26%,transparent)}
mark.hl{color:inherit;padding:.06em 0;border-radius:2px;cursor:pointer;background:var(--hl-yellow);
  transition:filter .12s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hl[data-c="green"]{background:var(--hl-green)} mark.hl[data-c="blue"]{background:var(--hl-blue)}
mark.hl[data-c="pink"]{background:var(--hl-pink)} mark.hl[data-c="purple"]{background:var(--hl-purple)}
mark.hl:hover{filter:brightness(.94)} mark.hl.on{box-shadow:0 0 0 2px var(--blue)}
.known{border-bottom:1.5px dotted color-mix(in srgb,var(--blue) 55%,transparent);cursor:pointer}
/* selection action bar — always in the same place, never covers the line you read */
.abar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);z-index:70;
  display:flex;align-items:center;gap:1px;max-width:min(94vw,780px);
  background:color-mix(in srgb,var(--elevated) 86%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);
  border:1px solid var(--sep);border-radius:15px;box-shadow:var(--shadow-l);padding:4px;
  transition:transform .34s var(--ease),opacity .22s ease;opacity:0;overflow-x:auto;scrollbar-width:none}
.abar::-webkit-scrollbar{display:none}
.abar.on{transform:translate(-50%,0);opacity:1}
.abar .sel{font-family:var(--serif);font-size:13px;color:var(--label2);padding:0 11px 0 8px;
  max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.abar .d{width:1px;align-self:stretch;background:var(--sep);margin:5px 3px;flex:none}
.abar button{padding:9px 13px;border-radius:11px;font-size:13.5px;white-space:nowrap;flex:none;transition:background .1s}
.abar button:hover{background:var(--fill2)}
.abar button.pr{background:var(--blue);color:#fff;font-weight:510}
.abar button.pr:hover{background:var(--blue-press)}
.tbextra{display:flex;align-items:center;gap:2px}
.tbextra .sz{width:30px;height:30px;border-radius:var(--r1);display:grid;place-items:center;color:var(--label2);font-weight:590}
.tbextra .sz:hover{background:var(--fill3);color:var(--label)}
.sortsel{background:var(--fill3);border:1px solid transparent;border-radius:var(--r1);padding:5px 9px;
  font-size:12.5px;color:var(--label2);outline:none}
.sortsel:focus{border-color:var(--blue)}
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.scard{flex:none;width:186px;text-align:left;background:var(--elevated);border:1px solid var(--sep);
  border-radius:var(--r2);padding:13px;transition:.14s}
.scard:hover{box-shadow:var(--shadow-m);transform:translateY(-1px)}
.scard h4{font-size:13.5px;font-weight:530;margin:0 0 6px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .bar{height:3px;border-radius:99px;background:var(--fill1);overflow:hidden}
.scard .bar i{display:block;height:100%;background:var(--blue)}
.scard .p{font-size:11.5px;color:var(--label3);margin-top:5px;font-variant-numeric:tabular-nums}
.readwrap{display:grid;grid-template-columns:minmax(0,32em) 0;justify-content:center;position:relative;padding:0 24px}
.readwrap.wide{grid-template-columns:minmax(0,32em) 184px;gap:26px}
.readwrap .doctext{padding:0;max-width:none;margin:0}
.gutter{position:relative}
.mnote{position:absolute;width:184px;font-size:12px;line-height:1.45;color:var(--label2);
  border-left:2px solid var(--hl-yellow);padding:1px 0 1px 9px;cursor:pointer;transition:color .12s}
.mnote:hover{color:var(--label)}
.mnote .t{font-size:10.5px;color:var(--label3);display:block;margin-bottom:2px;letter-spacing:.01em}
.labelrow{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:99px;
  background:var(--fill3);border:1px solid transparent;transition:.14s;color:var(--label2)}
.lchip:hover{background:var(--fill2)}
.lchip[aria-current="true"]{border-color:var(--sep-strong);background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s)}
.lchip i{width:9px;height:9px;border-radius:50%;display:block}
.lchip .n{font-variant-numeric:tabular-nums;opacity:.5;font-size:11.5px}
.linput{border:none;background:var(--fill3);border-radius:6px;font-size:12.5px;padding:4px 8px;outline:none;
  width:130px;border:1px solid transparent}
.linput:focus{border-color:var(--blue);background:var(--elevated)}

.callout{position:absolute;z-index:60;display:flex;align-items:stretch;
  background:color-mix(in srgb,var(--elevated) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--sep);border-radius:var(--r2);box-shadow:var(--shadow-l);overflow:hidden;
  transform:translate(-50%,-100%);transform-origin:50% 100%;animation:callout .18s var(--ease)}
@keyframes callout{from{opacity:0;transform:translate(-50%,-96%) scale(.94)}}
.callout button{padding:8px 13px;font-size:13.5px;white-space:nowrap;transition:background .1s}
.callout button:hover{background:var(--fill3)}
.callout .d{width:1px;background:var(--sep);flex:none}

.panel{background:var(--window);border-left:1px solid var(--sep);overflow:auto;padding:0 0 60px}
.phead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;
  background:color-mix(in srgb,var(--window) 80%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--sep)}
.phead h4{font-size:13.5px;font-weight:590;margin:0;letter-spacing:-.008em}
.pbody{padding:14px 16px}
.card{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:15px;margin-bottom:11px;animation:rise .22s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.term{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.018em;line-height:1.15;margin:0 0 3px}
.pos{font-size:12.5px;color:var(--label3);margin-bottom:12px}
.f{margin:11px 0}
.f .k{font-size:11px;font-weight:590;color:var(--label3);margin-bottom:3px}
.f .v{font-size:13.5px;line-height:1.5} .f .v.ko{font-size:14.5px;line-height:1.55}
.quote{border-left:2px solid var(--blue);padding:1px 0 1px 10px;font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--label2)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid var(--sep)}
.chips{display:flex;gap:7px;margin-top:10px}
.chip{width:24px;height:24px;border-radius:50%;border:1px solid var(--sep-strong);transition:.14s var(--ease)}
.chip:hover{transform:scale(1.12)}
.chip[aria-current="true"]{box-shadow:0 0 0 2px var(--elevated),0 0 0 4px var(--blue)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--fill2);color:var(--label2)}
.tg button{color:var(--label3);font-size:13px;line-height:1}
.tg button:hover{color:#FF3B30}
.taginput{border:none;background:var(--fill3);border-radius:99px;padding:4px 10px;font-size:12px;width:110px;outline:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:510;padding:2.5px 8px;border-radius:99px;background:var(--fill2);color:var(--label2)}
.badge.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.badge.due{background:color-mix(in srgb,#FF9500 18%,transparent);color:#C2700A}
[data-theme="dark"] .badge.due{color:#FF9F0A}
.spin{width:13px;height:13px;border:2px solid var(--fill1);border-top-color:var(--blue);border-radius:50%;
  animation:sp .65s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{border-radius:var(--r2);padding:13px;font-size:13px;line-height:1.5;background:color-mix(in srgb,#FF3B30 9%,transparent);color:#C4271D}
[data-theme="dark"] .err{color:#FF6961}

.item{width:100%;text-align:left;padding:14px 15px;position:relative;transition:background .1s;display:block}
.item h4{font-size:14.5px;font-weight:530;margin:0 0 3px;letter-spacing:-.008em}
.item .b{font-size:13px;color:var(--label2);line-height:1.45;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--label3);margin-top:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.rv{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r3);padding:34px 26px;max-width:520px;text-align:center;box-shadow:var(--shadow-m)}
.rvterm{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
.qtype{font-size:11px;font-weight:590;color:var(--label3);letter-spacing:.02em;margin-bottom:14px}
.qsent{font-family:var(--serif);font-size:19px;line-height:1.62;text-align:left;margin:2px 0 18px}
.opts{display:grid;gap:8px;margin-top:20px}
.opt{padding:12px 14px;border-radius:var(--r1);background:var(--fill3);border:1px solid transparent;
  text-align:left;font-size:14.5px;line-height:1.4;transition:.14s}
.opt:hover:not(:disabled){background:var(--fill2)}
.opt:disabled{cursor:default}
.opt.ok{background:color-mix(in srgb,#34C759 16%,transparent);border-color:#34C759}
.opt.no{background:color-mix(in srgb,#FF3B30 12%,transparent);border-color:#FF3B30}
.cin{width:100%;text-align:center;font-family:var(--serif);font-size:22px;padding:11px;margin-bottom:14px;
  border-radius:var(--r1);border:1px solid var(--sep-strong);background:var(--content);outline:none}
.cin:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.pbar{height:3px;background:var(--fill1);border-radius:99px;overflow:hidden;margin:0 0 20px;max-width:520px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s var(--ease)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.grade button{padding:11px 0;border-radius:var(--r1);background:var(--fill2);font-size:13.5px;font-weight:510;transition:.12s}
.grade button:hover{background:var(--fill1)} .grade button:active{transform:scale(.97)}
.grade small{display:block;font-size:10.5px;color:var(--label3);font-weight:400;margin-top:2px}
.stats{display:flex;flex-wrap:wrap;background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:18px 4px;margin-bottom:26px}

.stat+.stat::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--sep)}
.stat .v{font-size:27px;font-weight:620;letter-spacing:-.022em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--label2);margin-top:3px}
h3.sec{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:26px 0 10px}

.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,0);z-index:99;
  background:color-mix(in srgb,var(--elevated) 84%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--sep);box-shadow:var(--shadow-l);border-radius:99px;padding:9px 18px;font-size:13px;animation:hud .28s var(--ease)}
@keyframes hud{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
.grabber{display:none}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;gap:2px;overflow-x:auto;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--elevated) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--sep);box-shadow:0 -6px 24px rgba(0,0,0,.10);
  animation:barup .24s var(--ease)}
@keyframes barup{from{transform:translateY(100%)}}
.actionbar button{flex:none;padding:9px 15px;border-radius:var(--r1);font-size:14px;background:var(--fill3);white-space:nowrap}
.actionbar button:first-child{background:var(--blue);color:#fff;font-weight:510}
.rtools{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rtools .spacer{flex:1}
.szbtn{width:30px;height:28px;border-radius:var(--r1);background:var(--fill3);color:var(--label2);
  display:grid;place-items:center;transition:.12s}
.szbtn:hover{background:var(--fill2);color:var(--label)}
.dstat{font-size:12px;color:var(--label3);white-space:nowrap;flex:none}

@media (min-width:1121px){#panelbtn{display:none}}
@media (max-width:1120px){
  .app{grid-template-columns:214px minmax(0,1fr)}
  .panel{position:fixed;inset:auto 0 0 0;max-height:72dvh;border-left:none;border-top:1px solid var(--sep);
    border-radius:var(--r4) var(--r4) 0 0;z-index:50;box-shadow:var(--shadow-l);
    transform:translateY(101%);transition:transform .42s var(--ease);background:var(--elevated)}
  .panel.open{transform:translateY(0)}
  .phead{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:none;height:auto;padding:4px 16px 10px}
  .grabber{display:block;width:36px;height:5px;border-radius:99px;background:var(--fill1);margin:8px auto 2px}
  .card{background:var(--content)}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .sidebar{flex-direction:row;align-items:center;gap:4px;padding:8px 12px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--sep)}
  .sidebar .mark,.sidebar .usage,.sidebar .sectitle{display:none}
  .navbtn{width:auto;padding:6px 11px;white-space:nowrap} .navbtn .n{display:none}
  .toolbar{padding:0 14px;gap:8px} .field{width:140px} .field:focus-within{width:184px}
  .view{padding:4px 18px 140px} .largetitle h1{font-size:28px}
  .rhead{padding:0 20px} .readwrap{padding:0 20px} .rhead h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="mark"><span class="glyph">M</span><b>MyDrive</b></div>
    <nav id="nav"></nav>

      </button>
    </div>
    <div id="view"></div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>

<script>
/* ============================================================
   MyDrive — prototype v0.3
   ============================================================ */
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isKo=s=>/[\uAC00-\uD7A3]/.test(s);
const dayjs=n=>new Date(Date.now()+n*864e5).toISOString();

const ICON={
 library:'<path d="M4 5.5A1.5 1.5 0 015.5 4H9v16H5.5A1.5 1.5 0 014 18.5z"/><path d="M9 4h4.5A1.5 1.5 0 0115 5.5v13a1.5 1.5 0 01-1.5 1.5H9z"/><path d="M16.4 5.6l2.2.6a1.5 1.5 0 011 1.9l-3 11.2"/>',
 words:'<path d="M4 18.5L9.6 5h1.8L17 18.5"/><path d="M6.4 14h8.2"/><path d="M19.5 18.5V9"/>',
 knowledge:'<path d="M12 3.5c-3.6 0-6.5 2.7-6.5 6 0 2 1 3.4 2 4.4.7.8 1 1.5 1 2.4v.7h7v-.7c0-.9.3-1.6 1-2.4 1-1 2-2.4 2-4.4 0-3.3-2.9-6-6.5-6z"/><path d="M9.5 20.5h5"/>',
 review:'<path d="M3.5 12a8.5 8.5 0 108.5-8.5c-2.6 0-4.9 1.2-6.4 3"/><path d="M3.6 3.9v3.8h3.8"/><path d="M12 7.8V12l2.8 1.8"/>',
 today:'<path d="M4 19V9"/><path d="M9.3 19V5"/><path d="M14.7 19v-7"/><path d="M20 19v-11"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const svg=(n,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const mem={};
const store={
 async get(k){
  try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value);}catch(e){}
  try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v);}catch(e){}
  return mem[k]??null;},
 async set(k,v){mem[k]=v;
  try{await window.storage.set(k,JSON.stringify(v));}catch(e){}
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let wt=null,dirty=new Set();
function save(...keys){keys.forEach(k=>dirty.add(k));clearTimeout(wt);
 wt=setTimeout(()=>{dirty.forEach(k=>store.set(k,DB[k]));dirty.clear();},300);}

const DB={index:{docs:[]},knowledge:{highlights:[],vocabulary:[],concepts:[],thoughts:[],questions:[],reviewLogs:[]},
 tcache:{},stats:{apiCalls:0,cacheHits:0},
 prefs:{theme:'auto',colorLabels:{yellow:'Important',green:'Example',blue:'Term',pink:'Disagree',purple:'Quote'}}};
const K=DB.knowledge;
const COLORS=['yellow','green','blue','pink','purple'];
const labelFor=c=>(DB.prefs.colorLabels||{})[c||'yellow']||(c||'yellow');

const SEED=[
{id:'doc_seed_en',title:'Efficiency Constraints in On-Device Vision Models',author:'Sample',language:'en',domain:'Major / Career',content:
`Running a vision model on a phone is not the same problem as running one in a data centre. The constraint that dominates is not raw arithmetic but memory traffic: every tensor that has to be written out to DRAM and read back costs far more energy than the multiplication that produced it. A design that substantially reduces parameter count can therefore still be slow, because parameters are not what the hardware is struggling with.

This is why depthwise separable convolutions became so widespread. Splitting a standard convolution into a per-channel spatial filter followed by a pointwise projection cuts the arithmetic by roughly an order of magnitude, and the intermediate tensors stay small enough to remain in cache. The saving is real, but it is contingent on the surrounding architecture keeping those tensors resident.

A second observation follows from this. If the expensive step is moving wide activations around, then the network should be wide only where it must be, and narrow everywhere the data has to travel. The bottleneck layer exists for exactly this reason. Expansion happens inside a block, where the tensor never leaves fast memory; the representation that crosses between blocks is deliberately thin.

The trade-off is not free. A thin representation carries less information, and a nonlinearity applied to a low-dimensional tensor destroys a disproportionate amount of it. Removing the activation from the projection step recovers much of the loss, which is a reminder that architectural choices interact rather than compose independently.`},
{id:'doc_seed_ko',title:'기술 선택에서의 상충 관계',author:'Sample',language:'ko',domain:'General Knowledge',content:
`엔지니어링에서 최적의 설계란 존재하지 않는다. 존재하는 것은 특정 제약 조건 아래에서의 타당한 절충뿐이다. 정확도와 지연 시간, 메모리와 전력, 개발 속도와 유지보수성은 대개 서로 상충한다. 어느 한쪽을 개선하면 다른 쪽이 반드시 악화된다는 뜻은 아니지만, 아무 대가 없이 개선되는 경우는 드물다.

이때 필요한 것은 정량화다. 무엇을 얼마나 포기하고 무엇을 얼마나 얻는지 숫자로 말할 수 없다면, 그 결정은 취향에 불과하다. 반대로 수치로 환산된 절충안은 나중에 조건이 바뀌었을 때 다시 검토할 수 있는 근거가 된다.

기록되지 않은 판단은 시간이 지나면 소실된다. 반년 뒤의 나는 그때의 제약 조건을 기억하지 못하고, 결론만 남은 코드를 보며 왜 이렇게 했는지 되묻게 된다. 판단의 근거를 남기는 일은 문서화가 아니라 미래의 의사결정 비용을 낮추는 투자다.`}];

let state={view:'library',docId:null,panel:null,tab:'concepts',wordFilter:'all',colorFilter:'all',
 query:'',revealed:false,testing:false,testQueue:[]};

(async function boot(){
 const [ix,kn,tc,st,pf]=await Promise.all([store.get('pkos:index'),store.get('pkos:knowledge'),
  store.get('pkos:tcache'),store.get('pkos:stats'),store.get('pkos:prefs')]);
 if(kn)Object.assign(DB.knowledge,kn);
 if(tc)DB.tcache=tc; if(st)DB.stats=st;
 if(pf)DB.prefs={...DB.prefs,...pf,colorLabels:{...DB.prefs.colorLabels,...(pf.colorLabels||{})}};
 if(!K.reviewLogs)K.reviewLogs=[];
 K.vocabulary.forEach(v=>{                       // migrate entries saved before scheduling existed
  if(!v.tags)v.tags=[];
  if(v.ease==null)v.ease=2.5; if(v.reps==null)v.reps=0;
  if(v.lapses==null)v.lapses=0; if(v.stage==null)v.stage=0;
  if(v.interval==null)v.interval=0;});
 K.highlights.forEach(h=>{if(!h.tags)h.tags=[];});
 document.documentElement.dataset.theme=DB.prefs.theme||'auto';
 if(ix&&ix.docs?.length){DB.index=ix;}
 else{
  DB.index.docs=SEED.map(d=>({id:d.id,title:d.title,author:d.author,language:d.language,domain:d.domain,
   chars:d.content.length,progress:0,createdAt:now(),lastReadAt:null}));
  for(const d of SEED) await store.set('pkos:doc:'+d.id,{id:d.id,content:d.content});
  await store.set('pkos:index',DB.index);
 }
 render();
})();

/* ---------------------------------------------------------------------
   Language service client.

   The browser holds no API key. It posts a mode and the selected text to
   /api/lookup, which owns the prompts and the vendor call. Adding a mode
   means adding it in api/lookup.js and wiring one button here.

   Inside the Claude preview sandbox there is no /api route, so the call
   falls back to the sandbox endpoint. That path is preview-only; the
   deployed site always uses the server function.
   --------------------------------------------------------------------- */
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(36);};
let API_MODE=null;   // null = unknown, 'server' = /api/lookup, 'sandbox' = Claude preview

async function llm(mode,text,sentence,lang,key){
 if(key&&DB.tcache[key]){DB.stats.cacheHits++;save('pkos:stats');paintUsage();return{data:DB.tcache[key],cached:true};}
 let data=null;
 if(API_MODE!=='sandbox'){
  let r=null;
  try{
   r=await fetch('/api/lookup',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode,text,sentence,lang})});
  }catch(e){r=null;}
  if(r&&r.ok){API_MODE='server';data=await r.json();}
  else if(r&&(r.status===404||r.status===405)){API_MODE='sandbox';}
  else if(r){const j=await r.json().catch(()=>({}));throw new Error(j.error||('server returned '+r.status));}
  else if(API_MODE==='server'){throw new Error('Could not reach /api/lookup (network)');}
  else{API_MODE='sandbox';}
 }
 if(!data)data=await sandboxLLM(mode,text,sentence,lang);
 DB.stats.apiCalls++;
 if(key){DB.tcache[key]=data;const ks=Object.keys(DB.tcache);
  if(ks.length>200)ks.slice(0,ks.length-200).forEach(k=>delete DB.tcache[k]);save('pkos:tcache');}
 save('pkos:stats');paintUsage();return{data,cached:false};
}

/* preview-only path — mirrors the prompts in api/lookup.js */
const SANDBOX_SYS='You are a bilingual English–Korean reading assistant inside a personal knowledge app for a Korean engineering student. Write meanings and explanations in Korean unless told otherwise. Be precise and concise. Output raw JSON only.';
const SANDBOX_P={
 term:(t,s,l)=>`TASK: term lookup\nSELECTED: ${JSON.stringify(t)}\nSENTENCE: ${JSON.stringify(s)}\nSOURCE_LANGUAGE: ${l}\n\nJSON: {"term":str,"lang":str,"pos":str,"pron":str,"contextual":str,"general":str,"en":str,"hanja":str,"sentence_ko":str,"example":str,"example_ko":str,"concept":str,"tags":[str]}\ncontextual/general/sentence_ko 는 한국어. tags 는 영어 소문자 1~3개.`,
 passage:(t,s,l)=>`TASK: passage translation\nSELECTED: ${JSON.stringify(t)}\nSOURCE_LANGUAGE: ${l}\n\nJSON: {"translation":str,"gist":str,"terms":[{"term":str,"meaning":str}]}\ntranslation 은 자연스러운 한국어 의역.`,
 explain:(t,s)=>`TASK: simple explanation\nSELECTED: ${JSON.stringify(t)}\nSENTENCE: ${JSON.stringify(s)}\n\nJSON: {"explanation":str,"analogy":str}\n쉽게 2~3문장, 한국어.`,
 deep:(t,s)=>`TASK: in-depth explanation\nSELECTED: ${JSON.stringify(t)}\nSENTENCE: ${JSON.stringify(s)}\n\nJSON: {"explanation":str,"analogy":str}\n원리와 이유까지 3~5문장, 한국어.`};

async function sandboxLLM(mode,text,sentence,lang){
 const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SANDBOX_SYS,
   messages:[{role:'user',content:SANDBOX_P[mode](text,sentence,lang)}]})});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
 try{return JSON.parse(txt);}catch(e){throw new Error('Unreadable response');}
}

const docCache={};
async function loadDoc(id){if(docCache[id])return docCache[id];const d=await store.get('pkos:doc:'+id);docCache[id]=d;return d;}
const meta=id=>DB.index.docs.find(d=>d.id===id);
function sentenceAt(t,s,e){let a=s,b=e;const stop='.!?。\n';
 while(a>0&&!stop.includes(t[a-1]))a--;while(b<t.length&&!stop.includes(t[b]))b++;
 return t.slice(a,Math.min(b+1,t.length)).trim();}
const dueWords=()=>K.vocabulary.filter(v=>!v.suspended&&(!v.nextReviewAt||v.nextReviewAt<=now()));
const dueConcepts=()=>K.concepts.filter(c=>!c.nextReviewAt||c.nextReviewAt<=now());

const $view=document.getElementById('view'),$panel=document.getElementById('panel'),$nav=document.getElementById('nav'),
 $tb=document.getElementById('tbtitle'),$toolbar=document.getElementById('toolbar'),$usage=document.getElementById('usage'),
 $main=document.getElementById('main');

function paintNav(){
 const items=[['library','Library','library',DB.index.docs.length],
  ['words','Words','words',dueWords().length||K.vocabulary.length],
  ['knowledge','Knowledge','knowledge',K.concepts.length+K.thoughts.length+K.questions.length],
  ['review','Review','review',dueConcepts().length],['today','Today','today','']];
 $nav.innerHTML=items.map(([k,l,ic,n])=>`<button class="navbtn" data-nav="${k}" aria-current="${state.view===k||(k==='library'&&state.view==='reader')}">
  ${svg(ic)}<span>${l}</span>${n===''?'':`<span class="n">${n}</span>`}</button>`).join('');
}
function paintUsage(){
 const s=DB.stats;
 $usage.innerHTML=`<div class="u"><span>API calls</span><b>${s.apiCalls}</b></div>
  <div class="u"><span>Cached</span><b>${s.cacheHits}</b></div>
  <div class="themetog">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,l])=>
   `<button data-settheme="${k}" aria-current="${(DB.prefs.theme||'auto')===k}">${l}</button>`).join('')}</div>`;
}
function render(){
 paintNav();paintUsage();
 if(state.query)viewSearch();
 else if(state.view==='library')viewLibrary();
 else if(state.view==='reader')viewReader();
 else if(state.view==='words')viewWords();
 else if(state.view==='knowledge')viewKnowledge();
 else if(state.view==='review')viewReview();
 else if(state.view==='today')viewToday();
 paintPanel();
}
$main.addEventListener('scroll',()=>{
 $toolbar.classList.toggle('scrolled',$main.scrollTop>28);
 if(state.view==='reader'){const m=meta(state.docId);if(!m)return;
  const p=Math.min(1,$main.scrollTop/Math.max(1,$main.scrollHeight-$main.clientHeight));
  if(Math.abs(p-m.progress)>.02){m.progress=p;m.lastReadAt=now();save('pkos:index');}}
});

/* ---------- Library ----------
   A flat pile sorted by upload time tells you nothing. What matters when you
   open this screen is: what am I in the middle of, what have I not started,
   and what did each document actually give me. So documents are grouped by
   reading state, and every row carries the count of highlights and words it
   produced — that is the reason to keep a document rather than its filename.
   -------------------------------------------------------------------------- */
const DOMAINS=['Major / Career','English / Liberal Arts','World / News / Investment','General Knowledge'];
const docStat=d=>({h:K.highlights.filter(x=>x.documentId===d.id&&!x.orphaned).length,
                   w:K.vocabulary.filter(x=>x.sourceDocumentId===d.id).length});
function docRow(d){
 const st=docStat(d),pct=Math.round(d.progress*100);
 const bits=[esc(d.author||'Unknown'),d.language==='ko'?'Korean':'English'];
 if(st.h)bits.push(st.h+' highlights');

/* Editing the source text moves every offset after the edit point, so each
   highlight is re-found by its own text near where it used to be. Anything
   that genuinely disappeared is kept and flagged rather than silently lost. */
function reanchor(docId,oldText,newText){
 let moved=0,lost=0;
 K.highlights.filter(h=>h.documentId===docId).forEach(h=>{
  if(newText.slice(h.start,h.end)===h.selectedText){h.orphaned=false;return;}
  let i=newText.indexOf(h.selectedText,Math.max(0,h.start-800));
  if(i<0)i=newText.indexOf(h.selectedText);
  if(i<0){h.orphaned=true;lost++;return;}
  h.start=i;h.end=i+h.selectedText.length;
  h.position={type:'text-offset',start:h.start,end:h.end};h.orphaned=false;moved++;
 });
 return{moved,lost};
}

function renderMargins(){

  const linked=K.vocabulary.find(v=>v.sourceHighlightId===h.id);

function offsetOf(node,off){
 const el=node.nodeType===3?node.parentElement:node,p=el.closest('[data-start]');if(!p)return null;
 let acc=0;const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);let n;
 while((n=w.nextNode())){if(n===node)return +p.dataset.start+acc+off;acc+=n.nodeValue.length;}

let $co=null;const killCo=()=>{if($co){$co.remove();$co=null;}};
/* The menu should appear the moment a selection exists, on every device.
   selectionchange is the only event that fires reliably on iOS after the
   native handles settle, so it drives this; mouseup/touchend are kept as a
   fast path for pointer devices. A collapsed selection is ignored here —
   dismissal is handled by the click listener, otherwise tapping a button in
   the menu would destroy the menu before the tap registers. */
let selT=null;
const scheduleSel=()=>{clearTimeout(selT);selT=setTimeout(onSel,160);};
document.addEventListener('selectionchange',scheduleSel);
document.addEventListener('mouseup',scheduleSel);
document.addEventListener('touchend',scheduleSel);
function onSel(){
 if(state.view!=='reader')return;
 const sel=window.getSelection();
 if(!sel||!sel.rangeCount)return;
 if(sel.isCollapsed)return;               // leave an open menu alone
 const r=sel.getRangeAt(0),body=document.getElementById('docbody');
 if(!body||!body.contains(r.commonAncestorContainer))return;
 const text=sel.toString().trim();if(!text)return;
 const s=offsetOf(r.startContainer,r.startOffset),e=offsetOf(r.endContainer,r.endOffset);
 if(s==null||e==null)return;
 if($co&&$co.dataset.sig===text+'|'+s)return;   // same selection, menu already up

}
function showCallout(rect,sel){

 $co=document.createElement('div');
 $co.dataset.sig=sel.text+'|'+sel.start;

 if(narrow){

  document.body.appendChild($co);

  const box=$main.getBoundingClientRect();
  $co.style.left=Math.min(Math.max(rect.left+rect.width/2-box.left+$main.scrollLeft,160),$main.clientWidth-160)+'px';
  $co.style.top=(rect.top-box.top+$main.scrollTop-8)+'px';

  act(a.dataset.act,sel,isTerm);killCo();window.getSelection()?.removeAllRanges();};

async function act(kind,sel,isTerm){
 const d=await loadDoc(state.docId);
 const ctx={...sel,sentence:sentenceAt(d.content,sel.start,sel.end),lang:isKo(sel.text)?'ko':'en',documentId:state.docId};
 if(kind==='hl')return addHighlight(ctx);
 if(kind==='thought'||kind==='question'){state.panel={type:'compose',kind,ctx};return paintPanel();}

 /* one action: highlight + look up + store. Words go to the Words DB with their
    contextual meaning; sentences keep a natural Korean rendering as a margin note. */
 if(kind==='save'){
  const h=addHighlight(ctx,isTerm?'blue':'yellow');
  const mode=isTerm?'term':'passage';
  const key=hash(mode+'|'+sel.text+'|'+(isTerm?ctx.sentence:''));
  state.panel={type:'result',mode,ctx,loading:true};paintPanel();
  try{
   const{data}=await llm(mode,sel.text,ctx.sentence,ctx.lang,key);
   if(isTerm){
    const v=makeVocab(data,ctx,h);
    h.note=data.contextual||data.general||'';h.updatedAt=now();
    save('pkos:knowledge');state.panel={type:'detail',kind:'vocabulary',item:v};
    render();toast('Saved to Words');
   }else{
    h.translation=data.translation||'';h.note=data.translation||'';h.gist=data.gist||'';h.updatedAt=now();
    save('pkos:knowledge');state.panel={type:'hl',item:h};
    render();toast('Saved with translation');
   }
  }catch(e){state.panel={type:'result',mode,ctx,error:e.message};paintPanel();}
  return;
 }
 const mode=kind==='lookup'?(isTerm?'term':'passage'):kind;
 const key=hash(mode+'|'+sel.text+'|'+(mode==='passage'?'':ctx.sentence));
 state.panel={type:'result',mode,ctx,loading:true};paintPanel();
 try{
  const{data,cached}=await llm(mode,sel.text,ctx.sentence,ctx.lang,key);
  state.panel={type:'result',mode,ctx,data,cached};
 }catch(e){state.panel={type:'result',mode,ctx,error:e.message};}
 paintPanel();
}

  position:{type:'text-offset',start:ctx.start,end:ctx.end},sentence:ctx.sentence,color,note:'',tags:[],
  createdAt:now(),updatedAt:now()};

/* ---------- Words ----------
   Scheduling is SM-2: each word carries an ease factor that moves with how well
   it is recalled. The question type escalates with the word's stage, so the same
   word gets asked from a different angle instead of becoming a memorised card
   shape. Every answer is written to reviewLogs, so the algorithm can be replaced
   later without losing the history it was built on.
   -------------------------------------------------------------------------- */
const QTYPES=['choice','recall','cloze','reverse'];
const QLABEL={choice:'Pick the meaning',recall:'What does it mean?',
 cloze:'Fill the blank',reverse:'Say it in English'};
const QSHORT={choice:'Choice',recall:'Recall',cloze:'Cloze',reverse:'Reverse'};
const newPerDay=()=>DB.prefs.newPerDay||10;

function clozeOf(v){
 const sent=v.sourceSentence||v.exampleSentence||'';
 if(!sent||!v.word)return null;
 const i=sent.toLowerCase().indexOf(String(v.word).toLowerCase());
 if(i<0)return null;
 return sent.slice(0,i)+'______'+sent.slice(i+String(v.word).length);
}
function qtypeFor(v){
 let t=QTYPES[Math.min(3,v.stage||0)];
 if(t==='cloze'&&!clozeOf(v))t='recall';
 if(t==='choice'&&K.vocabulary.filter(x=>x.contextualMeaning||x.meaning).length<4)t='recall';
 if(t==='reverse'&&!(v.contextualMeaning||v.meaning))t='recall';
 return t;
}
function choicesFor(v){
 const right=v.contextualMeaning||v.meaning||'';
 const wrong=K.vocabulary.filter(x=>x.id!==v.id&&(x.contextualMeaning||x.meaning))
  .map(x=>x.contextualMeaning||x.meaning).filter(m=>m!==right);
 const picked=[...new Set(wrong)].sort(()=>Math.random()-.5).slice(0,3);
 return [...picked,right].sort(()=>Math.random()-.5).map(t=>({t,ok:t===right}));
}
function rollNewCounter(){
 const t=new Date().toISOString().slice(0,10);
 if(DB.stats.newDate!==t){DB.stats.newDate=t;DB.stats.newToday=0;save('pkos:stats');}
}
function buildSession(){
 rollNewCounter();
 const pool=dueWords();
 const seen=pool.filter(v=>(v.reps||0)>0)
  .sort((a,b)=>String(a.nextReviewAt||'').localeCompare(String(b.nextReviewAt||'')));
 const room=Math.max(0,newPerDay()-(DB.stats.newToday||0));
 const fresh=pool.filter(v=>!(v.reps||0)).slice(0,room);
 return [...seen,...fresh];
}
function schedule(v,g){
 rollNewCounter();
 if(!(v.reps||0)){DB.stats.newToday=(DB.stats.newToday||0)+1;v.introducedAt=now();}
 v.ease=Math.max(1.3,Math.min(3.2,(v.ease||2.5)+[-0.2,-0.15,0,0.15][g]));
 v.reps=(v.reps||0)+1;
 if(g===0){
  v.lapses=(v.lapses||0)+1;v.interval=0;v.stage=Math.max(0,(v.stage||0)-1);
  v.nextReviewAt=new Date(Date.now()+6e5).toISOString();    // back in ten minutes
  v.reviewStatus='learning';
  if(v.lapses>=5){v.suspended=true;v.tags=[...new Set([...(v.tags||[]),'leech'])];}
 }else{
  // a lapsed word restarts short; Hard must still move forward, never stall at 1 day
  const base=v.interval||((v.lapses||0)?1:(v.reps<=1?1:3));
  v.interval=Math.max((v.interval||0)+1,Math.round(base*(g===1?1.2:g===2?v.ease:v.ease*1.3)));
  v.nextReviewAt=dayjs(v.interval);v.reviewStatus='review';
  if(g>=2)v.stage=Math.min(3,(v.stage||0)+1);
 }
 v.lastReviewedAt=now();v.updatedAt=now();
 K.reviewLogs.push({id:uid('rl'),itemId:v.id,itemType:'vocabulary',grade:g,
  mode:state.qtype||'recall',intervalAfter:v.interval,at:now()});
 if(K.reviewLogs.length>2000)K.reviewLogs.splice(0,K.reviewLogs.length-2000);
 save('pkos:knowledge','pkos:stats');
}
function nextCard(){
 state.revealed=false;state.qtype=null;state.choices=null;state.picked=null;state.clozeOk=null;
}
function gradeWord(g){
 const v=state.testQueue.shift();if(!v)return;
 schedule(v,g);
 if(g===0)state.testQueue.push(v);
 state.sessionDone=(state.sessionDone||0)+1;
 nextCard();render();
}

 try{

 if(th){DB.prefs.theme=th.dataset.settheme;document.documentElement.dataset.theme=DB.prefs.theme;
  store.set('pkos:prefs',DB.prefs);paintUsage();return;}
 const nav=T.closest('[data-nav]');if(nav)return go(nav.dataset.nav);
 const op=T.closest('[data-open]');if(op)return go('reader',{docId:op.dataset.open});
 const dm=T.closest('[data-dom]');if(dm){state.domain=dm.dataset.dom;return render();}
 const so=T.closest('[data-sort]');if(so){state.sort=so.dataset.sort;return render();}
 const sz=T.closest('[data-size]');
 if(sz){DB.prefs.readSize=Math.max(15,Math.min(28,(DB.prefs.readSize||19)+(sz.dataset.size==='+'?1:-1)));
  store.set('pkos:prefs',DB.prefs);await viewReader();return;}
 const ed=T.closest('[data-editdoc]');
 if(ed){const m=meta(ed.dataset.editdoc);await loadDoc(m.id);
  state.confirmDel=null;state.panel={type:'docedit',item:m};return paintPanel();}
 const ds=T.closest('[data-docsave]');
 if(ds){
  const m=meta(ds.dataset.docsave),old=(docCache[m.id]||{}).content||'';
  const next=$panel.querySelector('#dcontent').value;
  m.title=$panel.querySelector('#dtitle').value.trim()||m.title;
  m.author=$panel.querySelector('#dauthor').value.trim();
  m.domain=$panel.querySelector('#ddomain').value;
  m.updatedAt=now();
  let msg='Saved';
  if(next!==old){
   const r=reanchor(m.id,old,next);
   m.chars=next.length;m.language=isKo(next.slice(0,400))?'ko':'en';
   docCache[m.id]={id:m.id,content:next};await store.set('pkos:doc:'+m.id,docCache[m.id]);
   msg=`Saved · ${r.moved} highlights moved${r.lost?`, ${r.lost} lost their place`:''}`;
  }
  save('pkos:index','pkos:knowledge');state.panel=null;lastReaderDoc=null;render();return toast(msg);}
 const dd=T.closest('[data-docdel]');
 if(dd){
  const id=dd.dataset.docdel;
  if(state.confirmDel!==id){state.confirmDel=id;return paintPanel();}
  DB.index.docs=DB.index.docs.filter(d=>d.id!==id);
  K.highlights=K.highlights.filter(h=>h.documentId!==id);DB.knowledge.highlights=K.highlights;
  delete docCache[id];save('pkos:index','pkos:knowledge');
  state.confirmDel=null;state.panel=null;return go('library');}
 const tab=T.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;return render();}
 const wf=T.closest('[data-wf]');if(wf){state.wordFilter=wf.dataset.wf;return render();}
 if(T.closest('[data-test]')){
  const s=buildSession();
  state.testQueue=s.length?s:[...K.vocabulary].filter(v=>!v.suspended).sort(()=>Math.random()-.5).slice(0,20);
  state.testing=true;state.sessionDone=0;nextCard();return render();}
 const pk=T.closest('[data-pick]');
 if(pk){state.picked=+pk.dataset.pick;return render();}
 if(T.closest('[data-check]')){
  const v=state.testQueue[0];
  const got=(document.getElementById('clozein')?.value||'').trim().toLowerCase();
  state.clozeOk=got===String(v.word).trim().toLowerCase();return render();}
 if(T.closest('[data-showans]')){state.clozeOk=false;return render();}
 const tg=T.closest('[data-tgrade]');if(tg)return gradeWord(+tg.dataset.tgrade);
 const it=T.closest('[data-item]');
 if(it){const[k,id]=it.dataset.item.split(':');const o=K[k].find(x=>x.id===id);
  if(o)state.panel=k==='highlights'?{type:'hl',item:o}:{type:'detail',kind:k,item:o};return paintPanel();}
 const cf=T.closest('[data-cf]');if(cf){state.colorFilter=cf.dataset.cf;return render();}
 const sn=T.closest('[data-savenote]');
 if(sn){const h=K.highlights.find(x=>x.id===sn.dataset.savenote);
  h.note=($panel.querySelector('#hlnote')?.value||'').trim();h.updatedAt=now();
  save('pkos:knowledge');if(state.view==='reader')await viewReader();
  paintPanel();return toast('Note saved');}
 const hl=T.closest('[data-hl]');
 if(hl){const h=K.highlights.find(x=>x.id===hl.dataset.hl);if(!h)return;
  document.querySelectorAll('mark.hl.on').forEach(m=>m.classList.remove('on'));
  const mk=document.querySelector(`mark[data-hl="${h.id}"]`);if(mk)mk.classList.add('on');
  state.panel={type:'hl',item:h};return paintPanel();}
 const a3=T.closest('[data-act3]');if(a3){const p=state.panel;return act('deep',p.ctx,false);}
 const col=T.closest('[data-color]');
 if(col){const[id,c]=col.dataset.color.split(':');const h=K.highlights.find(x=>x.id===id);
  h.color=c;h.updatedAt=now();save('pkos:knowledge');if(state.view==='reader')await viewReader();return paintPanel();}
 const ut=T.closest('[data-untag]');
 if(ut){const[k,id,tag]=ut.dataset.untag.split(':');const o=K[k].find(x=>x.id===id);
  o.tags=(o.tags||[]).filter(x=>x!==tag);save('pkos:knowledge');return paintPanel();}
 if(T.closest('[data-close]')){state.panel=null;return paintPanel();}
 if(T.closest('#panelbtn')){$panel.classList.toggle('open');return;}
 if(T.closest('[data-reveal]')){state.revealed=true;return render();}
 const gr=T.closest('[data-grade]');if(gr)return grade(+gr.dataset.grade);
 const sv=T.closest('[data-save]');if(sv)return sv.dataset.save==='vocab'?saveVocab(state.panel):saveConcept(state.panel);
 if(T.closest('[data-act2]'))return addHighlight(state.panel.ctx);
 const cp=T.closest('[data-compose]');
 if(cp){state.panel={type:'compose',kind:cp.dataset.compose,ctx:state.panel.ctx};return paintPanel();}
 const hc=T.closest('[data-hlc]');
 if(hc){const[kind,id]=hc.dataset.hlc.split(':');const h=K.highlights.find(x=>x.id===id);
  state.panel={type:'compose',kind,ctx:{...h,text:h.selectedText,sentence:h.sentence}};return paintPanel();}
 const cm=T.closest('[data-commit]');if(cm)return commit(cm.dataset.commit);
 const dl=T.closest('[data-del]');
 if(dl){const[k,id]=dl.dataset.del.split(':');K[k]=K[k].filter(x=>x.id!==id);DB.knowledge[k]=K[k];
  save('pkos:knowledge');state.panel=null;toast('Deleted');return render();}
 if(T.closest('[data-diag]')){
  $panel.innerHTML=shell('Diagnostics','<div class="card"><span class="spin"></span>Checking…</div>');
  let out;
  try{const r=await fetch('/api/lookup');out={status:r.status,body:await r.json().catch(()=>'(not JSON)')};}
  catch(e){out={error:e.message};}
  const hint=out.status===200?(out.body?.geminiKey==='set'
    ?'Server and key look fine. The failure is in the model call — send me the message above.'
    :'GEMINI_API_KEY is missing. Vercel → Settings → Environment Variables → then Redeploy.')
   :out.status===404?'/api/lookup does not exist. The api folder did not upload. Check that GitHub shows api/lookup.js.'
   :'Could not reach the server function.';
  $panel.innerHTML=shell('Diagnostics',`<div class="card">
   <div class="f"><div class="k">Route</div><div class="v">${esc(API_MODE||'unknown')}</div></div>
   <div class="f"><div class="k">GET /api/lookup</div>
    <pre style="font-size:11.5px;white-space:pre-wrap;word-break:break-all;margin:0;font-family:ui-monospace,monospace">${esc(JSON.stringify(out,null,1))}</pre></div>
   <div class="f"><div class="k">Reading</div><div class="v">${esc(hint)}</div></div></div>`);
  return;}
 if(T.closest('[data-retry]')){const p=state.panel;return act(p.mode==='term'||p.mode==='passage'?'lookup':p.mode,p.ctx,p.mode==='term');}
 if(T.closest('#addbtn'))return addDoc(document.getElementById('ntitle').value,document.getElementById('nauthor').value,
  document.getElementById('paste').value,document.getElementById('ndomain').value);
 if(!T.closest('.callout')&&!T.closest('.actionbar'))killCo();
 }catch(err){console.error(err);toast('Error: '+(err.message||err));}
});
document.addEventListener('keydown',e=>{
 const li=e.target.closest?.('[data-label]');
 if(li&&e.key==='Enter'){
  DB.prefs.colorLabels={...DB.prefs.colorLabels,[li.dataset.label]:li.value.trim()||li.dataset.label};
  store.set('pkos:prefs',DB.prefs);
  if(state.view==='reader')renderMargins();
  paintPanel();return toast('Label saved');}
 const ti=e.target.closest?.('[data-tagfor]');
 if(ti&&e.key==='Enter'){
  const[k,id]=ti.dataset.tagfor.split(':');const o=K[k].find(x=>x.id===id);
  const v=ti.value.trim().toLowerCase();
  if(v&&!(o.tags||[]).includes(v)){o.tags=[...(o.tags||[]),v];o.updatedAt=now();save('pkos:knowledge');paintPanel();}
  return;}
 if(e.target.id==='clozein'&&e.key==='Enter'){
  const v=state.testQueue[0];
  state.clozeOk=e.target.value.trim().toLowerCase()===String(v.word).trim().toLowerCase();
  return render();}
 if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('q').focus();}
 if(e.key==='Escape'){killCo();if(state.panel){state.panel=null;paintPanel();}}
});
document.addEventListener('change',e=>{
 if(e.target.id!=='file')return;
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>addDoc(f.name.replace(/\.(txt|md|markdown)$/i,''),'Upload',r.result,'Major / Career');
 r.readAsText(f);
});
/* Navigation goes through the browser's history stack so the phone's back
   gesture and the desktop back button behave the way people expect. */
function go(view,opts={}){
 state.view=view;
 if(opts.docId!==undefined)state.docId=opts.docId;
 state.panel=null;state.revealed=false;state.testing=false;state.query='';
 const q=document.getElementById('q');if(q)q.value='';
 $main.scrollTop=0;
 try{history.pushState({view,docId:state.docId},'');}catch(e){}
 render();
}
window.addEventListener('popstate',e=>{
 const st=e.state||{view:'library'};
 state.view=st.view||'library';state.docId=st.docId||null;
 state.panel=null;state.testing=false;state.query='';
 const q=document.getElementById('q');if(q)q.value='';
 render();
});
try{history.replaceState({view:'library',docId:null},'');}catch(e){}

let qt=null;
document.getElementById('q').addEventListener('input',e=>{
 clearTimeout(qt);const v=e.target.value.trim();
 qt=setTimeout(()=>{state.query=v;$main.scrollTop=0;render();},220);
});
function toast(msg){
 document.querySelectorAll('.toast').forEach(t=>t.remove());
 const el=document.createElement('div');el.className='toast';el.textContent=msg;
 document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
}
</script>
</body>
</html>
