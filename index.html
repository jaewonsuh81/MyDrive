<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>MyDrive</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyDrive">
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"AppleMyungjo","Nanum Myeongjo",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --blue:#007AFF; --blue-press:#0066D6;
  --label:#1D1D1F; --label2:#6E6E73; --label3:#8E8E93; --label4:#B0B0B5;
  --window:#F5F5F7; --content:#FFFFFF; --elevated:#FFFFFF;
  --reading-ink:#1D1D1F;
  --fill1:rgba(116,116,128,.16); --fill2:rgba(116,116,128,.10); --fill3:rgba(116,116,128,.06);
  --sep:rgba(60,60,67,.14); --sep-strong:rgba(60,60,67,.24);
  --glass:rgba(246,246,248,.72);
  --shadow-s:0 1px 2px rgba(0,0,0,.05);
  --shadow-m:0 4px 16px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --shadow-l:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --r1:8px; --r2:12px; --r3:16px; --r4:22px;
  --ease:cubic-bezier(.32,.72,0,1);
  --hl-mark:#FFF1A8; --hl-word:#FFD9B8; --memo-line:#B58A3C;
  --mark-ink:#5C4A12; --word-ink:#6B4519;
}
[data-theme="dark"]{
  --label:#F5F5F7; --label2:#98989D; --label3:#8E8E93; --label4:#5A5A5F;
  --window:#161618; --content:#1C1C1E; --elevated:#242426; --reading-ink:#D8D8DD;
  --blue:#0A84FF; --blue-press:#3D9BFF;
  --fill1:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24); --fill3:rgba(120,120,128,.14);
  --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.18);
  --glass:rgba(30,30,32,.72);
  --shadow-m:0 4px 16px rgba(0,0,0,.4); --shadow-l:0 16px 48px rgba(0,0,0,.55);
  --hl-mark:#5C4E18; --hl-word:#5E3D1E; --memo-line:#C9A14E;
  --mark-ink:#F0E6CB; --word-ink:#F0DCC6;
}
@media (prefers-color-scheme:dark){[data-theme="auto"]{
  --label:#F5F5F7; --label2:#98989D; --label3:#8E8E93; --label4:#5A5A5F;
  --window:#161618; --content:#1C1C1E; --elevated:#242426; --reading-ink:#D8D8DD;
  --blue:#0A84FF; --blue-press:#3D9BFF;
  --fill1:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24); --fill3:rgba(120,120,128,.14);
  --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.18);
  --glass:rgba(30,30,32,.72);
  --shadow-m:0 4px 16px rgba(0,0,0,.4); --shadow-l:0 16px 48px rgba(0,0,0,.55);
  --hl-mark:#5C4E18; --hl-word:#5E3D1E; --memo-line:#C9A14E;
  --mark-ink:#F0E6CB; --word-ink:#F0DCC6;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--window);color:var(--label);font-family:var(--ui);font-size:14px;
  line-height:1.47;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 35%,transparent);border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--fill1);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:222px minmax(0,1fr) 360px;height:100dvh;overflow:hidden}
.app.nopanel{grid-template-columns:222px minmax(0,1fr)}
.app.nopanel>.panel{display:none}
.sidebar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-right:1px solid var(--sep);display:flex;flex-direction:column;padding:14px 12px 12px;overflow:auto}
.mark{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:16px}
.mark .glyph{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,var(--blue),color-mix(in srgb,var(--blue) 55%,#5E5CE6));
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:640;box-shadow:var(--shadow-s)}
.mark b{font-size:15px;font-weight:600;letter-spacing:-.018em}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r1);
  transition:background .12s;font-size:13.5px;font-weight:450}
.navbtn svg{width:17px;height:17px;flex:none;color:var(--label2)}
.navbtn .n{margin-left:auto;font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums}
.navbtn:hover{background:var(--fill3)}
.navbtn[aria-current="true"]{background:var(--fill2);font-weight:510}
.navbtn[aria-current="true"] svg{color:var(--blue)}
.usage{margin-top:auto;background:var(--fill3);border-radius:var(--r2);padding:10px 12px;font-size:12px;color:var(--label2)}
.usage .u{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.usage b{font-weight:590;color:var(--label);font-variant-numeric:tabular-nums;font-size:13px}
.themetog{display:flex;gap:2px;margin-top:9px;background:var(--fill2);border-radius:8px;padding:2px}
.themetog button{flex:1;padding:4px 0;border-radius:6px;font-size:11px;color:var(--label2);transition:.16s var(--ease)}
.themetog button[aria-current="true"]{background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s);font-weight:510}

.main{background:var(--content);overflow:auto;position:relative}
.toolbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:50px;padding:0 20px;
  background:color-mix(in srgb,var(--content) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.toolbar.scrolled{border-bottom-color:var(--sep)}
.tbtitle{font-size:14px;font-weight:590;opacity:0;transform:translateY(3px);transition:.22s var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.toolbar.scrolled .tbtitle{opacity:1;transform:none}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:6px;background:var(--fill3);border:1px solid transparent;border-radius:var(--r1);
  padding:5px 9px;width:190px;transition:.18s var(--ease)}
.field:focus-within{background:var(--elevated);border-color:var(--sep-strong);width:252px;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.field svg{width:14px;height:14px;color:var(--label3);flex:none}
.field input{border:none;background:none;outline:none;width:100%;font-size:13px}
.iconbtn{width:30px;height:30px;border-radius:var(--r1);display:grid;place-items:center;color:var(--label2);transition:.12s}
.iconbtn:hover{background:var(--fill3);color:var(--label)}
.iconbtn[aria-current="true"]{background:var(--fill2);color:var(--blue)}
.iconbtn svg{width:17px;height:17px}

.view{padding:6px 22px 140px;max-width:920px}
.largetitle{display:flex;align-items:baseline;gap:10px;padding:14px 0 18px}
.largetitle h1{font-size:31px;font-weight:640;letter-spacing:-.024em;line-height:1.1;margin:0}
.largetitle .c{font-size:16px;color:var(--label3);font-variant-numeric:tabular-nums}

.btn{border-radius:var(--r1);padding:6px 14px;font-size:13.5px;font-weight:510;background:var(--blue);color:#fff;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--blue-press)} .btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill2);color:var(--label)} .btn.sec:hover{background:var(--fill1)}
.btn.plain{background:none;color:var(--blue);padding:6px 8px} .btn.plain:hover{background:var(--fill3)}
.btn.danger{background:none;color:#FF3B30;padding:5px 9px;font-size:12.5px}
.btn.danger:hover{background:color-mix(in srgb,#FF3B30 10%,transparent)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.tin{background:var(--elevated);border:1px solid var(--sep-strong);border-radius:var(--r1);padding:7px 10px;font-size:13.5px;min-width:0;transition:.15s}
.tin:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent);outline:none}
.numin{width:60px;text-align:center;padding:6px;border-radius:var(--r1);border:1px solid var(--sep-strong);
  background:var(--elevated);font-size:13.5px;font-variant-numeric:tabular-nums;outline:none}
.numin:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.seg{display:inline-flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin:0 0 16px;flex-wrap:wrap}
.seg button{padding:5px 13px;border-radius:7px;font-size:13px;color:var(--label2);transition:.18s var(--ease)}
.seg button[aria-current="true"]{background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s);font-weight:510}
.seg .n{font-variant-numeric:tabular-nums;opacity:.55;margin-left:4px;font-size:12px}
.seg.tight{margin:0}
.labelrow{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:99px;
  background:var(--fill3);border:1px solid transparent;color:var(--label2);transition:.14s}
.lchip:hover{background:var(--fill2)}
.lchip[aria-current="true"]{border-color:var(--sep-strong);background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s)}
.lchip .n{font-variant-numeric:tabular-nums;opacity:.5;font-size:11.5px}

.list{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);overflow:hidden}
.row,.item{position:relative;width:100%;text-align:left;transition:background .1s}
.row{display:flex;align-items:center;gap:13px;padding:12px 14px}
.item{display:block;padding:13px 14px}
.row+.row::before,.item+.item::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--sep)}
@media (min-resolution:2dppx){.row+.row::before,.item+.item::before{height:.5px}}
.row:hover,.item:hover{background:var(--fill3)}
.row .cover{width:36px;height:47px;border-radius:4px;flex:none;background:linear-gradient(150deg,var(--fill2),var(--fill1));
  display:grid;place-items:center;font-family:var(--serif);font-size:16px;color:var(--label2);box-shadow:var(--shadow-s)}
.row .txt{min-width:0;flex:1}
.row h3,.item h4{font-size:14.5px;font-weight:530;letter-spacing:-.01em;margin:0 0 2px}
.row h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pct{font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums;flex:none}
.row .bar{width:42px;height:3px;border-radius:99px;background:var(--fill1);overflow:hidden;flex:none}
.row .bar i{display:block;height:100%;background:var(--blue)}
.chev{color:var(--label4);flex:none} .chev svg{width:13px;height:13px}
.item .b{font-size:13px;color:var(--label2);line-height:1.45;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--label3);margin-top:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.feed{max-height:210px;overflow:hidden;position:relative;font-family:var(--serif);
  font-size:15px;line-height:1.62;color:var(--label);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.feed.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.feed p{margin:0 0 .85em}
.feed .fh{font-family:var(--ui);font-size:12px;font-weight:610;color:var(--label3);
  margin:16px 0 6px;letter-spacing:.01em}
.feed .fh:first-child{margin-top:0}
.feed .fhr{border:none;border-top:1px solid var(--sep);margin:14px 0}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--sep-strong);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px;transition:.14s var(--ease)}
.tick.on{background:var(--blue);border-color:var(--blue)}
.empty{border:1px dashed var(--sep-strong);border-radius:var(--r2);padding:24px;color:var(--label3);font-size:13.5px;text-align:center}
.addcard{margin-top:20px;background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:15px}
.addcard textarea{width:100%;min-height:84px;resize:vertical;background:var(--content);border:1px solid var(--sep-strong);
  border-radius:var(--r1);padding:10px;font-size:13.5px;line-height:1.55;outline:none}
.flexrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
h3.sec{font-size:16.5px;font-weight:600;letter-spacing:-.015em;margin:24px 0 9px}

/* ---------------- reader ---------------- */
.reader{max-width:none;padding:0 0 44vh}
.rhead{max-width:var(--rw,40em);margin:14px auto 26px;padding:0 20px}
.rtools{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rtools .spacer{flex:1}
.rhead h1{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.17;letter-spacing:-.015em;margin:10px 0 8px}
.rhead .meta{font-size:12.5px;color:var(--label2)}
.readwrap{display:flex;justify-content:center;gap:22px;position:relative;padding:0 20px}
.gutter{position:relative;flex:0 0 178px}
.readwrap:not(.wide) .gutter{display:none}
.doctext{flex:1 1 auto;min-width:0;font-family:var(--serif);font-size:var(--read,19px);line-height:var(--lh,1.68);
  letter-spacing:-.003em;max-width:var(--rw,40em);color:var(--reading-ink)}
.readfont-sans .doctext,.readfont-sans .rhead h1{font-family:var(--ui);letter-spacing:-.012em}
.readfont-mono .doctext{font-family:var(--mono);font-size:calc(var(--read,19px)*.92)}
.doctext p{margin:0 0 1.3em;white-space:pre-wrap}
.doctext ::selection{background:color-mix(in srgb,var(--blue) 26%,transparent)}

/* three roles, three treatments */
mark.hl{color:inherit;padding:.05em 0;border-radius:2px;cursor:pointer;background:var(--hl-mark);
  transition:filter .12s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hl[data-k="word"]{background:var(--hl-word)}
mark.hl[data-k="memo"]{background:none;padding:0;border-radius:0;
  border-bottom:1px solid var(--memo-line);padding-bottom:.5px}
mark.hl[data-k="memo"]::after{content:attr(data-i);vertical-align:super;font-size:.58em;font-family:var(--ui);
  font-weight:600;color:var(--memo-line);margin-left:1px}
mark.hl[data-k="memo"]:hover{background:color-mix(in srgb,var(--memo-line) 14%,transparent)}
mark.hl:hover{filter:brightness(.96)}
mark.hl.on{box-shadow:0 0 0 2px var(--blue)}
.mnote{position:absolute;width:178px;font-size:12px;line-height:1.45;color:var(--label2);
  border-left:2px solid var(--hl-mark);padding:1px 0 1px 9px;cursor:pointer;transition:color .12s}
.mnote[data-k="word"]{border-left-color:var(--hl-word)}
.mnote[data-k="memo"]{border-left-color:var(--memo-line)}
.mnote:hover{color:var(--label)}
.mnote .t{font-size:10.5px;color:var(--label3);display:block;margin-bottom:2px}

.callout{position:absolute;z-index:60;display:flex;align-items:stretch;
  background:color-mix(in srgb,var(--elevated) 84%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--sep);border-radius:var(--r2);box-shadow:var(--shadow-l);overflow:hidden;
  transform:translate(-50%,-100%);transform-origin:50% 100%;animation:callout .18s var(--ease)}
@keyframes callout{from{opacity:0;transform:translate(-50%,-96%) scale(.94)}}
.callout button{padding:9px 16px;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.callout button:hover{background:var(--fill3)}
.callout .d{width:1px;background:var(--sep);flex:none}
.dot{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.dot.mark{background:var(--hl-mark);border:1px solid rgba(0,0,0,.12)}
.dot.word{background:var(--hl-word);border:1px solid rgba(0,0,0,.12)}
.dot.memo{background:none;border-bottom:2px solid var(--memo-line);border-radius:0;height:6px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;gap:8px;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--elevated) 90%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--sep);box-shadow:0 -6px 24px rgba(0,0,0,.10);animation:barup .24s var(--ease)}
@keyframes barup{from{transform:translateY(100%)}}
.actionbar button{flex:1;padding:11px 6px;border-radius:var(--r1);font-size:14px;background:var(--fill3);
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500}
.actionbar button:active{background:var(--fill2)}

/* ---------------- inspector ---------------- */
.panel{background:var(--window);border-left:1px solid var(--sep);overflow:auto;padding:0 0 60px}
.phead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:50px;padding:0 15px;
  background:color-mix(in srgb,var(--window) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--sep)}
.phead h4{font-size:13.5px;font-weight:590;margin:0}
.pbody{padding:13px 15px}
.card{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:14px;margin-bottom:10px;
  animation:rise .22s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.term{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.018em;line-height:1.15;margin:0 0 3px}
.pos{font-size:12.5px;color:var(--label3);margin-bottom:11px}
.f{margin:10px 0}
.f .k{font-size:11px;font-weight:590;color:var(--label3);margin-bottom:3px}
.f .v{font-size:13.5px;line-height:1.5} .f .v.ko{font-size:14.5px;line-height:1.55}
.quote{border-left:2px solid var(--blue);padding:1px 0 1px 10px;font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--label2)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid var(--sep)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--fill2);color:var(--label2)}
.tg button{color:var(--label3);font-size:13px;line-height:1}
.taginput{border:none;background:var(--fill3);border-radius:99px;padding:4px 10px;font-size:12px;width:100px;outline:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:510;padding:2.5px 8px;border-radius:99px;background:var(--fill2);color:var(--label2)}
.badge.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.badge.due{background:color-mix(in srgb,#FF9500 18%,transparent);color:#C2700A}
[data-theme="dark"] .badge.due{color:#FF9F0A}
.badge.mark{background:var(--hl-mark);color:var(--mark-ink)}
.badge.word{background:var(--hl-word);color:var(--word-ink)}
.badge.memo{background:color-mix(in srgb,var(--memo-line) 20%,transparent);color:var(--memo-line)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0}
.setrow .k{font-size:13px;color:var(--label2)}
.spin{width:13px;height:13px;border:2px solid var(--fill1);border-top-color:var(--blue);border-radius:50%;
  animation:sp .65s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{border-radius:var(--r2);padding:12px;font-size:13px;line-height:1.5;background:color-mix(in srgb,#FF3B30 9%,transparent);color:#C4271D}
[data-theme="dark"] .err{color:#FF6961}

/* ---------------- test ---------------- */

<script>
/* =========================================================================
   MyDrive — prototype v0.5

   Three things can happen to a piece of text, and they are different in kind:
     word      an unknown word -> looked up, stored with its paragraph
     memo      something I thought, doubted, or want to check later
     highlight this sentence matters -> a personal mark, no database entry
   Everything in the reader follows from that split.
   ========================================================================= */
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isKo=s=>/[\uAC00-\uD7A3]/.test(s);
const dayjs=n=>new Date(Date.now()+n*864e5).toISOString();

const ICON={
 library:'<path d="M4 5.5A1.5 1.5 0 015.5 4H9v16H5.5A1.5 1.5 0 014 18.5z"/><path d="M9 4h4.5A1.5 1.5 0 0115 5.5v13a1.5 1.5 0 01-1.5 1.5H9z"/><path d="M16.4 5.6l2.2.6a1.5 1.5 0 011 1.9l-3 11.2"/>',
 words:'<path d="M4 18.5L9.6 5h1.8L17 18.5"/><path d="M6.4 14h8.2"/><path d="M19.5 18.5V9"/>',
 knowledge:'<path d="M12 3.5c-3.6 0-6.5 2.7-6.5 6 0 2 1 3.4 2 4.4.7.8 1 1.5 1 2.4v.7h7v-.7c0-.9.3-1.6 1-2.4 1-1 2-2.4 2-4.4 0-3.3-2.9-6-6.5-6z"/><path d="M9.5 20.5h5"/>',
 review:'<path d="M3.5 12a8.5 8.5 0 108.5-8.5c-2.6 0-4.9 1.2-6.4 3"/><path d="M3.6 3.9v3.8h3.8"/><path d="M12 7.8V12l2.8 1.8"/>',
 today:'<path d="M4 19V9"/><path d="M9.3 19V5"/><path d="M14.7 19v-7"/><path d="M20 19v-11"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>'};
const svg=(n,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ---------- storage: sandbox store, then localStorage, then memory ---------- */
/* Browser storage is finite and fails loudly only if you let it: a swallowed
   QuotaExceededError means the app keeps reporting "Saved" while nothing is
   written. Failures are surfaced, and pending writes flush before unload. */
const mem={};
let storageFull=false,storageWarned=false;
const store={
 async get(k){
  try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value);}catch(e){}
  try{const v=localStorage.getItem(k);
   if(v!=null&&v!=='undefined')return JSON.parse(v);}catch(e){}
  return mem[k]??null;},
 async set(k,v){
  if(v===undefined)return false;          // never write a hole over real data
  mem[k]=v;
  const str=JSON.stringify(v);
  let written=false;
  try{await window.storage.set(k,str);written=true;}catch(e){}
  try{localStorage.setItem(k,str);written=true;storageFull=false;touchMeta(k);}
  catch(e){
   // With a server copy this is a cache miss, not data loss; say so accordingly.
   if(!written&&!storageWarned&&!SB.on){
    storageFull=true;storageWarned=true;
    toast('Storage is full — export a backup and remove a document');
    setTimeout(()=>{storageWarned=false;},60000);}
  }
  if(SB.on){
   if(k.startsWith('pkos:doc:'))sbPushDoc(k.slice(9),v.content||'').catch(()=>{});
   else sbPushState(k,v).catch(()=>{});
   written=true;
  }
  return written;}};
function storageBytes(){
 try{let n=0;for(const k in localStorage)
  if(k.startsWith('pkos:'))n+=(localStorage.getItem(k)||'').length;return n;}catch(e){return 0;}
}
/* =======================================================================
   Supabase sync.

   The app keeps working exactly as before when signed out: everything lands
   in localStorage. Signing in adds a second destination, so the browser stops
   being the only copy and stops being the size limit.

   Talking to PostgREST and GoTrue directly avoids pulling a bundler into a
   project that deliberately has no build step. The anon key is public by
   design; Row Level Security is what keeps one account out of another's rows.
   ======================================================================= */
const SB={url:null,anon:null,token:null,refresh:null,user:null,on:false,syncing:false,
 lastError:null,configured:null,warning:null};
const SB_KEYS={'pkos:index':'index','pkos:knowledge':'knowledge','pkos:reviewlogs':'reviewlogs',
 'pkos:prefs':'prefs','pkos:stats':'stats'};
const localMeta=()=>{try{return JSON.parse(localStorage.getItem('pkos:meta')||'{}');}catch(e){return {};}};
const touchMeta=k=>{try{const m=localMeta();m[k]=now();localStorage.setItem('pkos:meta',JSON.stringify(m));}catch(e){}};

async function sbInit(){
 try{const r=await fetch('/api/config');const j=await r.json();
  SB.url=j.supabaseUrl;SB.anon=j.supabaseAnonKey;SB.warning=j.warning||null;
  SB.configured=Boolean(j.supabase);}
 catch(e){SB.configured=false;SB.warning='Could not reach /api/config';}
 try{const t=JSON.parse(localStorage.getItem('pkos:session')||'null');
  if(t){SB.token=t.access_token;SB.refresh=t.refresh_token;SB.user=t.user;SB.on=Boolean(SB.url&&SB.anon);}}catch(e){}
}
function sbStore(j){
 SB.token=j.access_token;SB.refresh=j.refresh_token;SB.user=j.user||SB.user;SB.on=true;
 try{localStorage.setItem('pkos:session',JSON.stringify(
  {access_token:SB.token,refresh_token:SB.refresh,user:SB.user}));}catch(e){}
}
function sbClear(){
 SB.token=SB.refresh=SB.user=null;SB.on=false;
 try{localStorage.removeItem('pkos:session');}catch(e){}
}
async function sbAuth(path,body){
 const r=await fetch(`${SB.url}/auth/v1/${path}`,{method:'POST',
  headers:{'Content-Type':'application/json',apikey:SB.anon},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('auth '+r.status));
 return j;
}
async function sbRefreshToken(){
 if(!SB.refresh)return false;
 try{sbStore(await sbAuth('token?grant_type=refresh_token',{refresh_token:SB.refresh}));return true;}
 catch(e){sbClear();return false;}
}
async function sbRest(path,init={},retry=true){
 const r=await fetch(SB.url+'/rest/v1/'+path,{...init,
  headers:{'Content-Type':'application/json',apikey:SB.anon,
   Authorization:'Bearer '+SB.token,...(init.headers||{})}});
 if(r.status===401&&retry&&await sbRefreshToken())return sbRest(path,init,false);
 return r;
}
async function sbSignIn(email,password,create){
 if(!SB.url||!SB.anon)throw new Error('SUPABASE_URL and SUPABASE_ANON_KEY are not set in Vercel. Add them and redeploy.');
 const j=await sbAuth(create?'signup':'token?grant_type=password',{email,password});
 if(create&&!j.access_token)throw new Error('Check your email to confirm the account, then sign in.');
 sbStore(j);
 await sbPull();
}
/* First contact on a device: take whichever side was written more recently,
   per key. A fresh browser has no local timestamps, so it takes the server. */
async function sbPull(){
 if(!SB.on)return;
 SB.syncing=true;paintUsage();
 try{
  const r=await sbRest('app_state?select=key,value,updated_at');
  if(!r.ok)throw new Error('pull '+r.status);
  const rows=await r.json();
  const meta=localMeta();
  for(const row of rows){
   const localKey=Object.keys(SB_KEYS).find(k=>SB_KEYS[k]===row.key);
   if(!localKey)continue;
   const mine=meta[localKey];
   if(mine&&mine>row.updated_at)continue;           // local is newer, keep it
   if(localKey==='pkos:index')DB.index=row.value;
   else if(localKey==='pkos:knowledge')Object.assign(K,row.value);
   else if(localKey==='pkos:reviewlogs')DB.reviewlogs=row.value;
   else if(localKey==='pkos:prefs')DB.prefs={...DEFAULT_PREFS,...row.value};
   else if(localKey==='pkos:stats')DB.stats=row.value;
   try{localStorage.setItem(localKey,JSON.stringify(row.value));}catch(e){}
  }
  SB.lastError=null;
  knownCache={id:null,n:-1,count:0};
  applyPrefs();
 }catch(e){SB.lastError=e.message;}
 SB.syncing=false;
 render();
}
/* A status code alone is not actionable; PostgREST explains itself in the body. */
async function sbWhy(r,what){
 let detail='';
 try{const j=await r.json();detail=j.message||j.hint||j.details||'';}catch(e){}
 return `${what} ${r.status}${detail?': '+detail:''}`;
}
async function sbPushState(localKey,value){
 if(!SB.on||!SB.user)return;
 const key=SB_KEYS[localKey];if(!key)return;
 // Composite primary key, so the conflict target is stated explicitly rather
 // than left for PostgREST to infer.
 const r=await sbRest('app_state?on_conflict=user_id,key',{method:'POST',
  headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify({user_id:SB.user.id,key,value})});
 if(!r.ok)SB.lastError=await sbWhy(r,'state '+key);
}
async function sbPushDoc(id,content){
 if(!SB.on||!SB.user)return;
 const r=await sbRest('documents?on_conflict=user_id,id',{method:'POST',
  headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify({user_id:SB.user.id,id,content})});
 if(!r.ok)SB.lastError=await sbWhy(r,'document');
}
async function sbGetDoc(id){
 if(!SB.on)return null;
 const r=await sbRest(`documents?id=eq.${encodeURIComponent(id)}&select=content`);
 if(!r.ok)return null;
 const rows=await r.json();
 return rows[0]?{id,content:rows[0].content}:null;
}
async function sbDeleteDoc(id){
 if(!SB.on)return;
 await sbRest(`documents?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});
}

let wt=null,dirty=new Set();
function save(...keys){keys.forEach(k=>dirty.add(k));clearTimeout(wt);wt=setTimeout(flushWrites,300);}
/* The storage key and the field it holds are not the same name, so the value
   has to be looked up through this map. Writing DB[key] directly stored
   undefined, which meant nothing survived a reload. */
const DBFIELD={'pkos:index':'index','pkos:knowledge':'knowledge','pkos:reviewlogs':'reviewlogs',
 'pkos:tcache':'tcache','pkos:stats':'stats','pkos:prefs':'prefs','pkos:briefing':'briefing'};
const dbValue=k=>DBFIELD[k]?DB[DBFIELD[k]]:DB[k];
function flushWrites(){
 if(wt){clearTimeout(wt);wt=null;}
 const keys=[...dirty];dirty.clear();
 keys.forEach(k=>{const v=dbValue(k);if(v!==undefined)store.set(k,v);});
}
window.addEventListener('pagehide',flushWrites);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushWrites();});

const SCHEMA=2;   // bump when the stored shape changes; migrations run in boot()
const DEFAULT_PREFS={theme:'auto',read:19,font:'serif',width:'normal',lh:1.68,panel:true,newPerDay:10};
const DB={index:{docs:[]},
 knowledge:{highlights:[],vocabulary:[],concepts:[],thoughts:[],questions:[],writings:[]},
 reviewlogs:[],
 tcache:{},stats:{apiCalls:0,cacheHits:0},prefs:{...DEFAULT_PREFS}};
const K=DB.knowledge;
const DOMAINS=['Major / Career','English / Liberal Arts','World / News / Investment','General Knowledge'];
const WIDTHS={narrow:'34em',normal:'40em',wide:'48em'};
const KINDLABEL={mark:'Highlight',word:'Word',memo:'Memo'};

const SEED=[
{id:'doc_seed_en',title:'Efficiency Constraints in On-Device Vision Models',author:'Sample',language:'en',domain:'Major / Career',content:
`Running a vision model on a phone is not the same problem as running one in a data centre. The constraint that dominates is not raw arithmetic but memory traffic: every tensor that has to be written out to DRAM and read back costs far more energy than the multiplication that produced it. A design that substantially reduces parameter count can therefore still be slow, because parameters are not what the hardware is struggling with.

This is why depthwise separable convolutions became so widespread. Splitting a standard convolution into a per-channel spatial filter followed by a pointwise projection cuts the arithmetic by roughly an order of magnitude, and the intermediate tensors stay small enough to remain in cache. The saving is real, but it is contingent on the surrounding architecture keeping those tensors resident.

A second observation follows from this. If the expensive step is moving wide activations around, then the network should be wide only where it must be, and narrow everywhere the data has to travel. The bottleneck layer exists for exactly this reason. Expansion happens inside a block, where the tensor never leaves fast memory; the representation that crosses between blocks is deliberately thin.

The trade-off is not free. A thin representation carries less information, and a nonlinearity applied to a low-dimensional tensor destroys a disproportionate amount of it. Removing the activation from the projection step recovers much of the loss, which is a reminder that architectural choices interact rather than compose independently.`},
{id:'doc_seed_ko',title:'기술 선택에서의 상충 관계',author:'Sample',language:'ko',domain:'General Knowledge',content:
`엔지니어링에서 최적의 설계란 존재하지 않는다. 존재하는 것은 특정 제약 조건 아래에서의 타당한 절충뿐이다. 정확도와 지연 시간, 메모리와 전력, 개발 속도와 유지보수성은 대개 서로 상충한다. 어느 한쪽을 개선하면 다른 쪽이 반드시 악화된다는 뜻은 아니지만, 아무 대가 없이 개선되는 경우는 드물다.

이때 필요한 것은 정량화다. 무엇을 얼마나 포기하고 무엇을 얼마나 얻는지 숫자로 말할 수 없다면, 그 결정은 취향에 불과하다. 반대로 수치로 환산된 절충안은 나중에 조건이 바뀌었을 때 다시 검토할 수 있는 근거가 된다.

기록되지 않은 판단은 시간이 지나면 소실된다. 반년 뒤의 나는 그때의 제약 조건을 기억하지 못하고, 결론만 남은 코드를 보며 왜 이렇게 했는지 되묻게 된다. 판단의 근거를 남기는 일은 문서화가 아니라 미래의 의사결정 비용을 낮추는 투자다.`}];

let state={view:'today',docId:null,panel:null,tab:'concepts',wordFilter:'all',hlFilter:'all',
 domain:'all',sort:'recent',query:'',revealed:false,testing:false,testQueue:[],
 briefLoading:false,pickVocab:new Set(),openDoc:null,allLinks:false,
 qtype:null,choices:null,picked:null,clozeOk:null,sessionDone:0,confirmDel:null};

const $=id=>document.getElementById(id);
const $view=$('view'),$panel=$('panel'),$nav=$('nav'),$tb=$('tbtitle'),
      $toolbar=$('toolbar'),$usage=$('usage'),$main=$('main'),$app=$('app');

(async function boot(){
 await sbInit();                       // must run before anything asks whether sync exists
 const [ix,kn,tc,st,pf,rl,bf]=await Promise.all(
  ['pkos:index','pkos:knowledge','pkos:tcache','pkos:stats','pkos:prefs','pkos:reviewlogs','pkos:briefing'].map(store.get));
 if(bf&&bf.fetchedFor===new Date().toISOString().slice(0,10))DB.briefing=bf;
 if(kn)Object.assign(K,kn);
 /* Review logs used to sit inside the knowledge blob, which meant every
    highlight re-serialised thousands of rows. They now live in their own key. */
 DB.reviewlogs=rl||kn?.reviewLogs||[];
 if(K.reviewLogs){delete K.reviewLogs;save('pkos:knowledge','pkos:reviewlogs');}
 if(tc)DB.tcache=tc; if(st)DB.stats=st;
 if(pf)DB.prefs={...DEFAULT_PREFS,...pf};
 if(!K.writings)K.writings=[];
 K.highlights.forEach(h=>{                         // migrate colour-era highlights
  if(!h.tags)h.tags=[];
  if(!h.kind)h.kind=K.vocabulary.some(v=>v.sourceHighlightId===h.id)?'word':'mark';});
 K.vocabulary.forEach(v=>{
  if(!v.tags)v.tags=[];
  if(v.ease==null)v.ease=2.5; if(v.reps==null)v.reps=0;
  if(v.lapses==null)v.lapses=0; if(v.stage==null)v.stage=0; if(v.interval==null)v.interval=0;});
 applyPrefs();
 if(ix&&ix.docs?.length)DB.index=ix;
 else{
  DB.index.docs=SEED.map(d=>({id:d.id,title:d.title,author:d.author,language:d.language,domain:d.domain,
   chars:d.content.length,progress:0,createdAt:now(),lastReadAt:null}));
  for(const d of SEED)await store.set('pkos:doc:'+d.id,{id:d.id,content:d.content});
  await store.set('pkos:index',DB.index);
 }
 try{history.replaceState({view:'today',docId:null},'');}catch(e){}
 render();
 if(SB.on)sbPull();
})();

function applyPrefs(){
 const p=DB.prefs;
 document.documentElement.dataset.theme=p.theme||'auto';
 document.body.style.setProperty('--read',(p.read||19)+'px');
 document.body.style.setProperty('--rw',WIDTHS[p.width]||WIDTHS.normal);
 document.body.style.setProperty('--lh',p.lh||1.68);
 document.body.className=document.body.className.replace(/readfont-\w+/g,'').trim();
 if(p.font!=='serif')document.body.classList.add('readfont-'+p.font);
 $app.classList.toggle('nopanel',p.panel===false);

const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(36);};
let API_MODE=null;            // 'server' | 'sandbox', latched only on proof
const inflight=new Map();     // one request per identical lookup

async function llm(mode,text,sentence,lang,key){
 if(key&&DB.tcache[key]){DB.stats.cacheHits++;save('pkos:stats');paintUsage();return{data:DB.tcache[key],cached:true};}
 if(key&&inflight.has(key)){return{data:await inflight.get(key),cached:true};}
 const job=(async()=>{
  let data=null;
  if(API_MODE!=='sandbox'){
   let r=null,threw=false;
   try{r=await fetch('/api/lookup',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode,text,sentence,lang})});}catch(e){threw=true;}
   if(r&&r.ok){API_MODE='server';data=await r.json();}
   else if(r&&(r.status===404||r.status===405)){API_MODE='sandbox';}   // no server function here
   else if(r){const j=await r.json().catch(()=>({}));throw new Error(j.error||('server returned '+r.status));}
   else if(threw&&API_MODE==='server'){throw new Error('Could not reach /api/lookup');}
   // A transient network failure on the very first call must not permanently
   // decide which route this session uses, so nothing is latched here.
  }
  if(!data){
   try{data=await sandboxLLM(mode,text,sentence,lang);API_MODE='sandbox';}
   catch(e){throw new Error(API_MODE==='sandbox'?e.message:'Could not reach /api/lookup');}
  }
  DB.stats.apiCalls++;
  if(key){DB.tcache[key]=data;const ks=Object.keys(DB.tcache);
   if(ks.length>200)ks.slice(0,ks.length-200).forEach(k=>delete DB.tcache[k]);save('pkos:tcache');}
  save('pkos:stats');paintUsage();
  return data;
 })();
 if(key)inflight.set(key,job);
 try{return{data:await job,cached:false};}
 finally{if(key)inflight.delete(key);}
}

const SB_SYS='You are a bilingual English-Korean reading assistant. Write meanings in Korean. Output raw JSON only.';
const SB_P={
 term:(t,s,l)=>`TASK: term lookup\nSELECTED: ${JSON.stringify(t)}\nSENTENCE: ${JSON.stringify(s)}\nLANG: ${l}\nJSON: {"term":str,"lang":str,"pos":str,"pron":str,"contextual":str,"general":str,"en":str,"hanja":str,"sentence_ko":str,"example":str,"example_ko":str,"concept":str,"tags":[str]}`,
 passage:(t,s,l)=>`TASK: passage translation\nSELECTED: ${JSON.stringify(t)}\nLANG: ${l}\nJSON: {"translation":str,"gist":str,"terms":[{"term":str,"meaning":str}]}`,
 explain:(t,s)=>`TASK: simple explanation\nSELECTED: ${JSON.stringify(t)}\nSENTENCE: ${JSON.stringify(s)}\nJSON: {"explanation":str,"analogy":str}`,
 deep:(t,s)=>`TASK: deep explanation\nSELECTED: ${JSON.stringify(t)}\nSENTENCE: ${JSON.stringify(s)}\nJSON: {"explanation":str,"analogy":str}`};
async function sandboxLLM(mode,text,sentence,lang){
 const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SB_SYS,
   messages:[{role:'user',content:SB_P[mode](text,sentence,lang)}]})});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
 try{return JSON.parse(txt);}catch(e){throw new Error('Unreadable response');}
}

/* Editing source text shifts every offset after the edit, so each highlight
   re-finds its own text near where it used to sit. Anything that truly

function reanchor(docId,newText){
 let moved=0,lost=0;
 K.highlights.filter(h=>h.documentId===docId).forEach(h=>{
  if(newText.slice(h.start,h.end)===h.selectedText){h.orphaned=false;return;}
  let i=newText.indexOf(h.selectedText,Math.max(0,h.start-800));
  if(i<0)i=newText.indexOf(h.selectedText);
  if(i<0){h.orphaned=true;lost++;return;}
  h.start=i;h.end=i+h.selectedText.length;
  h.position={type:'text-offset',start:h.start,end:h.end};h.orphaned=false;moved++;});
 return{moved,lost};
}

/* Import merges by id and never overwrites, so restoring an old backup on top
   of newer work cannot destroy the newer work. */
async function importAll(text){
 const d=JSON.parse(text);
 if(d.app!=='MyDrive')throw new Error('Not a MyDrive backup file');
 let docs=0,items=0;
 const have=new Set(DB.index.docs.map(x=>x.id));
 for(const doc of d.index?.docs||[]){
  if(have.has(doc.id))continue;
  DB.index.docs.push(doc);
  await store.set('pkos:doc:'+doc.id,{id:doc.id,content:(d.docs||{})[doc.id]||''});
  docs++;}
 ['highlights','vocabulary','concepts','thoughts','questions'].forEach(k=>{
  const ids=new Set(K[k].map(x=>x.id));
  (d.knowledge?.[k]||[]).forEach(x=>{if(!ids.has(x.id)){K[k].push(x);items++;}});});
 const lids=new Set(DB.reviewlogs.map(x=>x.id));
 (d.reviewlogs||[]).forEach(x=>{if(!lids.has(x.id))DB.reviewlogs.push(x);});
 knownCache={id:null,n:-1,count:0};
 save('pkos:index','pkos:knowledge','pkos:reviewlogs');
 return{docs,items};
}

/* ---------- Words: SM-2 scheduling, escalating question types ---------- */
const QTYPES=['choice','recall','cloze','reverse'];
const QLABEL={choice:'Pick the meaning',recall:'What does it mean?',cloze:'Fill the blank',
 reverse:'Say it in English',produce:'Use it in a sentence'};
const QSHORT={choice:'Choice',recall:'Recall',cloze:'Cloze',reverse:'Reverse',produce:'Write'};
const newPerDay=()=>DB.prefs.newPerDay||10;
function clozeOf(v){
 const sent=v.sourceSentence||v.exampleSentence||'';
 if(!sent||!v.word)return null;
 const i=sent.toLowerCase().indexOf(String(v.word).toLowerCase());
 return i<0?null:sent.slice(0,i)+'______'+sent.slice(i+String(v.word).length);
}
function qtypeFor(v){
 let t=QTYPES[Math.min(4,v.stage||0)];
 if(t==='cloze'&&!clozeOf(v))t='recall';
 if(t==='choice'&&K.vocabulary.filter(x=>x.contextualMeaning||x.meaning).length<4)t='recall';
 if(t==='reverse'&&!(v.contextualMeaning||v.meaning))t='recall';
 return t;
}
function choicesFor(v){
 const right=v.contextualMeaning||v.meaning||'';
 const wrong=[...new Set(K.vocabulary.filter(x=>x.id!==v.id&&(x.contextualMeaning||x.meaning))
  .map(x=>x.contextualMeaning||x.meaning).filter(m=>m!==right))];
 return [...wrong.sort(()=>Math.random()-.5).slice(0,3),right]
  .sort(()=>Math.random()-.5).map(t=>({t,ok:t===right}));
}
function rollNew(){const t=new Date().toISOString().slice(0,10);
 if(DB.stats.newDate!==t){DB.stats.newDate=t;DB.stats.newToday=0;save('pkos:stats');}}
function buildSession(){
 rollNew();
 const pool=dueWords();
 const seen=pool.filter(v=>v.reps>0).sort((a,b)=>String(a.nextReviewAt||'').localeCompare(String(b.nextReviewAt||'')));
 const room=Math.max(0,newPerDay()-(DB.stats.newToday||0));
 return [...seen,...pool.filter(v=>!v.reps).slice(0,room)];
}
function schedule(v,g){
 rollNew();
 if(!v.reps){DB.stats.newToday=(DB.stats.newToday||0)+1;v.introducedAt=now();}
 v.ease=Math.max(1.3,Math.min(3.2,(v.ease||2.5)+[-0.2,-0.15,0,0.15][g]));
 v.reps=(v.reps||0)+1;
 if(g===0){
  v.lapses=(v.lapses||0)+1;v.interval=0;v.stage=Math.max(0,(v.stage||0)-1);
  v.nextReviewAt=new Date(Date.now()+6e5).toISOString();
  v.reviewStatus='learning';

  if(g>=2)v.stage=Math.min(4,(v.stage||0)+1);
 }
 v.lastReviewedAt=now();v.updatedAt=now();
 DB.reviewlogs.push({id:uid('rl'),itemId:v.id,itemType:'vocabulary',grade:g,
  mode:state.qtype||'recall',intervalAfter:v.interval,at:now()});
 if(DB.reviewlogs.length>3000)DB.reviewlogs.splice(0,DB.reviewlogs.length-3000);
 save('pkos:knowledge','pkos:stats','pkos:reviewlogs');

async function loadBriefing(force){

 render();
}

/* Linked headlines first, then unlinked ones, so the clickable material is
   at the top where it is useful. */
function todayRefs(){
 const b=DB.briefing;if(!b)return [];
 const out=[],seen=new Set();
 for(const l of b.links||[]){
  const k=l.title.slice(0,60);if(seen.has(k))continue;seen.add(k);out.push(l);}
 for(const it of b.items||[]){
  const k=it.title.slice(0,60);if(seen.has(k))continue;seen.add(k);out.push(it);}
 return out;
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u.slice(0,30);}}
/* Headings carry the shape of the briefing, so they survive into the preview. */
function fmtFeed(t){
 return String(t||'').split('\n').map(l=>{
  const line=l.trim();
  if(!line)return '';
  if(line.startsWith('## ')||line.startsWith('# '))
   return `<h4 class="fh">${esc(line.replace(/^#+\s*/,''))}</h4>`;
  if(line.startsWith('### '))return `<h4 class="fh">${esc(line.slice(4))}</h4>`;
  if(line==='---')return '<hr class="fhr">';
  return `<p>${esc(line)}</p>`;}).join('');
}

/* Daily writing. The prompt comes from what was actually read today and the
   constraint from what was actually saved, so there is never a blank page and
   the words get used rather than only collected. */
function todayPrompt(){
 const b=DB.briefing;
 const links=b?.links||[];
 if(links.length){
  const l=links[new Date().getDate()%links.length];
  return `On today's feed — "${l.title.slice(0,90)}": what follows from it, and what do you doubt?`;}
 if(b?.docs?.length)return `On ${b.docs[0].title}: which claim is strongest, and which is weakest?`;
 const t=[...K.thoughts].slice(-1)[0];
 if(t)return 'Take your last memo further, in English: '+t.body.slice(0,90);
 const d=DB.index.docs.find(x=>x.progress>.02);
 return d?`What is the main claim of "${d.title}", and do you accept it?`
        :'What did you read today, and what changed your mind?';
}

  <h3 class="sec" style="margin-top:4px">Briefing</h3>

  <h3 class="sec">Word test</h3>
  ${K.vocabulary.length?`<div class="card">
    <div class="flexrow" style="margin:0;justify-content:space-between;align-items:center">
     <span><b style="font-size:23px;font-variant-numeric:tabular-nums">${session.length}</b>
      <span style="color:var(--label2);font-size:13px;margin-left:7px">due now · ${K.vocabulary.length} saved</span></span>
     ${session.length?'<button class="btn" data-test>Start test</button>':'<span style="font-size:13px;color:var(--label3)">Nothing due</span>'}</div></div>`
  :'<div class="empty">Save a few words first</div>'}
  <h3 class="sec">Write</h3>
  ${writeCard()}
  <h3 class="sec">Continue reading</h3>
  ${reading.length?`<div class="list">${reading.map(docRow).join('')}</div>`:'<div class="empty">Nothing in progress</div>'}
  ${qs.length?`<h3 class="sec">Open questions</h3>
   <div class="list">${qs.map(q=>`<button class="item" data-item="questions:${q.id}">
    <h4>${esc(q.body.slice(0,90))}</h4></button>`).join('')}</div>`:''}
  </div>`;
}

function viewSearch(){
 const q=state.query.toLowerCase(),hit=(...f)=>f.filter(Boolean).join(' ').toLowerCase().includes(q);
 $tb.textContent='Search';
 const g=[
  ['Documents',DB.index.docs.filter(d=>hit(d.title,d.author)),d=>({t:d.title,s:d.author,open:d.id})],
  ['Words',K.vocabulary.filter(v=>hit(v.word,v.meaning,v.contextualMeaning,(v.tags||[]).join(' '))),v=>({t:v.word,s:v.contextualMeaning,item:'vocabulary:'+v.id})],
  ['Concepts',K.concepts.filter(c=>hit(c.name,c.definition)),c=>({t:c.name,s:c.definition,item:'concepts:'+c.id})],
  ['Thoughts',K.thoughts.filter(x=>hit(x.body)),x=>({t:x.body.slice(0,70),s:'',item:'thoughts:'+x.id})],
  ['Questions',K.questions.filter(x=>hit(x.body)),x=>({t:x.body.slice(0,70),s:x.status,item:'questions:'+x.id})],
  ['Writing',(K.writings||[]).filter(w=>hit(w.body,w.corrected,w.prompt)),w=>({t:(w.prompt||w.body).slice(0,70),s:w.corrected,item:'writings:'+w.id})],
  ['Marks',K.highlights.filter(h=>hit(h.selectedText,h.note,(h.tags||[]).join(' '))),h=>({t:h.selectedText.slice(0,70),s:meta(h.documentId)?.title,item:'highlights:'+h.id})]];
 const total=g.reduce((n,[,l])=>n+l.length,0);
 $view.innerHTML=`<div class="view"><div class="largetitle"><h1>${esc(state.query)}</h1><span class="c">${total}</span></div>
  ${g.filter(([,l])=>l.length).map(([label,list,map])=>`<h3 class="sec">${label}
   <span style="color:var(--label3);font-size:13px;font-weight:450;margin-left:6px">${list.length}</span></h3>
   <div class="list">${list.slice(0,8).map(o=>{const r=map(o);
    return `<button class="item" ${r.open?`data-open="${r.open}"`:`data-item="${r.item}"`}>
    <h4>${esc(r.t)}</h4>${r.s?`<div class="b">${esc(String(r.s))}</div>`:''}</button>`}).join('')}</div>`).join('')
   ||'<div class="empty">No results</div>'}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 try{
 const T=e.target;
 const th=T.closest('[data-settheme]');
 if(th){DB.prefs.theme=th.dataset.settheme;applyPrefs();store.set('pkos:prefs',DB.prefs);return paintUsage();}
 const nav=T.closest('[data-nav]');if(nav)return go(nav.dataset.nav);
 const op=T.closest('[data-open]');if(op)return go('reader',{docId:op.dataset.open});
 const dm=T.closest('[data-dom]');if(dm){state.domain=dm.dataset.dom;return render();}
 const so=T.closest('[data-sort]');if(so){state.sort=so.dataset.sort;return render();}
 const tab=T.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;return render();}
 const wf=T.closest('[data-wf]');if(wf){state.wordFilter=wf.dataset.wf;return render();}
 const hf=T.closest('[data-hf]');if(hf){state.hlFilter=hf.dataset.hf;return render();}

 if(T.closest('#panelbtn')){
  if(window.innerWidth<=1120){$panel.classList.toggle('open');return;}
  DB.prefs.panel=DB.prefs.panel===false;applyPrefs();store.set('pkos:prefs',DB.prefs);return;}
 if(T.closest('[data-produce]')){
  const v=state.testQueue[0],txt=($('prodin')?.value||'').trim();
  if(!txt)return toast('Write a sentence first');
  state.produced=txt;state.checking=true;render();
  try{const{data}=await llm('critique',txt,v.word,'en',hash('crit|'+v.word+'|'+txt));
   state.critique=data;}
  catch(e){state.critique={ok:false,corrected:txt,note:'Could not check: '+e.message};}
  state.checking=false;
  const v2=state.testQueue[0];
  if(v2&&state.critique?.corrected)v2.userExample=state.critique.corrected;
  save('pkos:knowledge');return render();}
 if(T.closest('[data-skipprod]')){state.qtype='recall';return render();}
 if(T.closest('[data-essay]')){
  const txt=($('essayin')?.value||'').trim();
  if(txt.length<20)return toast('Write a little more');
  state.essayText=txt;state.checking=true;render();
  try{const{data}=await llm('essay',txt,todayPrompt(),'en',hash('essay|'+txt));
   state.essay=data;}
  catch(e){state.essay={corrected:txt,note:'Could not check: '+e.message};}
  state.checking=false;return render();}
 if(T.closest('[data-essaysave]')){
  K.writings.push({id:uid('w'),prompt:todayPrompt(),body:state.essayText||'',
   corrected:state.essay?.corrected||'',note:state.essay?.note||'',
   createdAt:now(),updatedAt:now(),origin:'user'});
  state.essay=null;state.essayText='';save('pkos:knowledge');render();return toast('Kept');}
 if(T.closest('[data-essayreset]')){state.essay=null;state.essayText='';return render();}
 if(T.closest('[data-account]')){state.panel={type:'account'};return paintPanel();}
 if(T.closest('[data-recheck]')){await sbInit();render();
  return toast(SB.configured?'Supabase is reachable':'Still not configured');}
 const si=T.closest('[data-signin]')||T.closest('[data-signup]');
 if(si){
  if(!SB.url||!SB.anon){await sbInit();
   if(!SB.url||!SB.anon){state.panel={type:'account'};paintPanel();
    return toast('Server is not configured yet');}}
  const email=($('sbemail')?.value||'').trim(),pw=$('sbpass')?.value||'';
  if(!email||!pw)return toast('Email and password required');
  try{await sbSignIn(email,pw,si.hasAttribute('data-signup'));
   state.panel=null;render();return toast('Signed in');}
  catch(err){state.panel={type:'account',email,error:err.message};return paintPanel();}}
 if(T.closest('[data-signout]')){sbClear();state.panel=null;render();return toast('Signed out');}
 if(T.closest('[data-pull]')){await sbPull();return toast('Pulled from server');}
 if(T.closest('[data-pushall]')){
  toast('Pushing…');
  const map={'pkos:index':DB.index,'pkos:knowledge':K,'pkos:reviewlogs':DB.reviewlogs,
             'pkos:prefs':DB.prefs,'pkos:stats':DB.stats};
  for(const k of Object.keys(map))await sbPushState(k,map[k]);
  for(const d of DB.index.docs){const c=await loadDoc(d.id);await sbPushDoc(d.id,c?.content||'');}
  render();return toast('Everything pushed');}
 if(T.closest('[data-brief]')){await loadBriefing(true);return;}
 const xp=T.closest('[data-expand]');
 if(xp){state.openDoc=state.openDoc===xp.dataset.expand?null:xp.dataset.expand;return render();}
 if(T.closest('[data-alllinks]')){state.allLinks=!state.allLinks;return render();}
 if(T.closest('[data-allvoc]')){
  const all=(DB.briefing?.docs||[]).flatMap(d=>d.vocab||[]);
  const fresh=all.filter((v,i)=>all.findIndex(x=>x.word.toLowerCase()===v.word.toLowerCase())===i
    &&!K.vocabulary.some(x=>String(x.word).toLowerCase()===v.word.toLowerCase()));
  if(state.pickVocab.size===fresh.length)state.pickVocab.clear();
  else fresh.forEach((_,i)=>state.pickVocab.add(i));
  return render();}
 const kdoc=T.closest('[data-keepdoc]');
 if(kdoc){
  const d=(DB.briefing?.docs||[]).find(x=>x.key===kdoc.dataset.keepdoc);
  if(!d)return;
  const id=uid('doc');
  DB.index.docs.unshift({id,title:d.title,author:'Notion feed',domain:'World / News / Investment',
   language:'en',chars:d.text.length,progress:0,createdAt:now(),lastReadAt:null});
  await store.set('pkos:doc:'+id,{id,content:d.text});docCache[id]={id,content:d.text};
  save('pkos:index');render();return toast('Saved to Library');}
 const vc=T.closest('[data-voc]');
 if(vc){const i=+vc.dataset.voc;
  state.pickVocab.has(i)?state.pickVocab.delete(i):state.pickVocab.add(i);return render();}
 if(T.closest('[data-keepvoc]')){
  const all=(DB.briefing?.docs||[]).flatMap(d=>d.vocab||[]);
  const fresh=all.filter((v,i)=>all.findIndex(x=>x.word.toLowerCase()===v.word.toLowerCase())===i
    &&!K.vocabulary.some(x=>String(x.word).toLowerCase()===v.word.toLowerCase()));
  let n=0;
  fresh.forEach((v,i)=>{
   if(!state.pickVocab.has(i))return;
   K.vocabulary.push({id:uid('vocab'),word:v.word,language:'en',meaning:v.meaning,
    contextualMeaning:v.meaning,partOfSpeech:'',pronunciation:'',exampleSentence:'',userExample:'',
    tags:['briefing'],sourceDocumentId:null,sourceHighlightId:null,
    sourceSentence:v.section?`From the ${v.section} section of today's feed.`:"From today's feed.",
    difficulty:0,reviewStatus:'new',interval:0,ease:2.5,reps:0,lapses:0,stage:0,
    nextReviewAt:dayjs(1),createdAt:now(),updatedAt:now(),origin:'assisted'});n++;});
  state.pickVocab.clear();knownCache={id:null,n:-1,count:0};
  save('pkos:knowledge');render();return toast(`Added ${n} words`);}
 if(T.closest('[data-data]')){state.panel={type:'data'};return paintPanel();}
 if(T.closest('[data-export]')){await exportAll();return toast('Backup downloaded');}
 if(T.closest('[data-readset]')){state.panel={type:'readset'};return paintPanel();}
 const rd=T.closest('[data-read]');
 if(rd){DB.prefs.read=Math.max(13,Math.min(34,(DB.prefs.read||19)+(rd.dataset.read==='+'?1:-1)));
  applyPrefs();store.set('pkos:prefs',DB.prefs);paintPanel();return;}
 const ft=T.closest('[data-font]');
 if(ft){DB.prefs.font=ft.dataset.font;applyPrefs();store.set('pkos:prefs',DB.prefs);return paintPanel();}
 const wd=T.closest('[data-width]');
 if(wd){DB.prefs.width=wd.dataset.width;applyPrefs();store.set('pkos:prefs',DB.prefs);
  if(state.view==='reader')requestAnimationFrame(renderMargins);return paintPanel();}
 const lh=T.closest('[data-lh]');
 if(lh){DB.prefs.lh=Number(lh.dataset.lh);applyPrefs();store.set('pkos:prefs',DB.prefs);
  if(state.view==='reader')requestAnimationFrame(renderMargins);return paintPanel();}

 const ed=T.closest('[data-editdoc]');
 if(ed){const m=meta(ed.dataset.editdoc);await loadDoc(m.id);
  state.confirmDel=null;state.panel={type:'docedit',item:m};return paintPanel();}
 const ds=T.closest('[data-docsave]');
 if(ds){
  const m=meta(ds.dataset.docsave),prev=(docCache[m.id]||{}).content||'';
  const next=$('dcontent').value;
  m.title=$('dtitle').value.trim()||m.title;
  m.author=$('dauthor').value.trim();m.domain=$('ddomain').value;m.updatedAt=now();
  let msg='Saved';
  if(next!==prev){
   const r=reanchor(m.id,next);
   m.chars=next.length;m.language=isKo(next.slice(0,400))?'ko':'en';
   docCache[m.id]={id:m.id,content:next};await store.set('pkos:doc:'+m.id,docCache[m.id]);
   msg=`Saved · ${r.moved} re-attached${r.lost?`, ${r.lost} lost their place`:''}`;}
  save('pkos:index','pkos:knowledge');state.panel=null;lastReaderDoc=null;render();return toast(msg);}
 const dd=T.closest('[data-docdel]');
 if(dd){const id=dd.dataset.docdel;
  if(state.confirmDel!==id){state.confirmDel=id;return paintPanel();}
  const gone=new Set(K.highlights.filter(h=>h.documentId===id).map(h=>h.id));
  DB.index.docs=DB.index.docs.filter(d=>d.id!==id);
  K.highlights=K.highlights.filter(h=>h.documentId!==id);
  // words and memos survive their document, but must not keep pointing at it
  ['vocabulary','concepts','thoughts','questions'].forEach(k=>K[k].forEach(o=>{
   if(o.sourceDocumentId===id)o.sourceDocumentId=null;
   if(gone.has(o.sourceHighlightId))o.sourceHighlightId=null;}));
  delete docCache[id];knownCache={id:null,n:-1,count:0};
  try{localStorage.removeItem('pkos:doc:'+id);}catch(e){}
  save('pkos:index','pkos:knowledge');
  state.confirmDel=null;state.panel=null;return go('library');}

 const it=T.closest('[data-item]');
 if(it){const[k,id]=it.dataset.item.split(':');const o=K[k].find(x=>x.id===id);
  if(o)state.panel=k==='highlights'?{type:'hl',item:o}:{type:'detail',kind:k,item:o};
  if(window.innerWidth<=1120)$panel.classList.add('open');
  return paintPanel();}
 const hl=T.closest('[data-hl]');
 if(hl){const h=K.highlights.find(x=>x.id===hl.dataset.hl);if(!h)return;
  document.querySelectorAll('mark.hl.on').forEach(m=>m.classList.remove('on'));
  const mk=document.querySelector(`mark[data-hl="${h.id}"]`);if(mk)mk.classList.add('on');
  state.panel={type:'hl',item:h};
  if(window.innerWidth<=1120)$panel.classList.add('open');
  return paintPanel();}
 const kd=T.closest('[data-kind]');
 if(kd){const[id,k]=kd.dataset.kind.split(':');const h=K.highlights.find(x=>x.id===id);
  h.kind=k;h.updatedAt=now();save('pkos:knowledge');
  if(state.view==='reader')await viewReader();return paintPanel();}
 const sn=T.closest('[data-savenote]');
 if(sn){const h=K.highlights.find(x=>x.id===sn.dataset.savenote);
  h.note=($('hlnote')?.value||'').trim();h.updatedAt=now();save('pkos:knowledge');
  if(state.view==='reader')await viewReader();paintPanel();return toast('Note saved');}

 const mk=T.closest('[data-memokind]');
 if(mk){state.panel.memoKind=mk.dataset.memokind;
  state.panel.body=$('memobody')?.value||'';return paintPanel();}
 if(T.closest('[data-memo]')){
  state.panel={type:'memo',ctx:state.panel.ctx,memoKind:'thought'};return paintPanel();}
 if(T.closest('[data-memosave]')){
  const p=state.panel,body=($('memobody')?.value||'').trim();
  if(!body)return toast('Nothing to save');
  const h=p.hl||addHL(p.ctx,'memo');
  const base={id:uid('memo'),sourceDocumentId:p.ctx.documentId,sourceSentence:p.ctx.sentence,
   sourceParagraph:p.ctx.paragraph,sourceHighlightId:h.id,body,createdAt:now(),updatedAt:now(),origin:'user'};
  if(p.memoKind==='thought')K.thoughts.push(base);
  else K.questions.push({...base,status:p.memoKind==='check'?'Investigating':'Unanswered',answer:''});
  h.note=body.slice(0,140);h.kind='memo';h.updatedAt=now();
  save('pkos:knowledge');state.panel=null;
  if(state.view==='reader')await viewReader();
  render();return toast('Memo saved');}

 const ex=T.closest('[data-explain]');
 if(ex){const p=state.panel;return act2(ex.dataset.explain,p.ctx);}
 if(T.closest('[data-retry]')){const p=state.panel;return act('word',p.ctx,p.mode==='term');}
 if(T.closest('[data-diag]')){
  $panel.innerHTML=shell('Diagnostics','<div class="card"><span class="spin"></span>Checking…</div>');
  let out;
  try{const r=await fetch('/api/lookup');out={status:r.status,config:await r.json().catch(()=>'(not JSON)')};}
  catch(err){out={error:err.message};}
  if(out.status===200){try{const r2=await fetch('/api/lookup?probe=1');out.probe=await r2.json().catch(()=>'(not JSON)');}
   catch(err){out.probe={error:err.message};}}
  const hint=out.status!==200
   ?(out.status===404?'/api/lookup is not there. The api folder did not upload.':'Could not reach the server function.')
   :out.config?.geminiKey!=='set'?'GEMINI_API_KEY is missing. Vercel → Settings → Environment Variables, then Redeploy.'
   :out.probe?.ok?'A real lookup succeeded. Try the word again.'
   :'The key works but the model call failed. The error under "probe" says why.';
  state.panel={type:'diag',out,hint};return paintPanel();}

 if(T.closest('[data-test]')){
  const s=buildSession();
  state.testQueue=s.length?s:[...K.vocabulary].filter(v=>!v.suspended).sort(()=>Math.random()-.5).slice(0,20);
  state.testing=true;state.sessionDone=0;nextCard();return render();}
 const pk=T.closest('[data-pick]');if(pk){state.picked=+pk.dataset.pick;return render();}
 if(T.closest('[data-check]')){
  const v=state.testQueue[0];
  state.clozeOk=($('clozein')?.value||'').trim().toLowerCase()===String(v.word).trim().toLowerCase();
  return render();}
 if(T.closest('[data-showans]')){state.clozeOk=false;return render();}
 const tg=T.closest('[data-tgrade]');if(tg)return gradeWord(+tg.dataset.tgrade);
 const gr=T.closest('[data-grade]');if(gr)return gradeConcept(+gr.dataset.grade);
 if(T.closest('[data-reveal]')){state.revealed=true;return render();}

 const cm=T.closest('[data-commit]');
 if(cm){const kind=cm.dataset.commit,body=($('cbody')?.value||'').trim(),name=($('cname')?.value||'').trim();
  const c=state.panel.ctx||{};
  if(kind==='concept'&&!name)return toast('Name required');
  if(kind!=='concept'&&!body)return toast('Nothing to save');
  const base={id:uid(kind),sourceDocumentId:c.documentId||null,sourceSentence:c.sentence||'',
   sourceHighlightId:c.id||null,createdAt:now(),updatedAt:now(),origin:'user'};
  if(kind==='concept')K.concepts.push({...base,name,definition:body,interval:0,nextReviewAt:dayjs(2)});
  if(kind==='thought')K.thoughts.push({...base,body});
  if(kind==='question')K.questions.push({...base,body,status:'Unanswered',answer:''});
  save('pkos:knowledge');state.panel=null;render();return toast('Saved');}
 const ut=T.closest('[data-untag]');
 if(ut){const[k,id,tag]=ut.dataset.untag.split(':');const o=K[k].find(x=>x.id===id);
  o.tags=(o.tags||[]).filter(x=>x!==tag);save('pkos:knowledge');return paintPanel();}
 const dl=T.closest('[data-del]');
 if(dl){const[k,id]=dl.dataset.del.split(':');K[k]=K[k].filter(x=>x.id!==id);
  save('pkos:knowledge');state.panel=null;
  if(state.view==='reader')await viewReader();
  toast('Deleted');return render();}
 if(T.closest('[data-close]')){state.panel=null;return paintPanel();}
 if(T.closest('#addbtn'))return addDoc($('ntitle').value,$('nauthor').value,$('paste').value,$('ndomain').value);
 if(!T.closest('.callout')&&!T.closest('.actionbar'))killCo();
 }catch(err){console.error(err);toast('Error: '+(err.message||err));}
});
async function act2(mode,ctx){
 const key=hash(mode+'|'+ctx.text+'|'+ctx.sentence);
 state.panel={type:'result',mode,ctx,loading:true};paintPanel();
 try{const{data}=await llm(mode,ctx.text,ctx.sentence,ctx.lang,key);
  state.panel={type:'result',mode,ctx,data};}
 catch(e){state.panel={type:'result',mode,ctx,error:e.message};}
 paintPanel();
}
document.addEventListener('keydown',e=>{
 if(e.target.id==='clozein'&&e.key==='Enter'){
  const v=state.testQueue[0];
  state.clozeOk=e.target.value.trim().toLowerCase()===String(v.word).trim().toLowerCase();
  return render();}
 const ti=e.target.closest?.('[data-tagfor]');
 if(ti&&e.key==='Enter'){
  const[k,id]=ti.dataset.tagfor.split(':');const o=K[k].find(x=>x.id===id);
  const v=ti.value.trim().toLowerCase();
  if(v&&!(o.tags||[]).includes(v)){o.tags=[...(o.tags||[]),v];save('pkos:knowledge');paintPanel();}
  return;}
 if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('q').focus();}
 if(e.key==='Escape'){killCo();if(state.panel){state.panel=null;paintPanel();}}
});
document.addEventListener('change',e=>{
 if(e.target.id==='readnum'){
  DB.prefs.read=Math.max(13,Math.min(34,+e.target.value||19));applyPrefs();store.set('pkos:prefs',DB.prefs);return;}
 if(e.target.id==='newnum'){
  DB.prefs.newPerDay=Math.max(1,Math.min(60,+e.target.value||10));store.set('pkos:prefs',DB.prefs);return;}
 if(e.target.id==='importfile'){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{const res=await importAll(r.result);
    render();toast(`Imported ${res.docs} documents, ${res.items} items`);}
   catch(err){toast('Import failed: '+err.message);}};
  r.readAsText(f);return;}
 if(e.target.id!=='file')return;
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>addDoc(f.name.replace(/\.(txt|md|markdown)$/i,''),'Upload',r.result,DOMAINS[0]);
 r.readAsText(f);
});
let qt=null;
document.getElementById('q').addEventListener('input',e=>{
 clearTimeout(qt);const v=e.target.value.trim();
 qt=setTimeout(()=>{state.query=v;$main.scrollTop=0;render();},220);
});
function toast(msg){
 document.querySelectorAll('.toast').forEach(t=>t.remove());
 const el=document.createElement('div');el.className='toast';el.textContent=msg;
 document.body.appendChild(el);setTimeout(()=>el.remove(),1800);
}
</script>
