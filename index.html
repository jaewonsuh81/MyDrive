<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>MyDrive</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyDrive">
<!-- PDF text/page extraction. Runs entirely in the browser — no server route,
     no per-page API cost. Pinned version so a library update never silently
     changes extraction behavior underfoot. As of 4.x, pdf.js only ships ES
     module builds (.mjs) — importing it here and hanging it on window makes
     it usable from the plain classic script below, same as before. -->
<script type="module">
 import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs';
 window.pdfjsLib=pdfjsLib;
</script>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"AppleMyungjo","Nanum Myeongjo",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --blue:#007AFF; --blue-press:#0066D6;
  --label:#1D1D1F; --label2:#6E6E73; --label3:#8E8E93; --label4:#B0B0B5;
  --window:#F5F5F7; --content:#FFFFFF; --elevated:#FFFFFF;
  --reading-ink:#1D1D1F;
  --fill1:rgba(116,116,128,.16); --fill2:rgba(116,116,128,.10); --fill3:rgba(116,116,128,.06);
  --sep:rgba(60,60,67,.14); --sep-strong:rgba(60,60,67,.24);
  --glass:rgba(246,246,248,.72);
  --shadow-s:0 1px 2px rgba(0,0,0,.05);
  --shadow-m:0 4px 16px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --shadow-l:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --r1:8px; --r2:12px; --r3:16px; --r4:22px;
  --ease:cubic-bezier(.32,.72,0,1);
  --hl-mark:#FFF1A8; --hl-word:#FFD9B8; --memo-line:#B58A3C;
  --mark-ink:#5C4A12; --word-ink:#6B4519;
}
[data-theme="dark"]{
  --label:#F5F5F7; --label2:#98989D; --label3:#8E8E93; --label4:#5A5A5F;
  --window:#161618; --content:#1C1C1E; --elevated:#242426; --reading-ink:#D8D8DD;
  --blue:#0A84FF; --blue-press:#3D9BFF;
  --fill1:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24); --fill3:rgba(120,120,128,.14);
  --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.18);
  --glass:rgba(30,30,32,.72);
  --shadow-m:0 4px 16px rgba(0,0,0,.4); --shadow-l:0 16px 48px rgba(0,0,0,.55);
  --hl-mark:#5C4E18; --hl-word:#5E3D1E; --memo-line:#C9A14E;
  --mark-ink:#F0E6CB; --word-ink:#F0DCC6;
}
@media (prefers-color-scheme:dark){[data-theme="auto"]{
  --label:#F5F5F7; --label2:#98989D; --label3:#8E8E93; --label4:#5A5A5F;
  --window:#161618; --content:#1C1C1E; --elevated:#242426; --reading-ink:#D8D8DD;
  --blue:#0A84FF; --blue-press:#3D9BFF;
  --fill1:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24); --fill3:rgba(120,120,128,.14);
  --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.18);
  --glass:rgba(30,30,32,.72);
  --shadow-m:0 4px 16px rgba(0,0,0,.4); --shadow-l:0 16px 48px rgba(0,0,0,.55);
  --hl-mark:#5C4E18; --hl-word:#5E3D1E; --memo-line:#C9A14E;
  --mark-ink:#F0E6CB; --word-ink:#F0DCC6;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--window);color:var(--label);font-family:var(--ui);font-size:14px;
  line-height:1.47;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 35%,transparent);border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--fill1);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:222px minmax(0,1fr) 360px;height:100dvh;overflow:hidden}
.app.nopanel{grid-template-columns:222px minmax(0,1fr)}
.app.nopanel>.panel{display:none}
.sidebar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-right:1px solid var(--sep);display:flex;flex-direction:column;padding:14px 12px 12px;overflow:auto}
.mark{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:16px}
.mark .glyph{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,var(--blue),color-mix(in srgb,var(--blue) 55%,#5E5CE6));
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:640;box-shadow:var(--shadow-s)}
.mark b{font-size:15px;font-weight:600;letter-spacing:-.018em}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r1);
  transition:background .12s;font-size:13.5px;font-weight:450}
.navbtn svg{width:17px;height:17px;flex:none;color:var(--label2)}
.navbtn .n{margin-left:auto;font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums}
.navbtn:hover{background:var(--fill3)}
.navbtn[aria-current="true"]{background:var(--fill2);font-weight:510}
.navbtn[aria-current="true"] svg{color:var(--blue)}
.usage{margin-top:auto;background:var(--fill3);border-radius:var(--r2);padding:10px 12px;font-size:12px;color:var(--label2)}
.usage .u{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;gap:8px}
.usage .u span,.usage .u b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.usage b{font-weight:590;color:var(--label);font-variant-numeric:tabular-nums;font-size:13px}
.themetog{display:flex;gap:2px;margin-top:9px;background:var(--fill2);border-radius:8px;padding:2px}
.themetog button{flex:1;padding:4px 0;border-radius:6px;font-size:11px;color:var(--label2);transition:.16s var(--ease)}
.themetog button[aria-current="true"]{background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s);font-weight:510}

.main{background:var(--content);overflow:auto;position:relative}
.toolbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:50px;padding:0 20px;
  background:color-mix(in srgb,var(--content) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.toolbar.scrolled{border-bottom-color:var(--sep)}
.tbtitle{font-size:14px;font-weight:590;opacity:0;transform:translateY(3px);transition:.22s var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.toolbar.scrolled .tbtitle{opacity:1;transform:none}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:6px;background:var(--fill3);border:1px solid transparent;border-radius:var(--r1);
  padding:5px 9px;width:190px;transition:.18s var(--ease)}
.field:focus-within{background:var(--elevated);border-color:var(--sep-strong);width:252px;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent)}
.field svg{width:14px;height:14px;color:var(--label3);flex:none}
.field input{border:none;background:none;outline:none;width:100%;font-size:13px}
.iconbtn{width:30px;height:30px;border-radius:var(--r1);display:grid;place-items:center;color:var(--label2);transition:.12s}
.iconbtn:hover{background:var(--fill3);color:var(--label)}
.iconbtn[aria-current="true"]{background:var(--fill2);color:var(--blue)}
.iconbtn svg{width:17px;height:17px}

.view{padding:6px 22px 140px;max-width:920px}
.largetitle{display:flex;align-items:baseline;gap:10px;padding:14px 0 18px}
.largetitle h1{font-size:31px;font-weight:640;letter-spacing:-.024em;line-height:1.1;margin:0}
.largetitle .c{font-size:16px;color:var(--label3);font-variant-numeric:tabular-nums}

.btn{border-radius:var(--r1);padding:6px 14px;font-size:13.5px;font-weight:510;background:var(--blue);color:#fff;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--blue-press)} .btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill2);color:var(--label)} .btn.sec:hover{background:var(--fill1)}
.btn.plain{background:none;color:var(--blue);padding:6px 8px} .btn.plain:hover{background:var(--fill3)}
.btn.danger{background:none;color:#FF3B30;padding:5px 9px;font-size:12.5px}
.btn.danger:hover{background:color-mix(in srgb,#FF3B30 10%,transparent)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.tin{background:var(--elevated);border:1px solid var(--sep-strong);border-radius:var(--r1);padding:7px 10px;font-size:13.5px;min-width:0;transition:.15s}
.tin:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--blue) 22%,transparent);outline:none}
.numin{width:60px;text-align:center;padding:6px;border-radius:var(--r1);border:1px solid var(--sep-strong);
  background:var(--elevated);font-size:13.5px;font-variant-numeric:tabular-nums;outline:none}
.numin:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.seg{display:inline-flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin:0 0 16px;flex-wrap:wrap}
.seg button{padding:5px 13px;border-radius:7px;font-size:13px;color:var(--label2);transition:.18s var(--ease)}
.seg button[aria-current="true"]{background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s);font-weight:510}
.seg .n{font-variant-numeric:tabular-nums;opacity:.55;margin-left:4px;font-size:12px}
.seg.tight{margin:0}
.labelrow{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:99px;
  background:var(--fill3);border:1px solid transparent;color:var(--label2);transition:.14s}
.lchip:hover{background:var(--fill2)}
.lchip[aria-current="true"]{border-color:var(--sep-strong);background:var(--elevated);color:var(--label);box-shadow:var(--shadow-s)}
.lchip .n{font-variant-numeric:tabular-nums;opacity:.5;font-size:11.5px}

.list{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);overflow:hidden}
.row,.item{position:relative;width:100%;text-align:left;transition:background .1s}
.row{display:flex;align-items:center;gap:13px;padding:12px 14px;cursor:pointer}
.rowmenu{flex:none;width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;color:var(--label3);letter-spacing:1px}
.rowmenu:hover,.rowmenu:active{background:var(--fill3);color:var(--label)}
.item{display:block;padding:13px 14px}
.row+.row::before,.item+.item::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--sep)}
@media (min-resolution:2dppx){.row+.row::before,.item+.item::before{height:.5px}}
.row:hover,.item:hover{background:var(--fill3)}
.row .cover{width:36px;height:47px;border-radius:4px;flex:none;background:linear-gradient(150deg,var(--fill2),var(--fill1));
  display:grid;place-items:center;font-family:var(--serif);font-size:16px;color:var(--label2);box-shadow:var(--shadow-s)}
.row .txt{min-width:0;flex:1}
.row h3,.item h4{font-size:14.5px;font-weight:530;letter-spacing:-.01em;margin:0 0 2px}
.row h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pct{font-size:12px;color:var(--label3);font-variant-numeric:tabular-nums;flex:none}
.row .bar{width:42px;height:3px;border-radius:99px;background:var(--fill1);overflow:hidden;flex:none}
.row .bar i{display:block;height:100%;background:var(--blue)}
.chev{color:var(--label4);flex:none} .chev svg{width:13px;height:13px}
.item .b{font-size:13px;color:var(--label2);line-height:1.45;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--label3);margin-top:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.feed{max-height:210px;overflow:hidden;position:relative;font-family:var(--serif);
  font-size:15px;line-height:1.62;color:var(--label);
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.feed.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.feed p{margin:0 0 .85em}
.feed .fh{font-family:var(--ui);font-size:12px;font-weight:610;color:var(--label3);
  margin:16px 0 6px;letter-spacing:.01em}
.feed .fh:first-child{margin-top:0}
.feed .fhr{border:none;border-top:1px solid var(--sep);margin:14px 0}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--sep-strong);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px;transition:.14s var(--ease)}
.tick.on{background:var(--blue);border-color:var(--blue)}
.empty{border:1px dashed var(--sep-strong);border-radius:var(--r2);padding:24px;color:var(--label3);font-size:13.5px;text-align:center}
.view.dragover{outline:2px dashed var(--blue);outline-offset:-2px;background:color-mix(in srgb,var(--blue) 4%,var(--window))}
#paste{width:100%;min-height:84px;resize:vertical;background:var(--content);border:1px solid var(--sep-strong);
  border-radius:var(--r1);padding:10px;font-size:13.5px;line-height:1.55;outline:none}
.flexrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
h3.sec{font-size:16.5px;font-weight:600;letter-spacing:-.015em;margin:24px 0 9px}

/* ---------------- reader ---------------- */
.reader{max-width:none;padding:0 0 44vh}
.rhead{max-width:var(--rw,40em);margin:14px auto 22px;padding:0 14px}
.rtools{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rtools .spacer{flex:1}
.rhead h1{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.17;letter-spacing:-.015em;margin:10px 0 8px}
.rhead .meta{font-size:12.5px;color:var(--label2)}
.readwrap{display:flex;justify-content:center;gap:22px;position:relative;padding:0 14px}
.gutter{position:relative;flex:0 0 178px}
.readwrap:not(.wide) .gutter{display:none}
.doctext{flex:1 1 auto;min-width:0;font-family:var(--serif);font-size:var(--read,19px);line-height:var(--lh,1.68);
  letter-spacing:-.003em;max-width:var(--rw,40em);color:var(--reading-ink)}
.readfont-sans .doctext,.readfont-sans .rhead h1{font-family:var(--ui);letter-spacing:-.012em}
.readfont-mono .doctext{font-family:var(--mono);font-size:calc(var(--read,19px)*.92)}
.doctext p{margin:0 0 1.3em;white-space:pre-wrap}
.doctext ::selection{background:color-mix(in srgb,var(--blue) 26%,transparent)}
/* Inline formula crop: sits mid-sentence, so it's sized off the current
   line height rather than a fixed pixel height — it stays legible whether
   the reader has bumped the font size up or down. */
.docformula{display:inline-block;vertical-align:-0.15em;max-height:1.7em;width:auto;
  max-width:100%;margin:0 .1em;background:var(--fill1);border-radius:3px;
  -webkit-user-select:none;user-select:none;cursor:zoom-in}
/* A standalone figure/photo breaks the paragraph flow, unlike a formula. */
.docfig{display:block;max-width:100%;height:auto;margin:1.3em auto;border-radius:var(--r2);
  background:var(--fill1);-webkit-user-select:none;user-select:none;cursor:zoom-in}
.figbroken{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;margin:0 .1em;
  font-size:12px;color:var(--label3);background:var(--fill1);border-radius:99px;cursor:default}
.figzoom{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.86);display:flex;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.figzoom img{max-width:100%;max-height:100%;border-radius:var(--r2);box-shadow:var(--shadow-l)}
.doctable{display:block;width:100%;margin:1.3em 0;border-collapse:collapse;font-family:var(--ui);
  font-size:0.78em;line-height:1.4}
.doctable td{border:1px solid var(--sep);padding:5px 8px;text-align:center;white-space:nowrap}
.doctable tr:first-child td{font-weight:590;background:var(--fill1)}

/* ---------------- PDF reader ----------------
   The page is a canvas, drawn exactly as pdf.js rendered it — nothing here
   ever reflows or reorders that. The text layer sits on top, invisible and
   selectable; the highlight layer sits above that, translucent marks
   positioned in the same fractional coordinate space so they track the
   page at any width. */
/* The bar sticks under the toolbar so zoom and Contents stay reachable
   however far into a book you've scrolled. */
.pdfbar{position:sticky;top:50px;z-index:20;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 14px;margin-bottom:10px;background:var(--window);border-bottom:1px solid var(--sep)}
.pdfbar .spacer{flex:1}
.pdfbar .btn[aria-current="true"]{background:var(--blue);color:#fff}
.pdfbar .tin{padding:5px 9px;font-size:12.5px}
.dstats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.dstat{flex:1 1 84px;background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);
  padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dstat b{font-size:21px;font-variant-numeric:tabular-nums;line-height:1.1}
.dstat span{font-size:11.5px;color:var(--label3)}
.epubnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 0;
  max-width:var(--rw,40em);padding:0 14px}
/* A plain-text document keeps its own line breaks (hence pre-wrap on
   .doctext p), but a book's paragraphs are HTML — there the source file's
   pretty-printed newlines are formatting noise, not the author's line
   breaks, and preserving them indents half the lines at random. */
#epubbody p,#epubbody div,#epubbody li,#epubbody td,#epubbody th,#epubbody blockquote{white-space:normal}
#epubbody p{margin:0 0 1em}
#epubbody h1,#epubbody h2,#epubbody h3,#epubbody h4{font-weight:600;line-height:1.25;margin:1.4em 0 .5em}
#epubbody h1{font-size:1.5em} #epubbody h2{font-size:1.3em} #epubbody h3{font-size:1.12em}
#epubbody h4{font-size:1em}
#epubbody img{max-width:100%;height:auto;display:block;margin:1.2em auto;border-radius:var(--r2)}
#epubbody blockquote{margin:1.2em 0;padding-left:16px;border-left:2px solid var(--sep-strong);color:var(--label2)}
#epubbody ul,#epubbody ol{margin:0 0 1em;padding-left:1.4em}
#epubbody li{margin:.3em 0}
#epubbody table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:.85em;font-family:var(--ui)}
#epubbody td,#epubbody th{border:1px solid var(--sep);padding:5px 8px;text-align:left}
#epubbody pre{white-space:pre-wrap;font-family:var(--mono);font-size:.82em;background:var(--fill1);
  padding:10px 12px;border-radius:var(--r1);overflow-x:auto}
#epubbody code{font-family:var(--mono);font-size:.88em}
#epubbody a{color:var(--blue)}
#epubbody [data-epubgo]{cursor:pointer;text-decoration:underline}
.crumbs{align-items:center;margin-bottom:2px}
.crumbsep{color:var(--label3);font-size:13px;padding:0 1px}
.foldtag{display:inline-block;padding:1px 6px;margin-right:2px;border-radius:5px;
  background:var(--fill2);color:var(--label2);font-size:11px;font-weight:510}
.pdfpagenow{font-size:12.5px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pdfscroll{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 8px 40px;
  overflow-x:auto;overscroll-behavior-x:contain}
/* A page keeps its box whether or not its canvas is currently drawn, so
   releasing offscreen pixels never makes the document jump under the scrollbar. */
.pdfpage{position:relative;flex:none;background:#fff;box-shadow:var(--shadow-l);border-radius:3px;
  display:flex;align-items:center;justify-content:center}
.pdfpage canvas{display:block;border-radius:3px}
.pdfpnum{font-size:12px;color:var(--label3)}
.pdftextlayer{position:absolute;inset:0;overflow:hidden;line-height:1;-webkit-user-select:text}
.pdftextlayer span{color:transparent;cursor:text}
.pdftextlayer ::selection{background:color-mix(in srgb,var(--blue) 26%,transparent)}
.pdfhllayer{position:absolute;inset:0;pointer-events:none}
.pdfhlmark{position:absolute;background:var(--hl-mark);border-radius:1px;cursor:pointer;pointer-events:auto;
  mix-blend-mode:multiply}
.pdfhlmark[data-k="word"]{background:var(--hl-word)}
.pdfhlmark[data-k="memo"]{background:none;border-bottom:2px solid var(--memo-line)}

/* three roles, three treatments */
mark.hl{color:inherit;padding:.05em 0;border-radius:2px;cursor:pointer;background:var(--hl-mark);
  transition:filter .12s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hl[data-k="word"]{background:var(--hl-word)}
mark.hl[data-k="memo"]{background:none;padding:0;border-radius:0;
  border-bottom:1px solid var(--memo-line);padding-bottom:.5px}
mark.hl[data-k="memo"]::after{content:attr(data-i);vertical-align:super;font-size:.58em;font-family:var(--ui);
  font-weight:600;color:var(--memo-line);margin-left:1px}
mark.hl[data-k="memo"]:hover{background:color-mix(in srgb,var(--memo-line) 14%,transparent)}
mark.hl:hover{filter:brightness(.96)}
mark.hl.on{box-shadow:0 0 0 2px var(--blue)}
.mnote{position:absolute;width:178px;font-size:12px;line-height:1.45;color:var(--label2);
  border-left:2px solid var(--hl-mark);padding:1px 0 1px 9px;cursor:pointer;transition:color .12s}
.mnote[data-k="word"]{border-left-color:var(--hl-word)}
.mnote[data-k="memo"]{border-left-color:var(--memo-line)}
.mnote:hover{color:var(--label)}
.mnote .t{font-size:10.5px;color:var(--label3);display:block;margin-bottom:2px}

.callout{position:absolute;z-index:60;display:flex;align-items:stretch;
  background:color-mix(in srgb,var(--elevated) 84%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--sep);border-radius:var(--r2);box-shadow:var(--shadow-l);overflow:hidden;
  transform:translate(-50%,-100%);transform-origin:50% 100%;animation:callout .18s var(--ease)}
@keyframes callout{from{opacity:0;transform:translate(-50%,-96%) scale(.94)}}
.callout button{padding:9px 16px;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.callout button:hover{background:var(--fill3)}
.callout .d{width:1px;background:var(--sep);flex:none}
.dot{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.dot.mark{background:var(--hl-mark);border:1px solid rgba(0,0,0,.12)}
.dot.word{background:var(--hl-word);border:1px solid rgba(0,0,0,.12)}
.dot.memo{background:none;border-bottom:2px solid var(--memo-line);border-radius:0;height:6px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;gap:8px;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--elevated) 90%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--sep);box-shadow:0 -6px 24px rgba(0,0,0,.10);animation:barup .24s var(--ease)}
@keyframes barup{from{transform:translateY(100%)}}
.actionbar button{flex:1;padding:11px 6px;border-radius:var(--r1);font-size:14px;background:var(--fill3);
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500}
.actionbar button:active{background:var(--fill2)}

/* ---------------- inspector ---------------- */
.panel{background:var(--window);border-left:1px solid var(--sep);overflow:auto;padding:0 0 60px}
.phead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:50px;padding:0 15px;
  background:color-mix(in srgb,var(--window) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--sep)}
.phead h4{font-size:13.5px;font-weight:590;margin:0}
.pbody{padding:13px 15px}
.card{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:14px;margin-bottom:10px;
  animation:rise .22s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.term{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.018em;line-height:1.15;margin:0 0 3px}
.pos{font-size:12.5px;color:var(--label3);margin-bottom:11px}
.f{margin:10px 0}
.f .k{font-size:11px;font-weight:590;color:var(--label3);margin-bottom:3px}
.f .v{font-size:13.5px;line-height:1.5} .f .v.ko{font-size:14.5px;line-height:1.55}
.quote{border-left:2px solid var(--blue);padding:1px 0 1px 10px;font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--label2)}
.doclink{color:var(--blue);font-weight:510;text-decoration:underline;text-underline-offset:2px}
.doclinkmiss{color:var(--label3);text-decoration:line-through;text-decoration-color:var(--sep-strong)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid var(--sep)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--fill2);color:var(--label2)}
.tg button{color:var(--label3);font-size:13px;line-height:1}
.taginput{border:none;background:var(--fill3);border-radius:99px;padding:4px 10px;font-size:12px;width:100px;outline:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:510;padding:2.5px 8px;border-radius:99px;background:var(--fill2);color:var(--label2)}
.badge.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.badge.due{background:color-mix(in srgb,#FF9500 18%,transparent);color:#C2700A}
[data-theme="dark"] .badge.due{color:#FF9F0A}
.badge.mark{background:var(--hl-mark);color:var(--mark-ink)}
.badge.word{background:var(--hl-word);color:var(--word-ink)}
.badge.memo{background:color-mix(in srgb,var(--memo-line) 20%,transparent);color:var(--memo-line)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0}

.spin{width:13px;height:13px;border:2px solid var(--fill1);border-top-color:var(--blue);border-radius:50%;
  animation:sp .65s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{border-radius:var(--r2);padding:12px;font-size:13px;line-height:1.5;background:color-mix(in srgb,#FF3B30 9%,transparent);color:#C4271D}
[data-theme="dark"] .err{color:#FF6961}

/* ---------------- test ---------------- */
.rv{background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r3);padding:32px 24px;max-width:520px;
  text-align:center;box-shadow:var(--shadow-m)}
.rvterm{font-family:var(--serif);font-size:36px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
.qtype{font-size:11px;font-weight:590;color:var(--label3);margin-bottom:13px}
.qsent{font-family:var(--serif);font-size:19px;line-height:1.62;text-align:left;margin:2px 0 18px}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{padding:12px 14px;border-radius:var(--r1);background:var(--fill3);border:1px solid transparent;
  text-align:left;font-size:14.5px;line-height:1.4;transition:.14s}
.opt:hover:not(:disabled){background:var(--fill2)}
.opt.ok{background:color-mix(in srgb,#34C759 16%,transparent);border-color:#34C759}
.opt.no{background:color-mix(in srgb,#FF3B30 12%,transparent);border-color:#FF3B30}
.cin{width:100%;text-align:center;font-family:var(--serif);font-size:22px;padding:11px;margin-bottom:13px;
  border-radius:var(--r1);border:1px solid var(--sep-strong);background:var(--content);outline:none}
.pbar{height:3px;background:var(--fill1);border-radius:99px;overflow:hidden;margin:0 0 18px;max-width:520px}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s var(--ease)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.grade button{padding:11px 0;border-radius:var(--r1);background:var(--fill2);font-size:13.5px;font-weight:510}
.grade button:hover{background:var(--fill1)}
.grade small{display:block;font-size:10.5px;color:var(--label3);font-weight:400;margin-top:2px}
.stats{display:flex;flex-wrap:wrap;background:var(--elevated);border:1px solid var(--sep);border-radius:var(--r2);padding:17px 4px;margin-bottom:24px}
.stat{flex:1;min-width:80px;text-align:center;padding:0 10px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--sep)}
.stat .v{font-size:26px;font-weight:620;letter-spacing:-.022em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--label2);margin-top:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,0);z-index:99;
  background:color-mix(in srgb,var(--elevated) 86%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--sep);box-shadow:var(--shadow-l);border-radius:99px;padding:9px 18px;font-size:13px;animation:hud .28s var(--ease)}
@keyframes hud{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
.grabber{display:none}

@media (max-width:1120px){
  .app{grid-template-columns:206px minmax(0,1fr)}
  .app.nopanel{grid-template-columns:206px minmax(0,1fr)}
  .panel{position:fixed;inset:auto 0 0 0;max-height:74dvh;border-left:none;border-top:1px solid var(--sep);
    border-radius:var(--r4) var(--r4) 0 0;z-index:50;box-shadow:var(--shadow-l);background:var(--elevated);
    padding-bottom:env(safe-area-inset-bottom);
    transform:translateY(101%);transition:transform .42s var(--ease)}
  .panel.open{transform:translateY(0)}
  .app.nopanel>.panel{display:block}
  .phead{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:none;height:auto;padding:4px 15px 10px}
  .grabber{display:block;width:36px;height:5px;border-radius:99px;background:var(--fill1);margin:8px auto 2px}
  .card{background:var(--content)}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .app.nopanel{grid-template-columns:1fr}
  /* Vertical space is the scarce resource on a phone, and this bar sits
     between the reader and the page — tighten it rather than let it eat
     two full rows' worth of the document. */
  .pdfbar{padding:5px 10px;gap:4px;margin-bottom:6px}
  .pdfbar .tin{width:100%;flex:1 1 120px}
  .pdfbar .spacer{display:none}
  .pdfscroll{padding:0 4px 30px;gap:10px}
  /* Sidebar becomes a slim two-row strip: a horizontally scrolling nav
     pill row, then a thin account/sign-in row underneath. Nothing here
     scrolls out of view — that was the bug (see #nav below). */
  .sidebar{flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 0 0;
    overflow:visible;border-right:none;border-bottom:1px solid var(--sep)}
  .sidebar .mark{display:none}
  /* <nav> itself had no display:flex, so its buttons fell back to normal
     block flow and stacked one-per-line no matter what .sidebar did. */
  #nav{display:flex;padding:2px 4px 4px}
  /* Six items, one row, nothing to scroll: each tab takes an equal share of
     the width (icon over a small label, like a native iOS tab bar) instead
     of a fixed content width — so it can never add up to more than 100%. */
  .navbtn{flex:1;flex-direction:column;justify-content:center;gap:2px;padding:6px 2px 4px;border-radius:10px}
  .navbtn svg{width:21px;height:21px}
  .navbtn .t{font-size:10px;font-weight:510;white-space:normal;text-align:center;line-height:1.15}
  .navbtn .n{display:none}
  /* Keep only the sign-in/account row; storage bar and theme toggle are
     desktop-only conveniences that just crowd out "Sign in" on a phone. */
  .sidebar .usage{margin:0;background:none;border-radius:0;padding:2px 12px calc(6px + env(safe-area-inset-bottom));
    border-top:1px solid var(--sep);font-size:12px}
  .sidebar .usage>*{display:none}
  .sidebar .usage>[data-account]{display:flex;width:auto!important;padding:6px 2px!important}
  .toolbar{padding:0 14px} .field{width:132px} .field:focus-within{width:176px}
  .view{padding:4px 16px 140px} .largetitle h1{font-size:27px}
  .rhead,.readwrap{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="mark"><span class="glyph">M</span><b>MyDrive</b></div>
    <nav id="nav"></nav>
    <div class="usage" id="usage"></div>
  </aside>
  <main class="main" id="main">
    <div class="toolbar" id="toolbar">
      <button class="btn plain sm" id="tbback" data-nav="library" aria-label="Back to Library" hidden>←</button>
      <span class="tbtitle" id="tbtitle"></span><span class="spacer"></span>
      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Search" autocomplete="off" spellcheck="false">
      </label>
      <button class="iconbtn" id="panelbtn" title="Details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
      </button>
    </div>
    <div id="view"></div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>

<script>
/* =========================================================================
   MyDrive — prototype v0.5

   Three things can happen to a piece of text, and they are different in kind:
     word      an unknown word -> looked up, stored with its paragraph
     memo      something I thought, doubted, or want to check later
     highlight this sentence matters -> a personal mark, no database entry
   Everything in the reader follows from that split.
   ========================================================================= */
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isKo=s=>/[\uAC00-\uD7A3]/.test(s);
/* Postgres cannot hold a NUL byte, and old ebook text is full of stray control
   characters. Cleaning on the way in keeps the text readable and stops the
   server rejecting an entire upload over one invisible character. */
function cleanText(t){
 return String(t||'')
  .replace(/\u0000/g,'')
  .replace(/\r\n?/g,'\n')
  .replace(/[\u0001-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'')
  .replace(/\uFEFF/g,'');
}
const dayjs=n=>new Date(Date.now()+n*864e5).toISOString();

const ICON={
 library:'<path d="M4 5.5A1.5 1.5 0 015.5 4H9v16H5.5A1.5 1.5 0 014 18.5z"/><path d="M9 4h4.5A1.5 1.5 0 0115 5.5v13a1.5 1.5 0 01-1.5 1.5H9z"/><path d="M16.4 5.6l2.2.6a1.5 1.5 0 011 1.9l-3 11.2"/>',
 words:'<path d="M4 18.5L9.6 5h1.8L17 18.5"/><path d="M6.4 14h8.2"/><path d="M19.5 18.5V9"/>',
 knowledge:'<path d="M12 3.5c-3.6 0-6.5 2.7-6.5 6 0 2 1 3.4 2 4.4.7.8 1 1.5 1 2.4v.7h7v-.7c0-.9.3-1.6 1-2.4 1-1 2-2.4 2-4.4 0-3.3-2.9-6-6.5-6z"/><path d="M9.5 20.5h5"/>',
 review:'<path d="M3.5 12a8.5 8.5 0 108.5-8.5c-2.6 0-4.9 1.2-6.4 3"/><path d="M3.6 3.9v3.8h3.8"/><path d="M12 7.8V12l2.8 1.8"/>',
 today:'<path d="M4 19V9"/><path d="M9.3 19V5"/><path d="M14.7 19v-7"/><path d="M20 19v-11"/>',
 write:'<path d="M4.5 19.5l4.2-1 9-9a2 2 0 00-2.8-2.8l-9 9z"/><path d="M13.6 5.9l2.8 2.8"/><path d="M4 21h16"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>'};
const svg=(n,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* ---------- storage: sandbox store, then localStorage, then memory ---------- */
/* Browser storage is finite and fails loudly only if you let it: a swallowed
   QuotaExceededError means the app keeps reporting "Saved" while nothing is
   written. Failures are surfaced, and pending writes flush before unload. */
const mem={};
let storageFull=false,storageWarned=false;
const store={
 async get(k){
  try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value);}catch(e){}
  try{const v=localStorage.getItem(k);
   if(v!=null&&v!=='undefined')return JSON.parse(v);}catch(e){}
  return mem[k]??null;},
 async set(k,v){
  if(v===undefined)return false;          // never write a hole over real data
  mem[k]=v;
  const str=JSON.stringify(v);
  let written=false;
  try{await window.storage.set(k,str);written=true;}catch(e){}
  try{localStorage.setItem(k,str);written=true;storageFull=false;touchMeta(k);}
  catch(e){
   // With a server copy this is a cache miss, not data loss; say so accordingly.
   if(!written&&!storageWarned&&!SB.on){
    storageFull=true;storageWarned=true;
    toast('Storage is full — export a backup and remove a document');
    setTimeout(()=>{storageWarned=false;},60000);}
  }
  if(SB.on){queueRemote(k);written=true;}
  return written;}};

/* Local writes must feel instant, but shipping the whole knowledge blob on
   every highlight would be wasteful and rate-limited. Remote pushes are
   therefore coalesced on a slower timer, and anything that fails stays queued
   for the next attempt instead of disappearing. */
const remoteQueue=new Set();
let remoteTimer=null;
function queueRemote(k){
 remoteQueue.add(k);
 clearTimeout(remoteTimer);
 remoteTimer=setTimeout(pushRemote,3500);
}
async function pushRemote(){
 if(!SB.on||!SB.user||!remoteQueue.size)return;
 const keys=[...remoteQueue];
 for(const k of keys){
  try{
   if(k.startsWith('pkos:doc:')){
    const doc=mem[k]||await store.get(k);
    await sbPushDoc(k.slice(9),doc?.content||'',doc?.figures||[]);
   }else{
    const v=dbValue(k);
    if(v===undefined)continue;
    await sbPushState(k,v);
   }
   remoteQueue.delete(k);
  }catch(e){SB.lastError=e.message;}   // keep it queued and try again later
 }
 if(remoteQueue.size)remoteTimer=setTimeout(pushRemote,15000);
 paintUsage();
}
function storageBytes(){
 try{let n=0;for(const k in localStorage)
  if(k.startsWith('pkos:'))n+=(localStorage.getItem(k)||'').length;return n;}catch(e){return 0;}
}
/* =======================================================================
   Supabase sync.

   The app keeps working exactly as before when signed out: everything lands
   in localStorage. Signing in adds a second destination, so the browser stops
   being the only copy and stops being the size limit.

   Talking to PostgREST and GoTrue directly avoids pulling a bundler into a
   project that deliberately has no build step. The anon key is public by
   design; Row Level Security is what keeps one account out of another's rows.
   ======================================================================= */
const SB={url:null,anon:null,token:null,refresh:null,user:null,on:false,syncing:false,
 lastError:null,configured:null,warning:null};
const SB_KEYS={'pkos:index':'index','pkos:knowledge':'knowledge','pkos:reviewlogs':'reviewlogs',
 'pkos:prefs':'prefs','pkos:stats':'stats'};
const localMeta=()=>{try{return JSON.parse(localStorage.getItem('pkos:meta')||'{}');}catch(e){return {};}};
const touchMeta=k=>{try{const m=localMeta();m[k]=now();localStorage.setItem('pkos:meta',JSON.stringify(m));}catch(e){}};

async function sbInit(){
 try{const r=await fetch('/api/config');const j=await r.json();
  SB.url=j.supabaseUrl;SB.anon=j.supabaseAnonKey;SB.warning=j.warning||null;
  SB.configured=Boolean(j.supabase);}
 catch(e){SB.configured=false;SB.warning='Could not reach /api/config';}
 try{const t=JSON.parse(localStorage.getItem('pkos:session')||'null');
  if(t){SB.token=t.access_token;SB.refresh=t.refresh_token;SB.user=t.user;SB.on=Boolean(SB.url&&SB.anon);}}catch(e){}
}
function sbStore(j){
 SB.token=j.access_token;SB.refresh=j.refresh_token;SB.user=j.user||SB.user;SB.on=true;
 try{localStorage.setItem('pkos:session',JSON.stringify(
  {access_token:SB.token,refresh_token:SB.refresh,user:SB.user}));}catch(e){}
}
function sbClear(){
 SB.token=SB.refresh=SB.user=null;SB.on=false;
 try{localStorage.removeItem('pkos:session');}catch(e){}
}
async function sbAuth(path,body){
 const r=await fetch(`${SB.url}/auth/v1/${path}`,{method:'POST',
  headers:{'Content-Type':'application/json',apikey:SB.anon},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('auth '+r.status));
 return j;
}
async function sbRefreshToken(){
 if(!SB.refresh)return false;
 try{sbStore(await sbAuth('token?grant_type=refresh_token',{refresh_token:SB.refresh}));return true;}
 catch(e){sbClear();return false;}
}
async function sbRest(path,init={},retry=true){
 const r=await fetch(SB.url+'/rest/v1/'+path,{...init,
  headers:{'Content-Type':'application/json',apikey:SB.anon,
   Authorization:'Bearer '+SB.token,...(init.headers||{})}});
 if(r.status===401&&retry&&await sbRefreshToken())return sbRest(path,init,false);
 return r;
}
async function sbSignIn(email,password,create){

/* First contact on a device: take whichever side was written more recently,
   per key. A fresh browser has no local timestamps, so it takes the server. */
async function sbPull(){
 if(!SB.on)return;
 SB.syncing=true;paintUsage();
 try{
  const r=await sbRest('app_state?select=key,value,updated_at');
  if(!r.ok)throw new Error('pull '+r.status);
  const rows=await r.json();
  const meta=localMeta();
  for(const row of rows){
   const localKey=Object.keys(SB_KEYS).find(k=>SB_KEYS[k]===row.key);
   if(!localKey)continue;
   if(localKey==='pkos:index'){
    /* Merged, not replaced — and unconditionally, with no "who's newer"
       check. That check made sense back when a pull could REPLACE the
       whole list; now it can only ever ADD to it, so there's nothing left
       to guard against. The old check was actively harmful here: a fresh
       install seeds a few sample docs and touches this key with a
       right-now timestamp, which made every pull afterward look "older
       than mine" and get skipped — the exact bug behind documents not
       showing up on a newly (re)installed device even after signing in. */
    let changed=false;
    if(!DB.index.deletedIds)DB.index.deletedIds=[];
    // Tombstones merge the same additive way, then get applied: anything
    // deleted on any device stays deleted everywhere, without a delete
    // ever having to overwrite or race an addition.
    if(mergeById(DB.index.deletedIds,row.value?.deletedIds))changed=true;
    const deadIds=new Set(DB.index.deletedIds.map(t=>t.id));
    if(deadIds.size){
     const before=DB.index.docs.length;
     DB.index.docs=DB.index.docs.filter(d=>!deadIds.has(d.id));
     if(DB.index.docs.length!==before)changed=true;
    }
    const byId=new Map(DB.index.docs.map(x=>[x.id,x]));
    for(const sd of (row.value?.docs||[])){
     if(deadIds.has(sd.id))continue;   // deleted here or elsewhere — don't let a pull resurrect it
     const ld=byId.get(sd.id);
     if(!ld){DB.index.docs.push(sd);byId.set(sd.id,sd);changed=true;}
     else if((sd.lastReadAt||'')>(ld.lastReadAt||'')){Object.assign(ld,sd);changed=true;}
    }
    /* Folders travel with the index and merge the same way: added
       additively, removed only by a tombstone, and the more recently renamed
       side wins a name clash. */
    if(!DB.index.folders)DB.index.folders=[];
    if(deadIds.size){
     const before=DB.index.folders.length;
     DB.index.folders=DB.index.folders.filter(f=>!deadIds.has(f.id));
     if(DB.index.folders.length!==before)changed=true;
    }
    const fById=new Map(DB.index.folders.map(f=>[f.id,f]));
    for(const sf of (row.value?.folders||[])){
     if(deadIds.has(sf.id))continue;
     const lf=fById.get(sf.id);
     if(!lf){DB.index.folders.push(sf);fById.set(sf.id,sf);changed=true;}
     else if((sf.updatedAt||'')>(lf.updatedAt||'')){Object.assign(lf,sf);changed=true;}
    }
    if(changed)await store.set('pkos:index',DB.index);
   }
   else if(localKey==='pkos:knowledge'){
    let changed=false;
    KNOWLEDGE_LISTS.forEach(k=>{if(mergeById(K[k],row.value?.[k]))changed=true;});
    if(changed)await store.set('pkos:knowledge',K);
   }
   else if(localKey==='pkos:reviewlogs'){
    if(mergeById(DB.reviewlogs,row.value))await store.set('pkos:reviewlogs',DB.reviewlogs);
   }
   else{
    // Plain settings blobs, not merged collections — "whichever side was
    // touched more recently wins" is still the right rule here.
    const mine=meta[localKey];
    if(mine&&mine>row.updated_at)continue;
    if(localKey==='pkos:prefs')DB.prefs={...DEFAULT_PREFS,...row.value};
    else if(localKey==='pkos:stats')DB.stats=row.value;
    try{localStorage.setItem(localKey,JSON.stringify(row.value));}catch(e){}
   }
  }
  SB.lastError=null;
  knownCache={id:null,n:-1,count:0};
  applyPrefs();
 }catch(e){SB.lastError=e.message;}
 SB.syncing=false;
 render();
}

/* Additive merge used anywhere two copies of the same list (this device vs.
   server, or an imported backup) need combining: whatever isn't already
   present by id gets added, nothing existing is ever removed or replaced.
   Returns how many new entries were added. */
function mergeById(arr,incoming){
 if(!Array.isArray(arr)||!Array.isArray(incoming))return 0;
 const ids=new Set(arr.map(x=>x.id));
 let added=0;
 for(const x of incoming){if(x&&x.id&&!ids.has(x.id)){arr.push(x);ids.add(x.id);added++;}}
 return added;
}

`Running a vision model on a phone is not the same problem as running one in a data centre. The constraint that dominates is not raw arithmetic but memory traffic: every tensor that has to be written out to DRAM and read back costs far more energy than the multiplication that produced it. A design that substantially reduces parameter count can therefore still be slow, because parameters are not what the hardware is struggling with.

This is why depthwise separable convolutions became so widespread. Splitting a standard convolution into a per-channel spatial filter followed by a pointwise projection cuts the arithmetic by roughly an order of magnitude, and the intermediate tensors stay small enough to remain in cache. The saving is real, but it is contingent on the surrounding architecture keeping those tensors resident.

A second observation follows from this. If the expensive step is moving wide activations around, then the network should be wide only where it must be, and narrow everywhere the data has to travel. The bottleneck layer exists for exactly this reason. Expansion happens inside a block, where the tensor never leaves fast memory; the representation that crosses between blocks is deliberately thin.

/* ---------- folders ----------

   for why). A document arrives with its context already fixed — a paper for
   a course stays that course's paper — so having a place to put it is
   genuinely useful. A thought you had while reading it belongs to several
   contexts at once and keeps gaining more, which is the thing a folder
   cannot express.

   two guardrails keep a tree from decaying into "which branch was that in":
   depth is capped, and a folder lists everything beneath it by default, so
   filing something one level too deep never hides it from where you would
   look for it. Search reaches inside document text as well, so a wrong

/* ---------- PDF: native page rendering ----------
   Earlier versions of this tried to flatten a PDF into one plain-text
   string — reconstructing column order, table grids and inline formula
   crops by hand from geometry. Tested against a real two-column paper in
   a real browser, that reconstruction still scrambled reading order on
   anything layout-heavy: no realistic amount of heuristic tuning made it
   trustworthy. So a PDF is no longer read that way at all.

   Instead a PDF document is kept as itself: the original file lives in
   Storage, and the Reader renders each page to a canvas and lays pdf.js's
   own text items on top as an invisible, selectable text layer — exactly
   how Adobe Reader and the browser's built-in PDF viewer work. Reading
   order is never reconstructed because the page is never taken apart:
   whatever order the page is drawn in is the order it's read in.

   The only text this file still extracts is for Search and the "known
   words" count on the Library — and neither cares about word order, only
   which words are present, so it's a single unordered join per page with
   no column/table/gap logic at all. */
function pdfLoadLib(){
 if(!window.pdfjsLib)throw new Error('PDF support did not finish loading — check your connection and try again');

  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs';

async function extractPdfSearchText(file,onProgress){

 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 let text='';
 for(let pageNum=1;pageNum<=pdf.numPages;pageNum++){
  onProgress?.(pageNum,pdf.numPages);
  const page=await pdf.getPage(pageNum);
  const tc=await page.getTextContent();
  text+=tc.items.map(it=>it.str).join(' ')+'\n\n';

}

   vanished is flagged rather than deleted. */
function reanchor(docId,newText){

  if(i<0)i=newText.indexOf(h.selectedText);

  h.start=i;h.end=i+h.selectedText.length;

   result is memoised against the document and the size of the word list. */
let knownCache={id:null,n:-1,count:0};
function knownCount(docId,content){
 if(knownCache.id===docId&&knownCache.n===K.vocabulary.length)return knownCache.count;

 const tokens=new Set(lower.match(/[a-z][a-z'-]*/g)||[]);
 const count=K.vocabulary.filter(v=>{
  const w=String(v.word).toLowerCase();
  return /^[a-z][a-z'-]*$/.test(w)?tokens.has(w):lower.includes(w);}).length;

/* ---------- Reader ----------
   A novel is a megabyte of text. Building that much DOM in one pass locks the
   tab for seconds, and doing it again on every highlight makes the book
   unreadable. So paragraphs are rendered in chunks as the page is scrolled,
   and the reader remembers how much it has already drawn: the cost of turning
   a page no longer depends on the length of the book.

   Offsets stay absolute — every paragraph carries its own data-start — so
   partial rendering does not disturb highlight positions. */
const CHUNK=140;

   replacement character" — the correct code point for exactly this: "an
   object was here") sitting inline in the plain-text content, at a known
   offset. It costs the highlight/search/offset machinery nothing: it's
   just one more character, so nothing about how highlights are stored or
   reanchored has to change. Rendering is the only place that treats it
   specially — everywhere else in the app it's inert. */
const FIG_MARK='\uFFFC';
function figureHTML(f){
 if(f.kind==='table'){
  // No image, no upload — a table needed no interpretation to extract, so
  // it stays real text: still searchable, still selectable, just laid out
  // as a grid instead of flowing prose.
  const rows=(f.grid||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<table class="doctable">${rows}</table>`;
 }
 const cls=f.kind==='figure'?'docfig':'docformula';
 // If the crop never made it (upload hiccup, deleted asset, offline first
 // load) show that plainly instead of a browser's broken-image icon — and
 // tapping a figure that DID load opens it full-size, since a formula
 // crop is often too small on-page to actually read the fine print of.
 return `<img class="${cls}" src="${esc(f.url)}" alt="${f.kind==='figure'?'Figure':'Formula'}" loading="lazy"
  data-zoomfig="${esc(f.url)}"
  onerror="this.outerHTML='<span class=&quot;figbroken ${cls}&quot;>⚠ image unavailable</span>'"${
  f.w&&f.h?` style="aspect-ratio:${f.w}/${f.h}"`:''}>`;

function blockHTML(b){

 // most paragraphs even in a PDF-derived one) have neither — keep that

  let s=from,out2='';
  figs.filter(f=>f.offset>=from&&f.offset<to).sort((a,c)=>a.offset-c.offset).forEach(f=>{
   if(f.offset>s)out2+=esc(b.text.slice(s-b.start,f.offset-b.start));
   out2+=figureHTML(f);s=f.offset+1;});
  if(s<to)out2+=esc(b.text.slice(s-b.start,to-b.start));

   h.kind==='memo'?` data-i="${readerMemo[h.id]}"`:''}>${emit(a,z)}</mark>`;

   to a canvas exactly as pdf.js renders it, with an invisible text layer on
   top built from the same items pdf.js hands back — so selection, Translate,
   Highlight and Memo all work, but nothing about the page's own layout is
   ever reconstructed or reordered.

   be re-sized the way a plain-text document's can. (Reflowing an arbitrary

   trustworthy.) So instead of reflow, the reader borrows what real PDF
   readers do to stay readable without touching the content: continuous
   scrolling, zoom presets including a one-column-wide setting for two-column
   papers, the PDF's own table of contents, and search that
   jumps to a page.

   observer fill in whichever ones are actually on screen. Called again on
   every zoom change and resize — placeholders keep their scroll geometry

function pdfLayoutPages(){

 host.innerHTML='';
 let html='';
 for(let p=1;p<=PDFV.pageCount;p++)
  html+=`<div class="pdfpage" data-page="${p}" style="width:${w}px;height:${h}px"><span class="pdfpnum">${p}</span></div>`;

  entries.forEach(en=>{

async function pdfRenderOne(pageNum){

/* A reference to another document, written into the text of a thought,
   question or piece of writing, and rendered as a tap-to-open chip.

   Two forms are understood, and you never have to type either one — the
   "+ Link a document" button writes them for you:
     [[doc:<id>|Title]]  what the button inserts. Bound to the id, so the
                         link survives renaming the document.
     [[Title]]           the older, hand-written form, still resolved by
                         title so nothing written before this stops working.
   Storing them inline as plain text (rather than as a separate table of
   links) is deliberate: the note stays readable and stays correct in a
   Markdown or JSON export, which is the point of being able to leave. */
function linkifyDocRefs(escapedText){
 return escapedText.replace(/\[\[([^\[\]]{1,200})\]\]/g,(whole,inner)=>{
  const byId=/^doc:([A-Za-z0-9_-]+)(?:@p(\d+))?\|?([\s\S]*)$/.exec(inner.trim());
  if(byId){
   const doc=DB.index.docs.find(d=>d.id===byId[1]);
   const label=(byId[3]||'').trim()||doc?.title||'document';
   if(!doc)return `<span class="doclinkmiss">${label} (deleted)</span>`;
   const page=byId[2]?` p.${byId[2]}`:'';
   return `<button class="doclink" data-open="${doc.id}"${byId[2]?` data-openpage="${byId[2]}"`:''}>${label}${page}</button>`;
  }
  const needle=inner.trim().toLowerCase();
  const doc=DB.index.docs.find(d=>d.title.toLowerCase()===needle)
   ||DB.index.docs.find(d=>d.title.toLowerCase().includes(needle));
  return doc
   ?`<button class="doclink" data-open="${doc.id}">${esc(doc.title)}</button>`
   :`<span class="doclinkmiss">[[${inner}]]</span>`;
 });
}

function linkPickOpen(fieldId){
 const p=state.panel,el=$(fieldId);
 if(!p||!el)return;
 p.draft=el.value;p.caret=el.selectionStart??el.value.length;
 state.panel={type:'linkpick',back:p,field:fieldId,q:''};

function linkPickInsert(ref){
 const p=state.panel,back=p.back;if(!back)return;
 let text='';
 if(ref.startsWith('doc:')){
  const d=meta(ref.slice(4));if(!d)return;
  text=`[[doc:${d.id}|${d.title}]]`;
 }else{
  const c=K.concepts.find(x=>x.id===ref.slice(8));if(!c)return;
  text=`[[${c.name}]]`;
 }
 const draft=back.draft||'',at=Math.min(back.caret??draft.length,draft.length);
 const sep=draft&&!/\s$/.test(draft.slice(0,at))?' ':'';
 back.draft=draft.slice(0,at)+sep+text+draft.slice(at);
 back.caret=at+sep.length+text.length;
 // memoHTML reads p.body, composeHTML reads p.prefillBody — put the draft
 // back wherever the editor that opened the picker will look for it.
 if(back.type==='memo')back.body=back.draft;else back.prefillBody=back.draft;
 state.panel=back;paintPanel();
}

/* Import merges by id and never overwrites, so restoring an old backup on top
   of newer work cannot destroy the newer work. Embedded-image references

async function importAll(text){

/* Recovery net: a document's text lives under its own pkos:doc:<id> key,
   separate from the pkos:index list that says which ids exist. If the list
   ever loses an entry (an interrupted sync, a bug like the one this was
   added for) the text itself is usually still sitting in storage, just
   unlisted. This finds those and re-lists them rather than leaving them
   stranded forever. */
function findOrphanDocs(){
 const known=new Set(DB.index.docs.map(d=>d.id));
 const orphans=[];
 for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);
  if(k&&k.startsWith('pkos:doc:')&&!known.has(k.slice(9)))orphans.push(k.slice(9));
 }
 return orphans;
}
async function recoverOrphanDocs(){
 const orphans=findOrphanDocs();
 if(!orphans.length)return toast('No missing documents found');
 let n=0;
 for(const id of orphans){
  const rec=await store.get('pkos:doc:'+id);
  const content=(rec?.content||'').trim();
  if(!content)continue;
  DB.index.docs.unshift({id,title:content.slice(0,38)+'…',author:'',domain:DOMAINS[3],
   language:isKo(content.slice(0,400))?'ko':'en',chars:content.length,
   progress:0,createdAt:now(),lastReadAt:null});
  cacheDoc(id,{id,content,figures:rec?.figures||[]});n++;
 }
 if(n){save('pkos:index');render();toast(`Recovered ${n} document${n>1?'s':''} — check the titles`);}
 else toast('Found entries but could not read their content');
}

/* ---------- Words: SM-2 scheduling, escalating question types ---------- */
const QTYPES=['choice','recall','cloze','reverse'];
const QLABEL={choice:'Pick the meaning',recall:'What does it mean?',cloze:'Fill the blank',
 reverse:'Say it in English',produce:'Use it in a sentence'};
const QSHORT={choice:'Choice',recall:'Recall',cloze:'Cloze',reverse:'Reverse',produce:'Write'};
const newPerDay=()=>DB.prefs.newPerDay||10;
function clozeOf(v){
 const sent=v.sourceSentence||v.exampleSentence||'';
 if(!sent||!v.word)return null;
 const i=sent.toLowerCase().indexOf(String(v.word).toLowerCase());
 return i<0?null:sent.slice(0,i)+'______'+sent.slice(i+String(v.word).length);
}
function qtypeFor(v){
 let t=QTYPES[Math.min(4,v.stage||0)];
 if(t==='cloze'&&!clozeOf(v))t='recall';
 if(t==='choice'&&K.vocabulary.filter(x=>x.contextualMeaning||x.meaning).length<4)t='recall';
 if(t==='reverse'&&!(v.contextualMeaning||v.meaning))t='recall';
 return t;
}
function choicesFor(v){
 const right=v.contextualMeaning||v.meaning||'';
 const wrong=[...new Set(K.vocabulary.filter(x=>x.id!==v.id&&(x.contextualMeaning||x.meaning))
  .map(x=>x.contextualMeaning||x.meaning).filter(m=>m!==right))];
 return [...wrong.sort(()=>Math.random()-.5).slice(0,3),right]
  .sort(()=>Math.random()-.5).map(t=>({t,ok:t===right}));
}
function rollNew(){const t=new Date().toISOString().slice(0,10);
 if(DB.stats.newDate!==t){DB.stats.newDate=t;DB.stats.newToday=0;save('pkos:stats');}}
function buildSession(){
 rollNew();
 const pool=dueWords();
 // Most-forgotten first: the word closest to being lost is the one worth asking.
 const seen=pool.filter(v=>v.reps>0).sort((a,b)=>retrievability(a)-retrievability(b));
 const room=Math.max(0,newPerDay()-(DB.stats.newToday||0));
 return [...seen,...pool.filter(v=>!v.reps).slice(0,room)];
}
/* Scheduling on a forgetting curve.

   Each word carries a stability S — days until recall is expected to fall to
   90% — and a difficulty D from 1 to 10. Before each answer we estimate how
   much was still remembered, and the interval grows more when a word was
   recalled after it had begun to fade: remembering something you had nearly
   forgotten is worth more than remembering it a minute after seeing it.
   Grades also accumulate into a short history, so accuracy is measured rather
   than guessed at. */
const RETENTION=0.9;
const clmp=(v,a,b)=>Math.max(a,Math.min(b,v));
function retrievability(v){
 if(!v.lastReviewedAt||!v.stability)return 0;
 const days=(Date.now()-new Date(v.lastReviewedAt).getTime())/864e5;
 return Math.exp(Math.log(RETENTION)*days/Math.max(.1,v.stability));
}
const GRADE_BONUS=[.7,1,1.35];          // Hard, Good, Easy
function project(v,g){
 if(!v.reps)return{d:clmp(6-1.2*g,1,10),s:[.5,1,3,6][g]};
 const r=retrievability(v);
 const d=clmp((v.difficulty||5)+.55*(2-g),1,10);
 if(g===0)return{d,s:Math.max(.4,(v.stability||1)*.38*Math.exp(-.08*(d-5)))};
 const S=v.stability||1;
 const f=1+5*((11-d)/10)*Math.pow(S,-.3)*(Math.exp(5*(1-r))-1)*GRADE_BONUS[g-1];
 return{d,s:Math.min(S*Math.max(1.05,f),1200)};
}
function previewDays(v,g){
 if(g===0)return'10m';
 const d=project(v,g).s;
 return d<1?'<1d':d<30?Math.round(d)+'d':d<365?Math.round(d/30)+'mo':(d/365).toFixed(1)+'y';
}
function schedule(v,g){
 rollNew();
 if(!v.reps){DB.stats.newToday=(DB.stats.newToday||0)+1;v.introducedAt=now();}
 const p=project(v,g);
 v.difficulty=p.d;v.stability=p.s;
 v.reps=(v.reps||0)+1;
 v.history=[...(v.history||[]),g].slice(-12);
 if(g===0){
  v.lapses=(v.lapses||0)+1;v.stage=Math.max(0,(v.stage||0)-1);
  v.interval=0;v.nextReviewAt=new Date(Date.now()+6e5).toISOString();
  v.reviewStatus='learning';
  if(v.lapses>=5){v.suspended=true;v.tags=[...new Set([...(v.tags||[]),'leech'])];}
 }else{
  v.interval=Math.max(1,Math.round(p.s));
  v.nextReviewAt=dayjs(v.interval);v.reviewStatus='review';
  if(g>=2)v.stage=Math.min(4,(v.stage||0)+1);
 }
 v.lastReviewedAt=now();v.updatedAt=now();
 DB.reviewlogs.push({id:uid('rl'),itemId:v.id,itemType:'vocabulary',grade:g,
  mode:state.qtype||'recall',intervalAfter:v.interval,at:now()});
 if(DB.reviewlogs.length>3000)DB.reviewlogs.splice(0,DB.reviewlogs.length-3000);
 save('pkos:knowledge','pkos:stats','pkos:reviewlogs');
}

/* ---------- Knowledge ---------- */
/* Knowledge holds what you wrote, not what you marked.
   A highlight is a pointer into a document — it means something where it
   sits, and almost nothing in a list of a thousand of them, so it lives in
   the reader (see dochlHTML) rather than here. A word goes to Words, which
   is already built around reviewing words. What's left is the part that is
   actually yours: concepts you defined, thoughts you had, questions you
   raised.

   The failure mode of a list like this is burial: a note written in March is
   as good as deleted by June, because a reverse-chronological stream only
   ever shows you the newest thing you thought. Four things here work against
   that, and none of them ask you to file anything:
     1. grouping by source, so a list reads as "what I thought while reading
        X" rather than as a timeline;
     2. questions kept as open loops, oldest first — an unanswered question
        gets MORE interesting with age, not less;
     3. backlinks, so reopening a document or concept brings back everything
        you ever wrote near it (see dochlHTML and detailHTML);
     4. resurfacing on Today, which puts whatever has gone longest unseen in
        front of you once a day. */
const QSTATUS=[['Unanswered','Open'],['Investigating','Looking into'],['Answered','Answered']];
function mentionsOf(name){
 const needle=('[['+name).toLowerCase();
 const hit=o=>[o.body,o.corrected,o.note].filter(Boolean).join(' ').toLowerCase().includes(needle);
 return [...K.thoughts.filter(hit),...K.questions.filter(hit),...(K.writings||[]).filter(hit)];
}
function notesFromDoc(docId){
 return [...K.thoughts,...K.questions].filter(o=>o.sourceDocumentId===docId)
  .sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
}
function notesCiting(docId){
 const needle=('[[doc:'+docId).toLowerCase();
 const hit=o=>[o.body,o.corrected,o.note].filter(Boolean).join(' ').toLowerCase().includes(needle);
 return [...K.thoughts.filter(hit),...K.questions.filter(hit),...(K.writings||[]).filter(hit)];
}
const kindOf=o=>o.word?'vocabulary':o.name?'concepts':o.status?'questions':o.prompt!==undefined?'writings':'thoughts';
function knowRow(o,kind){
 const m=o.sourceDocumentId?meta(o.sourceDocumentId):null;
 const title=o.name||(o.prompt?o.prompt.slice(0,70):'')||(o.body?o.body.slice(0,70):'')||'';
 const sub=o.definition||o.answer||o.corrected||o.body||o.sourceSentence||'';
 const age=Math.round((Date.now()-new Date(o.createdAt).getTime())/864e5);
 return `<button class="item" data-item="${kind}:${o.id}">
  <h4>${esc(title)}</h4>${sub&&sub!==title?`<div class="b">${esc(sub)}</div>`:''}
  <div class="m">${(o.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}
   <span>${m?esc(m.title):'Manual'}</span>
   <span>${age<1?'today':age<30?age+'d ago':o.createdAt.slice(0,10)}</span>
   ${(o.status||'')==='Unanswered'?'<span class="badge">open</span>':''}
   ${(o.status||'')==='Investigating'?'<span class="badge">looking into</span>':''}</div></button>`;
}
function viewKnowledge(){
 $tb.textContent='Knowledge';
 const tabs=[['concepts','Concepts',K.concepts.length],['thoughts','Thoughts',K.thoughts.length],
  ['questions','Questions',K.questions.length]];
 if(!['concepts','thoughts','questions'].includes(state.tab))state.tab='concepts';
 const tab=state.tab,isQ=tab==='questions';
 let src=[...(K[tab]||[])],bar='';
 const order=state.kSort||'new';
 const byDate=list=>list.slice().sort((a,b)=>order==='new'
  ?String(b.createdAt).localeCompare(String(a.createdAt))
  :String(a.createdAt).localeCompare(String(b.createdAt)));
 const sortChips=`<div class="seg tight" style="margin-bottom:10px">${[['new','Newest'],['old','Oldest']]
  .map(([k,l])=>`<button data-ksort="${k}" aria-current="${order===k}">${l}</button>`).join('')}</div>`;
 const head=`<div class="largetitle"><h1>Knowledge</h1>
   <button class="btn sec sm" data-nav="review" style="margin-left:auto">Review</button></div>
  <div class="seg">${tabs.map(([k,l,c])=>`<button data-tab="${k}" aria-current="${state.tab===k}">${l}<span class="n">${c}</span></button>`).join('')}</div>`;

 if(isQ){
  const f=state.qFilter||'Unanswered';
  const n=st=>K.questions.filter(q=>(q.status||'Unanswered')===st).length;
  bar=`<div class="labelrow">
   ${QSTATUS.map(([st,l])=>`<button class="lchip" data-qf="${st}" aria-current="${f===st}">${l}<span class="n">${n(st)}</span></button>`).join('')}
   <button class="lchip" data-qf="all" aria-current="${f==='all'}">All<span class="n">${K.questions.length}</span></button></div>`;
  if(f!=='all')src=src.filter(q=>(q.status||'Unanswered')===f);
  src=byDate(src);
  $view.innerHTML=`<div class="view">${head}${bar}${sortChips}
   ${src.length?`<div class="list">${src.map(o=>knowRow(o,tab)).join('')}</div>`:'<div class="empty">Nothing here</div>'}</div>`;
  return;
 }

 /* Thoughts and concepts: the same items, looked at three ways. "By
    document" is the one that actually fights burial — it turns a timeline
    into "everything I thought while reading this", which is how you go
    looking for an old note in the first place. */
 const group=state.kGroup||'recent';
 bar=`<div class="seg tight" style="margin-bottom:10px">${[['recent','All'],['doc','By document'],['tag','By tag']]
  .map(([k,l])=>`<button data-kgroup="${k}" aria-current="${group===k}">${l}</button>`).join('')}</div>`;
 let body='';
 if(group==='recent'){
  const list=byDate(src);
  body=list.length?`<div class="list">${list.map(o=>knowRow(o,tab)).join('')}</div>`:'<div class="empty">Nothing here</div>';
 }else if(group==='doc'){
  const byDoc=new Map();
  src.forEach(o=>{const k=o.sourceDocumentId||'';const a=byDoc.get(k)||[];a.push(o);byDoc.set(k,a);});
  const groups=[...byDoc.entries()].map(([id,items])=>({
   id,title:id?(meta(id)?.title||'(deleted document)'):'Written on their own',
   items:byDate(items),
   last:items.reduce((t,o)=>o.createdAt>t?o.createdAt:t,'')}))
   .sort((a,b)=>b.last.localeCompare(a.last));
  body=groups.length?groups.map(g=>`<h3 class="sec">${esc(g.title)}
    <span style="color:var(--label3);font-size:13px;font-weight:450;margin-left:7px">${g.items.length}</span></h3>
   <div class="list">${g.items.map(o=>knowRow(o,tab)).join('')}</div>`).join(''):'<div class="empty">Nothing here</div>';
 }else{
  const byTag=new Map();
  src.forEach(o=>{const ts=(o.tags||[]).length?o.tags:['—'];
   ts.forEach(t=>{const a=byTag.get(t)||[];a.push(o);byTag.set(t,a);});});
  const groups=[...byTag.entries()].sort((a,b)=>b[1].length-a[1].length);
  body=groups.length?groups.map(([t,items])=>`<h3 class="sec">${t==='—'?'Untagged':esc(t)}
    <span style="color:var(--label3);font-size:13px;font-weight:450;margin-left:7px">${items.length}</span></h3>
   <div class="list">${byDate(items).map(o=>knowRow(o,tab)).join('')}</div>`).join(''):'<div class="empty">Nothing here</div>';
 }
 $view.innerHTML=`<div class="view">${head}${bar}${sortChips}${body}</div>`;
}
/* The replacement for that Marks tab: the same highlights, filtered, but
   inside the document they belong to and with a tap to go back to the spot. */
function dochlHTML(){
 const m=meta(state.docId);
 const all=K.highlights.filter(h=>h.documentId===state.docId&&!h.orphaned);
 const shown=state.hlFilter==='all'?all:all.filter(h=>(h.kind||'mark')===state.hlFilter);
 const chips=`<div class="labelrow">

   <span class="dot ${k}"></span>${KINDLABEL[k]}<span class="n">${all.filter(h=>(h.kind||'mark')===k).length}</span></button>`).join('')}</div>`;
 const rows=[...shown].sort((a,b)=>
   (a.position?.page||0)-(b.position?.page||0)||a.start-b.start)
  .map(h=>{
   const where=h.position?.type==='pdf-rects'?`p.${h.position.page}`
    :h.position?.type==='epub'?`ch.${h.position.chapter+1}`:'';
   return `<button class="item" data-hljump="${h.id}">
    <h4>${esc((h.selectedText||'').slice(0,90))}</h4>
    ${h.note||h.translation?`<div class="b">${esc(h.note||h.translation)}</div>`:''}
    <div class="m"><span class="badge ${h.kind||'mark'}">${KINDLABEL[h.kind||'mark']}</span>
     ${where?`<span>${where}</span>`:''}</div></button>`;}).join('');
 const notes=notesFromDoc(state.docId),citing=notesCiting(state.docId);
 const noteList=(label,list)=>list.length?`<h3 class="sec" style="font-size:13px;color:var(--label3);margin:16px 0 8px">${label} · ${list.length}</h3>
  <div class="list">${list.slice(0,12).map(x=>`<button class="item" data-item="${kindOf(x)}:${x.id}">
   <h4>${esc((x.body||x.prompt||'').slice(0,70))}</h4>
   <div class="m"><span class="badge">${kindOf(x)==='questions'?'question':'thought'}</span>
    <span>${x.createdAt.slice(0,10)}</span></div></button>`).join('')}</div>`:'';
 return shell('In this document',`${chips}
  ${rows?`<div class="list">${rows}</div>`:'<div class="empty">Nothing marked here yet</div>'}
  ${noteList('Thoughts and questions from here',notes)}
  ${noteList('Notes citing this document',citing)}`);
}
/* Going back to a highlight: a PDF scrolls to its page, a text document may
   first have to draw the part of itself that holds it. */
function jumpToHighlight(id){
 const h=K.highlights.find(x=>x.id===id);if(!h)return;
 const m=meta(state.docId);
 if(m?.kind==='epub'&&h.position?.type==='epub'){
  const go2=()=>{const el=document.querySelector(`mark[data-hl="${id}"]`);
   if(el)el.scrollIntoView({block:'center',behavior:'smooth'});};
  if(h.position.chapter!==EPUBV.chapter)epubGoChapter(h.position.chapter).then(()=>setTimeout(go2,120));
  else go2();
  if(window.innerWidth<=1120)$panel.classList.remove('open');
  return;
 }
 if(m?.kind==='pdf'&&h.position?.type==='pdf-rects'){
  pdfScrollToPage(h.position.page,false);
  setTimeout(()=>{
   const el=document.querySelector(`.pdfhlmark[data-hl="${id}"]`);
   if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
  },350);
 }else{
  let guard=0;
  while(guard++<60&&readerShown<readerBlocks.length&&
        readerBlocks[readerShown-1]&&readerBlocks[readerShown-1].start<h.start)growReader(CHUNK);
  const el=document.querySelector(`mark[data-hl="${id}"]`);
  if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
  else toast('Could not find that spot');
 }
 if(window.innerWidth<=1120)$panel.classList.remove('open');
}
/* ---------- Review ----------
   Two different things share this screen because they are the same activity
   at two speeds: the cards come back to single concepts on their own
   schedule, and the weekly/monthly pass looks at everything a period
   produced at once. The write-up from that pass is saved against the period,
   so the reviews themselves accumulate — a year on, 52 short paragraphs
   saying what each week was about is a better way back into 500 notes than
   the 500 notes are. */
function periodRange(mode,offset){
 const now=new Date();
 if(mode==='month'){
  const from=new Date(now.getFullYear(),now.getMonth()+offset,1);
  const to=new Date(now.getFullYear(),now.getMonth()+offset+1,1);
  return{from,to,key:`${from.getFullYear()}-${String(from.getMonth()+1).padStart(2,'0')}`,
   label:from.toLocaleDateString('en-US',{month:'long',year:'numeric'})};
 }
 const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const dow=(d.getDay()+6)%7;                       // weeks run Monday to Sunday
 const from=new Date(d);from.setDate(d.getDate()-dow+offset*7);
 const to=new Date(from);to.setDate(from.getDate()+7);
 const last=new Date(to);last.setDate(to.getDate()-1);
 const fmt=x=>x.toLocaleDateString('en-US',{month:'short',day:'numeric'});
 const week=Math.ceil(((from-new Date(from.getFullYear(),0,1))/864e5+1)/7);
 return{from,to,key:`${from.getFullYear()}-W${String(week).padStart(2,'0')}`,
  label:`${fmt(from)} – ${fmt(last)}`};
}
const inRange=(o,r)=>{const t=new Date(o.createdAt).getTime();return t>=r.from.getTime()&&t<r.to.getTime();};
const digestFor=key=>(K.digests||[]).find(x=>x.period===key);
/* A period that has closed, produced something, and never got written up.
   This is what the badge on Review and the line on Today are counting. */
function pendingReviews(){
 const out=[];
 [['week',-1],['month',-1]].forEach(([mode,off])=>{
  const r=periodRange(mode,off);
  if(digestFor(r.key))return;
  const n=K.thoughts.filter(o=>inRange(o,r)).length+K.questions.filter(o=>inRange(o,r)).length
   +K.vocabulary.filter(o=>inRange(o,r)).length+K.concepts.filter(o=>inRange(o,r)).length;
  if(n)out.push({mode,offset:off,label:r.label,n});
 });
 return out;
}
function viewReview(){
 $tb.textContent='Review';
 const mode=state.reviewMode||'cards';
 const q=dueConcepts();
 const pend=pendingReviews();
 const head=`<div class="largetitle"><h1>Review</h1>${q.length?`<span class="c">${q.length}</span>`:''}</div>
  <div class="seg">${[['cards','Cards'],['week','Weekly'],['month','Monthly']].map(([k,l])=>
   `<button data-rmode="${k}" aria-current="${mode===k}">${l}${
    k!=='cards'&&pend.some(x=>x.mode===k)?'<span class="n">1</span>':''}</button>`).join('')}</div>`;

 if(mode==='cards'){
  if(!q.length)return $view.innerHTML=`<div class="view">${head}<div class="empty">Nothing due</div></div>`;
  const it=q[0];
  $view.innerHTML=`<div class="view">${head}
   <div class="rv"><p class="rvterm">${esc(it.name)}</p>
    ${it.sourceSentence?`<div class="quote" style="text-align:left;margin:16px 0 0">${esc(it.sourceSentence)}</div>`:''}
    ${state.revealed?`<div style="font-family:var(--serif);font-size:18px;line-height:1.5;margin-top:16px">${esc(it.definition||'')}</div>
     <div class="grade">${[['Again','10m'],['Hard','1d'],['Good','3d'],['Easy','7d']].map(([l,x],i)=>
      `<button data-grade="${i}">${l}<small>${x}</small></button>`).join('')}</div>`
     :`<button class="btn sec" data-reveal style="margin-top:18px">Reveal</button>`}</div></div>`;
  return;
 }

 const off=state.digestOffset||0;
 const r=periodRange(mode,off);
 const thoughts=K.thoughts.filter(o=>inRange(o,r));
 const questions=K.questions.filter(o=>inRange(o,r));
 const answered=K.questions.filter(o=>o.answeredAt&&inRange({createdAt:o.answeredAt},r));
 const words=K.vocabulary.filter(o=>inRange(o,r));
 const concepts=K.concepts.filter(o=>inRange(o,r));
 const marks=K.highlights.filter(o=>inRange(o,r));
 const docs=DB.index.docs.filter(d=>(d.lastReadAt&&inRange({createdAt:d.lastReadAt},r))||inRange(d,r));
 const saved=digestFor(r.key);
 const stat=(n,l)=>`<div class="dstat"><b>${n}</b><span>${l}</span></div>`;
 const list=(label,items,render)=>items.length?`<h3 class="sec">${label}
   <span style="color:var(--label3);font-size:13px;font-weight:450;margin-left:7px">${items.length}</span></h3>
  <div class="list">${items.map(render).join('')}</div>`:'';
 $view.innerHTML=`<div class="view">${head}
  <div class="flexrow" style="justify-content:space-between;align-items:center">
   <button class="btn sec sm" data-doff="-1">‹ Earlier</button>
   <b style="font-size:15px">${esc(r.label)}</b>
   <button class="btn sec sm" data-doff="1"${off>=0?' disabled':''}>Later ›</button></div>
  <div class="dstats">
   ${stat(thoughts.length,'thoughts')}${stat(questions.length,'questions')}${stat(answered.length,'answered')}
   ${stat(words.length,'words')}${stat(concepts.length,'concepts')}${stat(marks.length,'marks')}</div>
  <div class="card">
   <textarea class="tin" id="digestbody" style="width:100%;min-height:120px;line-height:1.6"
    placeholder="What did this ${mode} come to?">${esc(saved?.body||'')}</textarea>
   <div class="acts"><button class="btn sm" data-digestsave>${saved?'Update':'Save'}</button>
    ${saved?`<span style="font-size:12px;color:var(--label3)">${saved.updatedAt.slice(0,10)}</span>`:''}</div></div>
  ${list('Documents',docs,d=>docRow(d))}
  ${list('Thoughts',thoughts,o=>knowRow(o,'thoughts'))}
  ${list('Questions',questions,o=>knowRow(o,'questions'))}
  ${list('Concepts',concepts,o=>knowRow(o,'concepts'))}
  ${words.length?`<h3 class="sec">Words
    <span style="color:var(--label3);font-size:13px;font-weight:450;margin-left:7px">${words.length}</span></h3>
   <div class="list">${words.map(v=>`<button class="item" data-item="vocabulary:${v.id}">
    <h4>${esc(v.word)}</h4><div class="b">${esc(v.contextualMeaning||v.meaning||'')}</div></button>`).join('')}</div>`:''}
  ${!(thoughts.length+questions.length+words.length+concepts.length+marks.length)
   ?'<div class="empty">Nothing saved in this period</div>':''}
  ${(K.digests||[]).filter(d=>d.mode===mode).length?`<h3 class="sec">Past</h3>
   <div class="list">${[...K.digests].filter(d=>d.mode===mode).reverse().slice(0,12).map(d=>
    `<button class="item" data-digestgo="${esc(d.period)}"><h4>${esc(d.label||d.period)}</h4>
     <div class="b">${esc((d.body||'').slice(0,90))}</div></button>`).join('')}</div>`:''}
  </div>`;
}
function gradeConcept(g){
 const it=dueConcepts()[0];if(!it)return;
 const base=it.interval||1;
 it.interval=g===0?.02:Math.max(1,Math.round(base*[0,1.2,2.5,4][g]));
 it.nextReviewAt=dayjs(it.interval);it.updatedAt=now();
 save('pkos:knowledge');state.revealed=false;render();
}
/* ---------- Today ----------
   The daily order of work, top to bottom: read the briefing, choose which of
   today's sections are worth keeping, take the words it already defines, sit
   the word test, then carry on with whatever was left unfinished.

   Nothing from the feed is stored unless it is ticked. That is deliberate: a
   daily feed grows without limit and most of it is read once.
   -------------------------------------------------------------------------- */
async function loadBriefing(force){
 const today=new Date().toISOString().slice(0,10);
 if(!force&&DB.briefing&&DB.briefing.fetchedFor===today)return;
 state.briefLoading=true;render();
 try{const r=await fetch('/api/briefing');DB.briefing={...await r.json(),fetchedFor:today};}
